---
# Install the Komodo Periphery agent on the on-premise Docker hosts so Komodo
# Core (on docker-internal) can deploy compose Stacks from the docker-stacks repo.
# No-ops on any host until komodo_periphery_core_public_keys is set (group_vars).
- name: Deploy Komodo Periphery
  hosts: dockerhost:docker_internal:docker_secure:homeassistant
  become: true
  roles:
    - komodo_periphery
  tags: [komodo, gitops, apps]
