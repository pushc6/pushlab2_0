---
# Master Playbook
# This playbook orchestrates the execution of all other playbooks based on host groups.
# Semaphore should point to this playbook.

- name: Run Common Setup
  import_playbook: common_setup.yml
  tags: ["setup", "users"]

- name: Install Docker
  import_playbook: docker.yml
  when: "'docker_hosts' in groups"
  tags: ["docker", "apps"]

# Mount the tiered NFS storage (/srv/docker/san) on docker hosts. No-op on a host
# that does not define nfs_client_mounts. Add docker_secure / dockerhost here as
# they are migrated to the /srv/docker layout (docs/host-storage-migration.md).
- name: Mount NFS storage tiers on Docker hosts
  hosts: docker_internal
  become: true
  roles:
    - nfs_client
  tags: ["nfs", "storage"]

- name: Deploy Firewall Hardening
  hosts: all:!opnsense
  become: true
  roles:
    - firewall_hardened
  tags: ["firewall", "security"]

- name: Deploy Tailscale
  hosts: all:!opnsense
  become: true
  roles:
    - tailscale
  tags: ["tailscale", "networking"]

- name: Deploy CrowdSec
  hosts: all:!opnsense
  become: true
  roles:
    - crowdsec
  tags: ["crowdsec", "security"]

- name: Run System Updates
  import_playbook: update_all.yml
  tags: ["updates", "security"]

- name: Run Gitea Configuration
  import_playbook: gitea.yml
  when: "'gitea' in hostvars"
  tags: ["gitea", "apps"]

- name: Run Manual Host Onboarding
  import_playbook: onboard_manual.yml
  when: "'manual' in groups"
  tags: ["onboard", "manual"]

- name: Deploy Technitium
  import_playbook: technitium.yml
  when: "'dns02' in hostvars"
  tags: ["technitium", "apps"]

- name: Deploy Komodo Periphery
  import_playbook: komodo-periphery.yml
  when: "'dockerhost' in groups or 'docker_internal' in groups or 'docker_secure' in groups or 'homeassistant' in groups"
  tags: ["komodo", "gitops", "apps"]
