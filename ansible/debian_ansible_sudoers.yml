---
# Playbook: Configure ansible user for Debian systems
# Description: Adds ansible user to sudo group, configures passwordless sudo, and locks the account
# Usage: ansible-playbook -i inventory_file debian_ansible_config.yml
- name: Configure ansible user for Debian systems
  hosts: all:!opnsense
  become: true
  gather_facts: true

  # Only run this playbook on Debian family distributions
  tasks:
    - name: Check if system is Debian based
      ansible.builtin.fail:
        msg: "This playbook is intended for Debian-based systems only"
      when: ansible_os_family != "Debian"

    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: sudo
        state: present

    - name: Add ansible user to sudo group
      ansible.builtin.user:
        name: ansible
        groups: sudo
        append: true

    - name: Ensure /etc/sudoers.d directory exists
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ansible
        line: "ansible       ALL = (ALL) NOPASSWD: ALL"
        state: present
        create: true
        mode: "0440"
        owner: root
        group: root
        validate: "/usr/sbin/visudo -cf %s"

    - name: Lock ansible user password
      ansible.builtin.command: passwd -l ansible
      register: lock_result
      changed_when: lock_result.rc == 0
      failed_when: lock_result.rc != 0

    - name: Verify ansible user is in sudo group
      ansible.builtin.command: id ansible
      register: id_output
      changed_when: false

    - name: Verify sudo configuration
      ansible.builtin.command: sudo -l -U ansible
      register: sudo_output
      changed_when: false

    - name: Verify user is locked
      ansible.builtin.shell:
        cmd: set -o pipefail && passwd -S ansible | grep -q "L"
        executable: /bin/bash
      register: lock_check
      changed_when: false
      failed_when: false

    - name: Display verification results
      ansible.builtin.debug:
        msg:
          - "User groups: {{ id_output.stdout }}"
          - "Sudo privileges: {{ sudo_output.stdout_lines }}"
          - "Account locked: {{ 'Yes' if lock_check.rc == 0 else 'No (issue detected)' }}"

    - name: Restart sshd service
      ansible.builtin.service:
        name: sshd
        state: restarted
