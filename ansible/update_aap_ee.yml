---
- name: Update AAP Execution Environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_url: "{{ lookup('env', 'AAP_URL') }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    # Credentials for pulling the image
    registry_url: "{{ lookup('env', 'REGISTRY_URL') }}"
    registry_user: "{{ lookup('env', 'REGISTRY_USER') }}"
    registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"
    
    ee_name: "AlmaLinux EE"
    ee_image: "{{ registry_url }}/{{ lookup('env', 'IMAGE_NAME') }}:latest"

  tasks:
    - name: Ensure Registry Credential exists
      ansible.controller.credential:
        controller_host: "{{ aap_url }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        name: "Gitea Registry"
        organization: "Default"
        credential_type: "Container Registry"
        inputs:
          host: "{{ registry_url }}"
          username: "{{ registry_user }}"
          password: "{{ registry_password }}"
          verify_ssl: true

    - name: Ensure Execution Environment exists and is updated
      ansible.controller.execution_environment:
        controller_host: "{{ aap_url }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        name: "{{ ee_name }}"
        image: "{{ ee_image }}"
        pull: "always"
        credential: "Gitea Registry"
        organization: "Default"
        state: present
