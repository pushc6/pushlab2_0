---
# =============================================================================
# OPNsense Firewall Configuration Playbook
# =============================================================================
#
# USAGE:
#   ansible-playbook -i inventories/opnsense/hosts.yml opnsense.yml
#
# This playbook uses the ansibleguy.opnsense collection to push firewall
# rules via API - it does NOT SSH into the device.
#
# =============================================================================

- name: Configure OPNsense Firewall
  hosts: opnsense
  gather_facts: false
  connection: local # ansibleguy.opnsense modules use API, not SSH

  pre_tasks:
    # ansibleguy.opnsense modules import httpx at module load time. When
    # Semaphore runs this without the EE, the worker is missing it. Force the
    # install to run even when the template is invoked with --check.
    - name: Ensure httpx is installed on the controller
      ansible.builtin.pip:
        name: httpx
        state: present
        extra_args: "--break-system-packages"
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      check_mode: false

  roles:
    - opnsense_firewall
