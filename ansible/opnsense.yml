---
# =============================================================================
# OPNsense Firewall Configuration Playbook
# =============================================================================
#
# USAGE:
#   ansible-playbook -i inventories/opnsense/hosts.yml opnsense.yml
#
# This playbook uses the ansibleguy.opnsense collection to push firewall
# rules via API - it does NOT SSH into the device.
#
# =============================================================================

- name: Configure OPNsense Firewall
  hosts: opnsense
  gather_facts: false
  connection: local # ansibleguy.opnsense modules use API, not SSH

  pre_tasks:
    # ansibleguy.opnsense modules import httpx at module load time. When
    # Semaphore runs this without the EE, the worker is missing it.
    # Install must hit the same interpreter the modules execute under
    # (/usr/bin/python3 per inventories/opnsense/hosts.yml) AND land in
    # system site-packages — Ansiballz runs modules with `-s`, hiding
    # ~/.local. Hence become: true + --break-system-packages for PEP 668.
    - name: Ensure httpx is installed on the controller
      ansible.builtin.pip:
        name: httpx
        state: present
        extra_args: "--break-system-packages"
      become: true
      check_mode: false

  roles:
    - opnsense_firewall
