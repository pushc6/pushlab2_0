---
# =============================================================================
# OPNsense Firewall Configuration Playbook
# =============================================================================
#
# USAGE:
#   ansible-playbook -i inventories/opnsense/hosts.yml opnsense.yml
#
# This playbook uses the ansibleguy.opnsense collection to push firewall
# rules via API - it does NOT SSH into the device.
#
# =============================================================================

- name: Configure OPNsense Firewall
  hosts: opnsense
  gather_facts: false
  connection: local # ansibleguy.opnsense modules use API, not SSH

  pre_tasks:
    # ansibleguy.opnsense modules import httpx at module load time.
    # When Semaphore runs this without the EE, the worker is missing it.
    # Use ansible_playbook_python so install lands in the SAME interpreter the
    # collection's modules execute under; --break-system-packages handles PEP 668.
    - name: Ensure httpx is installed on the controller
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -m pip install --upgrade --break-system-packages httpx"
      register: opnsense_httpx_install
      changed_when: "'Successfully installed' in opnsense_httpx_install.stdout or 'Requirement already satisfied' not in opnsense_httpx_install.stdout"
      run_once: true

  roles:
    - opnsense_firewall
