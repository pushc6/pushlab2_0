[defaults]
# All paths in this file are RELATIVE to the directory ansible is invoked from.
# In practice we always invoke from the repo's `ansible/` directory or an EE
# whose working dir is `ansible/`. If that ever changes, prefer setting
# ANSIBLE_* environment variables over making absolute paths here.

roles_path = roles
# group_vars_path / host_vars_path are intentionally unset so Ansible reads
# them relative to each inventory file (the default behavior).

inventory = inventories/prod/hosts.yml
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False

# Override at runtime with ANSIBLE_PRIVATE_KEY_FILE=/path/to/key when the
# default `ssh_key` path is not present (e.g. local dev).
private_key_file = ssh_key
localhost_warning = False

# 20 is aggressive for our ~15-host inventory; consider lowering to 10 if
# flaky tasks are getting masked by parallel runs.
forks = 20

[ssh_connection]
# Keepalives prevent firewall/NAT idle drops during long silent dpkg/dnf
# trigger phases (5 min of unanswered keepalives before the client gives up).
# ControlPersist multiplexes follow-up connections, including async polls.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes
pipelining = True
