---
# tasks/issue_cert.yml - Issue and deploy a single certificate

- name: "Set certificate variables for {{ cert.domain }}"
  ansible.builtin.set_fact:
    acme_sh_cert_domain: "{{ cert.domain }}"
    acme_sh_cert_wildcard: "{{ cert.wildcard | default(false) }}"
    acme_sh_cert_key_length: "{{ cert.key_length | default(acme_sh_default_key_length) }}"
    acme_sh_cert_ecc_suffix: "{{ '_ecc' if (cert.key_length | default(acme_sh_default_key_length)) in ['ec-256', 'ec-384'] else '' }}"

- name: "Check if certificate exists in acme.sh for {{ acme_sh_cert_domain }}"
  ansible.builtin.command:
    cmd: "{{ acme_sh_install_dir }}/acme.sh --list"
  register: acme_sh_cert_list
  changed_when: false

- name: "Check if certificate file actually exists for {{ acme_sh_cert_domain }}"
  ansible.builtin.stat:
    path: "{{ acme_sh_install_dir }}/{{ acme_sh_cert_domain }}{{ acme_sh_cert_ecc_suffix }}/{{ acme_sh_cert_domain }}.cer"
  register: acme_sh_cert_file_check

- name: "Clean up failed/partial issuance for {{ acme_sh_cert_domain }}"
  when:
    - acme_sh_cert_domain in acme_sh_cert_list.stdout
    - not acme_sh_cert_file_check.stat.exists
  block:
    - name: "Remove failed cert from acme.sh registry for {{ acme_sh_cert_domain }}"
      ansible.builtin.command:
        cmd: "{{ acme_sh_install_dir }}/acme.sh --remove -d {{ acme_sh_cert_domain }}"
      register: acme_sh_remove_result
      failed_when: false
      changed_when: "'has been removed' in acme_sh_remove_result.stdout"

    - name: "Clean up partial certificate directory for {{ acme_sh_cert_domain }}"
      ansible.builtin.file:
        path: "{{ acme_sh_install_dir }}/{{ acme_sh_cert_domain }}{{ acme_sh_cert_ecc_suffix }}"
        state: absent

    - name: "Update acme_sh_cert_list after cleanup"
      ansible.builtin.set_fact:
        acme_sh_cert_needs_issue: true

- name: "Set acme_sh_cert_needs_issue flag"
  ansible.builtin.set_fact:
    acme_sh_cert_needs_issue: "{{ acme_sh_cert_domain not in acme_sh_cert_list.stdout or (acme_sh_cert_needs_issue | default(false)) }}"

- name: "Check if certificate is already deployed for {{ acme_sh_cert_domain }}"
  ansible.builtin.stat:
    path: "{{ acme_sh_cert_deploy_dir }}/{{ acme_sh_cert_domain }}/{{ acme_sh_cert_domain }}.fullchain.cer"
  register: acme_sh_cert_deployed

- name: "Issue certificate for {{ acme_sh_cert_domain }}"
  ansible.builtin.command:
    cmd: >
      {{ acme_sh_install_dir }}/acme.sh --issue
      --dns {{ acme_sh_dns_provider }}
      -d {{ acme_sh_cert_domain }}
      {% if acme_sh_cert_wildcard %}-d '*.{{ acme_sh_cert_domain }}'{% endif %}
      --keylength {{ acme_sh_cert_key_length }}
      --server {{ acme_sh_default_ca }}
  register: acme_sh_issue_result
  changed_when: "'Cert success' in acme_sh_issue_result.stdout"
  failed_when:
    - acme_sh_issue_result.rc != 0
    - "'Domains not changed' not in acme_sh_issue_result.stdout"
    - "'Skip' not in acme_sh_issue_result.stdout"
    - "'already renewed' not in acme_sh_issue_result.stdout.lower()"
  when: acme_sh_cert_needs_issue | bool

- name: "Deploy certificate for {{ acme_sh_cert_domain }}"
  ansible.builtin.command:
    cmd: >
      {{ acme_sh_install_dir }}/acme.sh --install-cert
      -d {{ acme_sh_cert_domain }}
      {% if acme_sh_cert_wildcard %}-d '*.{{ acme_sh_cert_domain }}'{% endif %}
      --key-file {{ acme_sh_cert_deploy_dir }}/{{ acme_sh_cert_domain }}/{{ acme_sh_cert_domain }}.key
      --cert-file {{ acme_sh_cert_deploy_dir }}/{{ acme_sh_cert_domain }}/{{ acme_sh_cert_domain }}.cer
      --fullchain-file {{ acme_sh_cert_deploy_dir }}/{{ acme_sh_cert_domain }}/{{ acme_sh_cert_domain }}.fullchain.cer
      --reloadcmd "{{ acme_sh_reload_cmd }}"
  register: acme_sh_deploy_result
  changed_when: "'Installing' in acme_sh_deploy_result.stdout or 'Reload' in acme_sh_deploy_result.stdout"
  when: >
    (acme_sh_issue_result is defined and acme_sh_issue_result.changed) or
    (not acme_sh_cert_deployed.stat.exists)
  notify: reload nginx
