---
# defaults/main.yml - acme.sh role defaults

# acme.sh installation
acme_sh_install_dir: "/root/.acme.sh"
acme_sh_git_repo: "https://github.com/acmesh-official/acme.sh.git"

# Default CA server (Let's Encrypt)
acme_sh_default_ca: "https://acme-v02.api.letsencrypt.org/directory"

# Default key length for new certificates
# Options: "2048", "4096", "ec-256", "ec-384"
acme_sh_default_key_length: "ec-256"

# Auto-upgrade acme.sh
acme_sh_auto_upgrade: true

# Certificate deployment paths
acme_sh_cert_deploy_dir: "/etc/nginx/ssl"

# Nginx reload command after cert deployment
acme_sh_reload_cmd: "systemctl reload nginx"

# DNS provider (currently only cloudflare supported)
acme_sh_dns_provider: "dns_cf"

# Generate dhparams if not exists
acme_sh_generate_dhparams: true
acme_sh_dhparams_bits: 2048
