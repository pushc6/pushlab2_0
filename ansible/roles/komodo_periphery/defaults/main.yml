---
# Komodo Periphery agent. Runs as a Docker container on each managed Docker host
# and lets Komodo Core deploy/redeploy compose Stacks here. See docker-stacks repo
# for Core + the docker-stacks GitOps source of truth.
# v2.x: keep in sync with komodo-core in docker-stacks (docker-internal/komodo).
komodo_periphery_image: "ghcr.io/moghtech/komodo-periphery:2.2.0"

# Komodo v2 PKI: Core's Ed25519 public key(s) that this Periphery will trust
# (replaces the v1 shared passkey). Read from Core (Settings -> Keys, or the
# /config/keys volume) and set once at group level -- it is the same Core for
# every host. NOT secret (a public key), so a plain group_var, no vault needed.
# Empty list = role no-ops (safe to leave wired into site.yml before Core exists).
komodo_periphery_core_public_keys: []

# Port the agent listens on for Core (https).
komodo_periphery_port: 8120

# Host IP to bind the published Periphery port to. Empty = all interfaces (0.0.0.0,
# the default). On public hosts set this to the host's Tailscale IP so 8120 is
# tailnet-only -- a published Docker port bypasses firewalld/nftables, so the bind
# address (not a firewall rule) is the real control keeping it off the public NIC.
komodo_periphery_bind_address: ""

# Where Periphery clones repos and stores stack/deploy state on the host.
komodo_periphery_root_dir: "/etc/komodo"

# Only allow connections from Komodo Core's address (defense in depth; PKI is
# the real auth). Empty list = allow any source.
komodo_periphery_allowed_ips: []

# Host path bind-mounted at /config, where Periphery keeps its Ed25519 identity.
# The IMAGE defaults PERIPHERY_CONFIG_PATHS=/config and
# PERIPHERY_PRIVATE_KEY=file:/config/keys/periphery.key (baked into the Dockerfile, which is
# why neither appears anywhere in this repo), and entrypoint.sh mints the keypair there on
# first start. Left unmounted, that key lives in the container's writable layer and dies with
# any `docker rm` -- the agent then comes back with a NEW identity.
#
# Scope note (verified 2026-08-15, Komodo 2.2.0): this is HARDENING, not an outage fix. Core
# does not currently pin the Periphery public key -- info.public_key and
# info.attempted_public_key are empty on all five Server records, and the key appears nowhere
# in Core's database -- so an agent that regenerates its keypair is still accepted. Trust runs
# one way: Periphery verifies Core via PERIPHERY_CORE_PUBLIC_KEYS, not the reverse. Those two
# schema fields exist though, so pinning may activate in a later version; persisting the key
# keeps it backup-able and auditable and costs nothing. Do NOT treat a lost key as an
# incident on current versions. Deliberately NOT nested
# under komodo_periphery_root_dir: that path is already bind-mounted at /etc/komodo for
# stack/repo state, and nesting would surface the same files at two paths in the container.
komodo_periphery_config_dir: "/var/lib/komodo-periphery"

# Make dockerd wait for the tailnet address before starting. Only needed where
# komodo_periphery_bind_address is a Tailscale IP: dockerd publishing to an address that does
# not exist yet silently produces a container with NO network endpoint (only lo, no eth0, no
# docker-proxy) while the container still reports "Up", so restart_policy never retries.
# Opt-in per host -- pointless anywhere the bind address is empty or a static LAN IP.
komodo_periphery_docker_wait_for_tailscale: false

# Upper bound on that wait, in seconds. On expiry dockerd starts ANYWAY (the drop-in's
# ExecStartPre is prefixed with '-'), so a Tailscale outage can never permanently block boot.
komodo_periphery_tailscale_wait_timeout: 60

# DNS resolver(s) for the Periphery container. Empty = inherit the daemon default.
# Required on hosts that are their OWN resolver (e.g. a Technitium DNS host whose
# /etc/resolv.conf is "nameserver 127.0.0.1"): Docker strips loopback nameservers,
# leaving the container unable to resolve internal names like git.push-lab.com, so
# the git clone for stacks fails. Point it at a real LAN IP the host's DNS answers on.
komodo_periphery_dns: []

# Static hosts entries injected into the Periphery container (docker --add-host).
# Map name -> IP, e.g. {"git.push-lab.com": "10.37.70.24"}.
#
# Needed where the host can REACH an internal service but cannot RESOLVE its name --
# a host that is routable to the service by IP while its resolver knows nothing about
# the internal zone. It fixes one name in one container, so prefer a Tailscale Split
# DNS route where the host is on the tailnet (see below); keep this for hosts where
# that is not an option.
#
# The off-LAN VPS used to need it for git.push-lab.com and no longer does: a Split DNS
# route (git.push-lab.com -> 10.37.70.2, Technitium on docker-secure) now resolves it
# for the whole node, so the map is empty there. That took three things in agreement --
# the Split DNS entry, a subnet route to the resolver advertised by docker-internal AND
# approved in the admin console, and an ACL grant to the resolver on :53. Without the
# grant the coordination server strips the route from the node netmap and it never
# installs, which presents exactly like an approval that did not take.
#
# komodo_periphery_dns is the sibling knob and is NOT a substitute: it points the
# container at a resolver, so it only helps when such a resolver is already routable.
komodo_periphery_etc_hosts: {}

# Host-level nftables guard restricting the published Periphery port to Core only.
#
# Why not DOCKER-USER (the usual hook): tailscale's filter/ts-forward chain sits at
# FORWARD position 1 and ends with `-m mark --mark 0x40000 -j ACCEPT`, which terminates
# FORWARD traversal for ALL tailnet traffic before Docker's chains are reached. Measured
# 2026-08-22: with traffic flowing, ts-forward counted +36 packets while DOCKER-USER and
# DOCKER-FORWARD stayed frozen -- a DOCKER-USER rule here matches literally nothing.
#
# So the guard is its own nftables table at forward hook priority -20, which runs BEFORE
# both tailscale (priority 0) and Docker, and is immune to the iptables ordering race.
#
# NB: do NOT express this as a firewalld direct rule. `firewall-cmd --direct --add-rule`
# makes firewalld rebuild via iptables-restore and FLUSHES the filter and nat tables,
# taking every Docker and Tailscale chain with it (only a dockerd restart rebuilds them).
komodo_periphery_guard_enabled: false

# Bridge the Periphery container is published on (guard matches its oifname).
komodo_periphery_guard_bridge: "docker0"
