---
- name: Skip Periphery deploy when passkey is unset (pre-Komodo bootstrap)
  ansible.builtin.debug:
    msg: >-
      komodo_periphery_passkey is empty -- skipping Komodo Periphery deploy.
      Set it (vaulted, matching KOMODO_PASSKEY on Komodo Core) and re-run.
  when: komodo_periphery_passkey | length == 0

- name: Configure Komodo Periphery
  when: komodo_periphery_passkey | length > 0
  block:
    # Docker SDK for the community.docker module. OS-aware: Debian/Ubuntu has a
    # packaged SDK (python3-docker) and no pip by default; EL lacks the package
    # (EPEL 10) so pip is the portable route (--break-system-packages for PEP 668).
    - name: Ensure Python Docker SDK is present (Debian/Ubuntu)
      ansible.builtin.apt:
        name: python3-docker
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure Python Docker SDK is present (EL/other via pip)
      ansible.builtin.pip:
        name: docker
        state: present
        extra_args: --break-system-packages
      when: ansible_os_family != "Debian"

    - name: Ensure Komodo root directory exists
      ansible.builtin.file:
        path: "{{ komodo_periphery_root_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Komodo Periphery agent
      community.docker.docker_container:
        name: komodo-periphery
        image: "{{ komodo_periphery_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ komodo_periphery_port }}:8120"
        # Explicit resolver on hosts that are their own DNS (127.0.0.1 gets stripped
        # from container resolv.conf, breaking the stack git clone). omit = inherit.
        dns_servers: "{{ komodo_periphery_dns or omit }}"
        env:
          PERIPHERY_PASSKEYS: "{{ komodo_periphery_passkey }}"
          PERIPHERY_ROOT_DIRECTORY: "/etc/komodo"
          PERIPHERY_ALLOWED_IPS: "{{ komodo_periphery_allowed_ips | join(',') }}"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ komodo_periphery_root_dir }}:/etc/komodo"
          - "/proc:/proc"
