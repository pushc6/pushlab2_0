---
# Host-level nftables guard for the published Periphery port.
# See komodo_periphery_guard_enabled in defaults/main.yml for the rationale
# (and for why this is NOT a DOCKER-USER or firewalld direct rule).

- name: Ensure nftables config directory exists
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    mode: "0755"

- name: Install Periphery guard ruleset
  ansible.builtin.template:
    src: periphery-guard.nft.j2
    dest: /etc/nftables/periphery-guard.nft
    mode: "0644"
  notify: Reload periphery guard

- name: Install Periphery guard unit
  ansible.builtin.template:
    src: periphery-guard.service.j2
    dest: /etc/systemd/system/periphery-guard.service
    mode: "0644"
  notify: Reload periphery guard

- name: Enable and start Periphery guard
  ansible.builtin.systemd_service:
    name: periphery-guard.service
    enabled: true
    state: started
    daemon_reload: true
