---
# Set system hostname and update basic /etc/hosts mapping

- name: Determine desired hostname
  ansible.builtin.set_fact:
    system_hostname_desired: "{{ system_hostname | default(inventory_hostname, true) }}"

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ system_hostname_desired }}"

- name: Ensure /etc/hostname reflects desired hostname
  ansible.builtin.template:
    src: hostname.j2
    dest: /etc/hostname
    owner: root
    group: root
    mode: "0644"

- name: Get primary IP used by Ansible
  ansible.builtin.set_fact:
    system_hostname_primary_ip: "{{ hostvars[inventory_hostname].ansible_host | default(ansible_facts['default_ipv4']['address'] | default('127.0.1.1')) }}"

- name: Ensure /etc/hosts has hostname mapping
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ system_hostname_primary_ip | regex_escape() }}\\s+"
    line: "{{ system_hostname_primary_ip }} {{ system_hostname_desired }} {{ system_hostname_desired.split('.')[0] }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
