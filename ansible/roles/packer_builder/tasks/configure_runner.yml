---
# Configure and register Gitea Actions Runner

- name: Create runner data directory
  ansible.builtin.file:
    path: "{{ gitea_runner_data_dir }}"
    state: directory
    mode: "0755"

- name: Check if runner is already registered
  ansible.builtin.stat:
    path: "{{ gitea_runner_data_dir }}/.runner"
  register: runner_registration_file

- name: Register Gitea Actions Runner
  block:
    - name: Execute runner registration
      ansible.builtin.shell: |
        set -euo pipefail
        {{ act_runner_install_path }} register --no-interactive \
          --instance {{ gitea_instance_url }} \
          --token {{ gitea_runner_registration_token }} \
          --name {{ gitea_runner_name }} \
          --labels {{ gitea_runner_labels | join(',') }}
      args:
        chdir: "{{ gitea_runner_data_dir }}"
        creates: "{{ gitea_runner_data_dir }}/.runner"
        executable: /bin/bash
      no_log: true
      register: runner_registration

  rescue:
    - name: Display registration error
      ansible.builtin.debug:
        msg:
          - "Failed to register Gitea Actions runner"
          - "Instance URL: {{ gitea_instance_url }}"
          - "Runner Name: {{ gitea_runner_name }}"
          - "Please verify:"
          - "  - Gitea server is reachable"
          - "  - Registration token is valid"
          - "  - Labels are correctly formatted"

    - name: Fail with helpful message
      ansible.builtin.fail:
        msg: "Runner registration failed. See debug output above."

- name: Create systemd service for runner
  ansible.builtin.template:
    src: gitea-runner.service.j2
    dest: /etc/systemd/system/gitea-runner.service
    mode: "0644"
  notify: restart gitea-runner

- name: Enable and start runner service
  ansible.builtin.systemd:
    name: gitea-runner
    enabled: true
    state: started
    daemon_reload: true
