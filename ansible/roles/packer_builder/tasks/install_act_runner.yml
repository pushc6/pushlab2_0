---
# Install act_runner binary

- name: Check if act_runner is installed
  ansible.builtin.stat:
    path: "{{ packer_builder_act_runner_install_path }}"
  register: packer_builder_act_runner_binary

- name: Get current act_runner version
  ansible.builtin.command: "{{ packer_builder_act_runner_install_path }} --version"
  register: packer_builder_act_runner_current_version
  changed_when: false
  failed_when: false
  when: packer_builder_act_runner_binary.stat.exists

- name: Set act_runner installation required fact
  ansible.builtin.set_fact:
    packer_builder_act_runner_install_required: >-
      {{ not packer_builder_act_runner_binary.stat.exists or
         packer_builder_act_runner_version not in packer_builder_act_runner_current_version.stdout | default('') }}

- name: Download act_runner {{ packer_builder_act_runner_version }}
  ansible.builtin.get_url:
    url: "{{ packer_builder_act_runner_download_url }}"
    dest: "{{ packer_builder_act_runner_install_path }}"
    mode: "0755"
  when: packer_builder_act_runner_install_required | bool
  register: packer_builder_act_runner_download

- name: Verify act_runner installation
  ansible.builtin.command: "{{ packer_builder_act_runner_install_path }} --version"
  changed_when: false
  register: packer_builder_act_runner_verify

- name: Display act_runner version
  ansible.builtin.debug:
    msg: "Installed act_runner: {{ packer_builder_act_runner_verify.stdout }}"
