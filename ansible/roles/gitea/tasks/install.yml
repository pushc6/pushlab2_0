---
# Install and configure Gitea on AlmaLinux 10
# Defaults assume SQLite, HTTP on :3000, Actions enabled.

- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - tar
      - git
    state: present

# Firewall configuration removed - managed by firewall_hardened role
# Configure firewall_services in host_vars/<hostname>.yml instead:
#   firewall_services:
#     - port: "{{ gitea_http_port }}"
#       protocol: tcp
#       name: "Gitea HTTP"
#       access: public
#     - port: "{{ gitea_ssh_port }}"
#       protocol: tcp
#       name: "Gitea SSH"
#       access: public

- name: Create git user and directories
  ansible.builtin.user:
    name: git
    system: true
    shell: /bin/bash
    create_home: true

- name: Create Gitea directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('git') }}"
    group: "{{ item.group | default('git') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "/etc/gitea", owner: root, group: root, mode: "0755" }
    - { path: "/var/lib/gitea", owner: git, group: git, mode: "0755" }
    - { path: "/var/lib/gitea/data", owner: git, group: git, mode: "0755" }
    - { path: "/var/lib/gitea/custom", owner: git, group: git, mode: "0755" }
    - { path: "/var/log/gitea", owner: git, group: git, mode: "0755" }

# Discover installed Gitea version (if any)
- name: Check if Gitea binary exists
  ansible.builtin.stat:
    path: "{{ gitea_binary_path }}"
  register: gitea_bin_stat

- name: Get installed Gitea version
  ansible.builtin.command: "{{ gitea_binary_path }} --version"
  register: gitea_version_cmd
  changed_when: false
  failed_when: false
  when: gitea_bin_stat.stat.exists

- name: Parse installed Gitea version
  ansible.builtin.set_fact:
    gitea_installed_version: '{{ (gitea_version_cmd.stdout | default("") | regex_search("([0-9]+\\.[0-9]+\\.[0-9]+)")) | default("") }}'
  when: gitea_bin_stat.stat.exists

# Optionally resolve latest version from API
- name: Resolve latest Gitea version from API
  ansible.builtin.uri:
    url: "{{ gitea_release_api_url }}"
    method: GET
    return_content: true
    status_code: 200
    validate_certs: true
  register: gitea_release_api
  failed_when: false
  when: (gitea_auto_update | bool) or (gitea_version | string | lower == 'latest')

- name: Set effective Gitea version (from API when requested)
  ansible.builtin.set_fact:
    gitea_effective_version: "{{
      (
        ((gitea_release_api.content | from_json).tag_name | regex_replace('^v',''))
      )
      if (
        ((gitea_auto_update | bool) or (gitea_version | lower == 'latest')) and
        (gitea_release_api is defined) and (gitea_release_api.status | default(0)) == 200 and
        (gitea_release_api.content | default('')) | length > 0
      ) else gitea_version
    }}"

- name: Build effective download URL
  ansible.builtin.set_fact:
    gitea_effective_download_url: "https://dl.gitea.com/gitea/{{ gitea_effective_version }}/gitea-{{ gitea_effective_version }}-linux-amd64"

- name: Decide if Gitea update is needed
  ansible.builtin.set_fact:
    gitea_update_needed: "{{ (not gitea_bin_stat.stat.exists) or (gitea_installed_version | default('') != gitea_effective_version) }}"

- name: Ensure backup directory exists (when backup enabled)
  ansible.builtin.file:
    path: "{{ gitea_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Stop Gitea service before upgrade
  ansible.builtin.systemd:
    name: gitea
    state: stopped
  when: gitea_update_needed | bool

- name: Backup Gitea config and data (tar.gz)
  ansible.builtin.shell: >-
    set -euo pipefail &&
    tar -C / -czf {{ gitea_backup_dir }}/gitea-backup-{{ ansible_date_time.epoch }}.tar.gz {{ gitea_backup_include | join(' ') }}
  changed_when: true
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Backup existing Gitea binary before update
  ansible.builtin.copy:
    src: "{{ gitea_binary_path }}"
    dest: "{{ gitea_binary_path }}.bak-{{ gitea_installed_version | default('unknown') }}-{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "0755"
  when: gitea_bin_stat.stat.exists and (gitea_update_needed | bool)

- name: Download Gitea binary (effective)
  ansible.builtin.get_url:
    url: "{{ gitea_effective_download_url }}"
    dest: "{{ gitea_binary_path }}"
    mode: "0755"
    force: true
  register: gitea_binary_download
  when: gitea_update_needed | bool
  notify: gitea_restart

- name: Install systemd unit for Gitea
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - gitea_reload_systemd
    - gitea_restart

- name: Render Gitea config
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/gitea/app.ini
    owner: git
    group: git
    mode: "0660"
  notify: gitea_restart

- name: Ensure Gitea data directory ownership
  ansible.builtin.file:
    path: /var/lib/gitea
    state: directory
    owner: git
    group: git
    recurse: true

- name: Enable and start Gitea
  ansible.builtin.systemd:
    name: gitea
    enabled: true
    state: started
