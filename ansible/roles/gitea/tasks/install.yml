---
# Install and configure Gitea on AlmaLinux 10
# Defaults assume SQLite, HTTP on :3000, Actions enabled.

- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - tar
      - git
    state: present

# Firewall configuration removed - managed by firewall_hardened role
# Configure firewall_hardened_services in host_vars/<hostname>.yml instead:
#   firewall_hardened_services:
#     - port: "{{ gitea_http_port }}"
#       protocol: tcp
#       name: "Gitea HTTP"
#       access: public
#     - port: "{{ gitea_ssh_port }}"
#       protocol: tcp
#       name: "Gitea SSH"
#       access: public

- name: Create git user and directories
  ansible.builtin.user:
    name: git
    system: true
    shell: /bin/bash
    create_home: true

- name: Create Gitea directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('git') }}"
    group: "{{ item.group | default('git') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "/etc/gitea", owner: root, group: root, mode: "0755" }
    - { path: "/var/lib/gitea", owner: git, group: git, mode: "0755" }
    - { path: "/var/lib/gitea/data", owner: git, group: git, mode: "0755" }
    - { path: "/var/lib/gitea/custom", owner: git, group: git, mode: "0755" }
    - { path: "/var/log/gitea", owner: git, group: git, mode: "0755" }

# Discover installed Gitea version (if any)
- name: Check if Gitea binary exists
  ansible.builtin.stat:
    path: "{{ gitea_binary_path }}"
  register: gitea_bin_stat

- name: Get installed Gitea version
  ansible.builtin.command: "{{ gitea_binary_path }} --version"
  register: gitea_version_cmd
  changed_when: false
  failed_when: false
  when: gitea_bin_stat.stat.exists

- name: Parse installed Gitea version
  ansible.builtin.set_fact:
    # default('', true) coalesces a no-match (regex_search -> None) to '' so
    # downstream length checks are safe even when the version probe is skipped.
    gitea_installed_version: '{{ (gitea_version_cmd.stdout | default("") | regex_search("([0-9]+\\.[0-9]+\\.[0-9]+)")) | default("", true) }}'
  when: gitea_bin_stat.stat.exists

# Optionally resolve latest version from API
- name: Resolve latest Gitea version from API
  ansible.builtin.uri:
    url: "{{ gitea_release_api_url }}"
    method: GET
    return_content: true
    status_code: 200
    validate_certs: true
  register: gitea_release_api
  failed_when: false
  when: (gitea_auto_update | bool) or (gitea_version | string | lower == 'latest')

- name: Set effective Gitea version (from API when requested)
  ansible.builtin.set_fact:
    gitea_effective_version: >-
      {{ ((gitea_release_api.content | from_json).tag_name | regex_replace('^v', ''))
         if (
              ((gitea_auto_update | bool) or (gitea_version | lower == 'latest'))
              and (gitea_release_api is defined)
              and (gitea_release_api.status | default(0)) == 200
              and (gitea_release_api.content | default('')) | length > 0
         )
         else gitea_version
      }}

- name: Build effective download URL
  ansible.builtin.set_fact:
    gitea_effective_download_url: "https://dl.gitea.com/gitea/{{ gitea_effective_version }}/gitea-{{ gitea_effective_version }}-linux-amd64"

# Only upgrade when we KNOW the installed version and it differs (or the binary
# is absent). A failed/empty version probe (e.g. a full disk preventing module
# staging) must NOT be treated as "needs upgrade" -- doing so previously stopped
# Gitea and then failed mid-backup, causing an outage.
- name: Decide if Gitea update is needed
  ansible.builtin.set_fact:
    gitea_update_needed: >-
      {{ (not gitea_bin_stat.stat.exists)
         or (
              (gitea_installed_version | default('') | length > 0)
              and (gitea_installed_version != gitea_effective_version)
            ) }}

- name: Ensure backup directory exists (when backup enabled)
  ansible.builtin.file:
    path: "{{ gitea_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

# Pre-flight the backup BEFORE stopping Gitea, so an out-of-space condition aborts
# the run while Gitea is still serving -- never leaving it stopped on a failed backup.
- name: Measure backup source size (bytes)
  ansible.builtin.shell: "set -o pipefail; du -sbc {{ gitea_backup_include | join(' ') }} | tail -1 | cut -f1"
  args:
    executable: /bin/bash
  register: gitea_backup_src_bytes
  changed_when: false
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Measure free space on backup filesystem (bytes)
  ansible.builtin.shell: "df -PB1 {{ gitea_backup_dir }} | awk 'NR==2 {print $4}'"
  register: gitea_backup_free_bytes
  changed_when: false
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Abort upgrade if insufficient space for backup (Gitea still running)
  ansible.builtin.assert:
    that:
      - (gitea_backup_free_bytes.stdout | int) > (gitea_backup_src_bytes.stdout | int)
    fail_msg: >-
      Refusing to upgrade: {{ gitea_backup_dir }} has
      {{ gitea_backup_free_bytes.stdout | int }} bytes free but the backup source
      is {{ gitea_backup_src_bytes.stdout | int }} bytes. Free space (or point
      gitea_backup_dir at a larger filesystem) and re-run. Gitea was NOT stopped.
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Backup Gitea config and data (tar.gz)
  ansible.builtin.shell: >-
    set -euo pipefail &&
    tar -C / -czf {{ gitea_backup_dir }}/gitea-backup-{{ ansible_date_time.epoch }}.tar.gz {{ gitea_backup_include | join(' ') }}
  changed_when: true
  when: (gitea_backup_before_upgrade | bool) and (gitea_update_needed | bool)

- name: Backup existing Gitea binary before update
  ansible.builtin.copy:
    src: "{{ gitea_binary_path }}"
    dest: "{{ gitea_binary_path }}.bak-{{ gitea_installed_version | default('unknown') }}-{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "0755"
  when: gitea_bin_stat.stat.exists and (gitea_update_needed | bool)

- name: Stop Gitea service before upgrade
  ansible.builtin.systemd:
    name: gitea
    state: stopped
  when: gitea_update_needed | bool

- name: Download Gitea binary (effective)
  ansible.builtin.get_url:
    url: "{{ gitea_effective_download_url }}"
    dest: "{{ gitea_binary_path }}"
    mode: "0755"
    force: true
  register: gitea_binary_download
  when: gitea_update_needed | bool
  notify: gitea_restart

- name: Install systemd unit for Gitea
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - gitea_reload_systemd
    - gitea_restart

# Gitea generates INTERNAL_TOKEN and the oauth2 JWT_SECRET at install time and
# stores them in app.ini. The template does not own them, so we must preserve the
# existing values (or generate them on a fresh install) before re-rendering --
# otherwise re-rendering strips them, invalidating OAuth2/LFS/runner tokens.
- name: Check for existing Gitea config
  ansible.builtin.stat:
    path: /etc/gitea/app.ini
  register: gitea_appini_stat

- name: Slurp existing Gitea config to preserve generated secrets
  ansible.builtin.slurp:
    src: /etc/gitea/app.ini
  register: gitea_appini_existing
  when: gitea_appini_stat.stat.exists

- name: Preserve generated secrets from existing config
  ansible.builtin.set_fact:
    gitea_internal_token: "{{ ((_c | regex_findall('(?m)^INTERNAL_TOKEN\\s*=\\s*(.+?)\\s*$')) + ['']) | first }}"
    gitea_oauth2_jwt_secret: "{{ ((_c | regex_findall('(?m)^JWT_SECRET\\s*=\\s*(.+?)\\s*$')) + ['']) | first }}"
    gitea_lfs_jwt_secret: "{{ ((_c | regex_findall('(?m)^LFS_JWT_SECRET\\s*=\\s*(.+?)\\s*$')) + ['']) | first }}"
  vars:
    _c: "{{ gitea_appini_existing.content | b64decode }}"
  when: gitea_appini_stat.stat.exists
  no_log: true

- name: Generate INTERNAL_TOKEN on fresh install
  ansible.builtin.command: "{{ gitea_binary_path }} generate secret INTERNAL_TOKEN"
  register: gitea_gen_internal_token
  changed_when: false
  no_log: true
  when: gitea_internal_token | length == 0

- name: Generate oauth2 JWT_SECRET on fresh install
  ansible.builtin.command: "{{ gitea_binary_path }} generate secret JWT_SECRET"
  register: gitea_gen_jwt_secret
  changed_when: false
  no_log: true
  when: gitea_oauth2_jwt_secret | length == 0

- name: Generate LFS JWT_SECRET on fresh install
  ansible.builtin.command: "{{ gitea_binary_path }} generate secret JWT_SECRET"
  register: gitea_gen_lfs_secret
  changed_when: false
  no_log: true
  when: gitea_lfs_jwt_secret | length == 0

- name: Record freshly generated INTERNAL_TOKEN
  ansible.builtin.set_fact:
    gitea_internal_token: "{{ gitea_gen_internal_token.stdout | trim }}"
  when: gitea_gen_internal_token is not skipped
  no_log: true

- name: Record freshly generated oauth2 JWT_SECRET
  ansible.builtin.set_fact:
    gitea_oauth2_jwt_secret: "{{ gitea_gen_jwt_secret.stdout | trim }}"
  when: gitea_gen_jwt_secret is not skipped
  no_log: true

- name: Record freshly generated LFS JWT_SECRET
  ansible.builtin.set_fact:
    gitea_lfs_jwt_secret: "{{ gitea_gen_lfs_secret.stdout | trim }}"
  when: gitea_gen_lfs_secret is not skipped
  no_log: true

- name: Render Gitea config
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/gitea/app.ini
    owner: git
    group: git
    mode: "0660"
  notify: gitea_restart

- name: Ensure Gitea data directory ownership
  ansible.builtin.file:
    path: /var/lib/gitea
    state: directory
    owner: git
    group: git
    recurse: true

- name: Enable and start Gitea
  ansible.builtin.systemd:
    name: gitea
    enabled: true
    state: started
