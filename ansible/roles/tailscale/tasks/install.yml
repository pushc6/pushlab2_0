---
# Tailscale installation tasks

- name: Check if Tailscale is already installed
  ansible.builtin.command: which tailscale
  register: tailscale_installed
  changed_when: false
  failed_when: false

- name: Install Tailscale on RHEL/AlmaLinux
  when:
    - tailscale_installed.rc != 0
    - ansible_os_family == "RedHat"
  block:
    - name: Add Tailscale repository (RHEL/AlmaLinux)
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        baseurl: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_distribution_major_version }}/$basearch"
        gpgcheck: true
        gpgkey: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_distribution_major_version }}/repo.gpg"
        enabled: true

    - name: Install Tailscale package
      ansible.builtin.dnf:
        name: tailscale
        state: present

- name: Install Tailscale on Debian/Ubuntu
  when:
    - tailscale_installed.rc != 0
    - ansible_os_family == "Debian"
  block:
    - name: Install Tailscale via official script
      ansible.builtin.shell: |
        curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true
