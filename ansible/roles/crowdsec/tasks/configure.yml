---
# CrowdSec configuration tasks

# Handle legacy acquis.yaml - CrowdSec reads both acquis.yaml AND acquis.d/*.yaml
# If we're managing acquisition via acquis.d/, we need to remove the old wizard-generated acquis.yaml
- name: Check for legacy acquis.yaml
  ansible.builtin.stat:
    path: /etc/crowdsec/acquis.yaml
  register: legacy_acquis_file

- name: Backup and remove legacy acquis.yaml (managed via acquis.d/ now)
  when:
    - legacy_acquis_file.stat.exists
    - crowdsec_acquis | length > 0
  block:
    - name: Backup legacy acquis.yaml
      ansible.builtin.copy:
        src: /etc/crowdsec/acquis.yaml
        dest: /etc/crowdsec/acquis.yaml.wizard-backup
        remote_src: true
        force: false # Don't overwrite existing backup
        mode: "0640"
        owner: root
        group: root

    - name: Remove legacy acquis.yaml
      ansible.builtin.file:
        path: /etc/crowdsec/acquis.yaml
        state: absent
      notify: Restart crowdsec

# Install collections
- name: Get installed collections
  ansible.builtin.command: cscli collections list -o raw
  register: crowdsec_installed_collections
  changed_when: false

- name: Install CrowdSec collections
  ansible.builtin.command: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_collections }}"
  when: item not in crowdsec_installed_collections.stdout
  changed_when: true # cscli install is always state-changing when reached.
  notify: Restart crowdsec

# Enable remediation on timing-based SSH scenarios (lower-confidence, shorter ban)
- name: Enable remediation on ssh-time-based-bf
  ansible.builtin.copy:
    content: "remediation: true\n"
    dest: /etc/crowdsec/scenarios/ssh-time-based-bf.yaml.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart crowdsec

- name: Enable remediation on ssh-time-based-bf_user_enum
  ansible.builtin.copy:
    content: "remediation: true\n"
    dest: /etc/crowdsec/scenarios/ssh-time-based-bf_user_enum.yaml.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart crowdsec

# Configure acquisition sources
- name: Create acquisition configuration files
  ansible.builtin.template:
    src: acquis.yaml.j2
    dest: "/etc/crowdsec/acquis.d/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ crowdsec_acquis }}"
  when: crowdsec_acquis | length > 0
  notify: Restart crowdsec

# Remove acquisition files for sources not in config
- name: Find existing acquisition files
  ansible.builtin.find:
    paths: /etc/crowdsec/acquis.d
    patterns: "*.yaml"
  register: existing_acquis_files

- name: Remove unmanaged acquisition files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ existing_acquis_files.files }}"
  when:
    - crowdsec_acquis | length > 0
    - (item.path | basename | splitext | first) not in (crowdsec_acquis | map(attribute='name') | list)
  notify: Restart crowdsec

# Configure parser-stage whitelists (s02-enrich)
- name: Deploy parser whitelists
  ansible.builtin.template:
    src: parser-whitelist.yaml.j2
    dest: "/etc/crowdsec/parsers/s02-enrich/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ crowdsec_parser_whitelists }}"
  when: crowdsec_parser_whitelists | length > 0
  notify: Restart crowdsec
