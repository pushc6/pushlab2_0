---
# CrowdSec LAPI registration tasks (agent mode)

- name: Get current LAPI URL from credentials
  ansible.builtin.command: grep -E "^url:" /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_current_lapi_url
  changed_when: false
  failed_when: false

- name: Parse current LAPI URL
  ansible.builtin.set_fact:
    crowdsec_current_url: "{{ crowdsec_current_lapi_url.stdout | regex_replace('^url:\\s*', '') | trim }}"
  when: crowdsec_current_lapi_url.rc == 0

- name: Determine if registration needed
  ansible.builtin.set_fact:
    crowdsec_needs_registration: >-
      {{
        crowdsec_force_register or
        crowdsec_current_lapi_url.rc != 0 or
        crowdsec_current_url | default('') == 'http://127.0.0.1:8080' or
        crowdsec_current_url | default('') != crowdsec_lapi_url
      }}

- name: Display LAPI registration status
  ansible.builtin.debug:
    msg: |
      Current LAPI URL: {{ crowdsec_current_url | default('not configured') }}
      Desired LAPI URL: {{ crowdsec_lapi_url }}
      Needs Registration: {{ crowdsec_needs_registration }}

- name: Register with central LAPI
  when: crowdsec_needs_registration
  block:
    - name: Stop CrowdSec before re-registration
      ansible.builtin.systemd:
        name: "{{ crowdsec_service_name }}"
        state: stopped

    - name: Register machine with remote LAPI
      ansible.builtin.command: >-
        cscli lapi register
        --url {{ crowdsec_lapi_url }}
        --machine {{ crowdsec_machine_name }}
      register: crowdsec_register_result
      changed_when: true

    - name: Display registration result
      ansible.builtin.debug:
        msg: |
          ========================================
          CrowdSec Machine Registered
          ========================================
          Machine: {{ crowdsec_machine_name }}
          LAPI: {{ crowdsec_lapi_url }}

          IMPORTANT: You must approve this machine on the LAPI server:
            sudo cscli machines validate {{ crowdsec_machine_name }}

          Or list pending machines:
            sudo cscli machines list
          ========================================

    - name: Pause for manual approval
      ansible.builtin.pause:
        prompt: |

          Machine '{{ crowdsec_machine_name }}' registered with LAPI.

          Please approve on {{ crowdsec_lapi_url.split('//')[1].split(':')[0] }}:
            sudo cscli machines validate {{ crowdsec_machine_name }}

          Press ENTER after approving, or Ctrl+C then 'A' to abort
      when: crowdsec_wait_for_approval | default(true)

    - name: Disable local LAPI (agent mode uses remote LAPI only)
      ansible.builtin.lineinfile:
        path: /etc/crowdsec/config.yaml
        regexp: "^(\\s*)enable:\\s*true\\s*#.*local_api"
        line: "\\1enable: false  # local_api disabled - using remote LAPI"
        backrefs: true
      failed_when: false

    - name: Start CrowdSec with new LAPI configuration
      ansible.builtin.systemd:
        name: "{{ crowdsec_service_name }}"
        state: started

    - name: Wait for CrowdSec to connect
      ansible.builtin.pause:
        seconds: 5

    - name: Verify LAPI connection
      ansible.builtin.command: cscli lapi status
      register: crowdsec_lapi_verify
      retries: 3
      delay: 5
      until: crowdsec_lapi_verify.rc == 0
      changed_when: false
