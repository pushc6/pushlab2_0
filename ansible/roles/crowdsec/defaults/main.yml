---
# CrowdSec role defaults

# Enable/disable CrowdSec on this host
crowdsec_enabled: false

# Mode: "agent" (connects to remote LAPI), "lapi" (is the LAPI server), "standalone" (local LAPI)
crowdsec_mode: "agent"

# Central LAPI configuration (for agent mode)
crowdsec_lapi_url: "http://crowdsec.crane-beaver.ts.net:8080"
crowdsec_lapi_host: "crowdsec.localdomain"  # Ansible inventory name for LAPI server (for bouncer registration)
crowdsec_machine_name: "{{ inventory_hostname.split('.')[0] }}"

# Wait for manual machine approval during registration
crowdsec_wait_for_approval: true

# Collections to install (parsers + scenarios)
# See: https://hub.crowdsec.net/browse/
crowdsec_collections:
  - crowdsecurity/linux

# Acquisition sources - what logs to monitor
# Each entry creates a file in /etc/crowdsec/acquis.d/
crowdsec_acquis: []
# Example:
#   - name: nginx
#     filenames:
#       - /var/log/nginx/access.log
#       - /var/log/nginx/error.log
#     labels:
#       type: nginx
#   - name: sshd
#     journalctl_filter:
#       - "_SYSTEMD_UNIT=sshd.service"
#     labels:
#       type: syslog

# Bouncers to install and configure
crowdsec_bouncers: []
# Example:
#   - name: firewall
#     type: nftables       # nftables (recommended for RHEL 8+/AlmaLinux), iptables
#     enabled: true

# Package names by OS family (using CrowdSec repo packages)
crowdsec_packages:
  RedHat:
    agent: crowdsec
    bouncer_nftables: crowdsec-firewall-bouncer-nftables
    bouncer_iptables: crowdsec-firewall-bouncer-iptables
  Debian:
    agent: crowdsec
    bouncer_nftables: crowdsec-firewall-bouncer-nftables
    bouncer_iptables: crowdsec-firewall-bouncer-iptables

# Service names
crowdsec_service_name: crowdsec
crowdsec_bouncer_service_name: crowdsec-firewall-bouncer

# Force re-registration even if already registered
crowdsec_force_register: false

# =============================================================================
# Bouncer drift check (workaround for cs-firewall-bouncer #243)
# Detects when nftables sets silently drop IPs due to duplicate-entry timer bug
# =============================================================================
crowdsec_bouncer_drift_check_enabled: false
crowdsec_drift_check_interval: 10min
crowdsec_drift_check_nft_family: ip
crowdsec_drift_check_nft_table: crowdsec
crowdsec_drift_check_nft_set: crowdsec-blacklists

# =============================================================================
# Observability - Prometheus metrics & HTTP notifications
# =============================================================================

# Bind Prometheus metrics to network (default: 127.0.0.1)
# Set to "0.0.0.0" to expose for remote scraping
crowdsec_prometheus_listen_addr: ""

# HTTP notification plugin for sending alerts to external systems
# (e.g. VictoriaLogs jsonline endpoint)
crowdsec_http_notification:
  enabled: false
  # url: "http://10.37.70.25:9428/insert/jsonline?_stream_fields=source,action,scenario"
  # method: POST
  # group_wait: 30s
  # group_threshold: 5
  # max_retry: 3
  # timeout: 10s
  # headers:
  #   Content-Type: "application/stream+json"
  # format: |
  #   {{ range . -}}...{{ end -}}
