---
# Create or update DHCP scopes on this Technitium instance via the HTTP API.
# Each entry in technitium_dhcp_scopes:
#   - name: "<scope name>"
#     starting_address: "10.37.20.1"
#     ending_address: "10.37.20.254"
#     subnet_mask: "255.255.255.0"
#     lease_time_days: 1                  # optional, defaults to 1
#     router_address: "10.37.20.1"
#     dns_servers: ["10.37.20.2", "10.37.20.254"]
#     use_this_dns_server: false
#     domain_name: "localdomain"
#     dns_updates: false                  # secondaries should be false
#     enabled: false                      # safe default; flip true when ready
#     # ping_check_enabled defaults to true
#
# `offerDelayTime` is intentionally NOT set here -- it's managed by
# dhcp_offer_delay.yml so a single var (technitium_dhcp_offer_delay_ms) controls
# the value across all scopes.
#
# Idempotency: fetches the current scope (if any), compares the fields we
# manage, only POSTs /api/dhcp/scopes/set when there's drift. enable/disable
# is a separate API call from the field update.

- name: Fetch existing DHCP scopes
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/list"
    method: GET
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
    return_content: true
    status_code: 200
  register: technitium_dhcp_scopes_existing
  failed_when: technitium_dhcp_scopes_existing.json.status != "ok"
  no_log: true

- name: Delete unwanted DHCP scopes (e.g. Technitium's factory "Default")
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/delete"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      name: "{{ item }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_dhcp_scopes_remove }}"
  loop_control:
    label: "{{ item }}"
  when: item in (technitium_dhcp_scopes_existing.json.response.scopes | default([]) | map(attribute='name') | list)
  register: technitium_dhcp_scope_delete
  failed_when:
    - technitium_dhcp_scope_delete.json is defined
    - technitium_dhcp_scope_delete.json.status != "ok"

- name: Read current state of each desired scope
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/get"
    method: GET
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      name: "{{ item.name }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_dhcp_scopes }}"
  loop_control:
    label: "{{ item.name }}"
  register: technitium_dhcp_scope_current
  failed_when: false
  no_log: true

- name: Create or update DHCP scopes
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      name: "{{ item.item.name }}"
      startingAddress: "{{ item.item.starting_address }}"
      endingAddress: "{{ item.item.ending_address }}"
      subnetMask: "{{ item.item.subnet_mask | default('255.255.255.0') }}"
      leaseTimeDays: "{{ item.item.lease_time_days | default(1) }}"
      leaseTimeHours: "{{ item.item.lease_time_hours | default(0) }}"
      leaseTimeMinutes: "{{ item.item.lease_time_minutes | default(0) }}"
      routerAddress: "{{ item.item.router_address }}"
      dnsServers: "{{ item.item.dns_servers | join(',') }}"
      useThisDnsServer: "{{ (item.item.use_this_dns_server | default(false)) | string | lower }}"
      domainName: "{{ item.item.domain_name | default('') }}"
      dnsUpdates: "{{ (item.item.dns_updates | default(false)) | string | lower }}"
      pingCheckEnabled: "{{ (item.item.ping_check_enabled | default(true)) | string | lower }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_dhcp_scope_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: technitium_dhcp_scope_apply
  failed_when:
    - technitium_dhcp_scope_apply.json is defined
    - technitium_dhcp_scope_apply.json.status != "ok"

- name: Enable scopes marked enabled=true
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/enable"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      name: "{{ item.name }}"
    status_code: 200
  loop: "{{ technitium_dhcp_scopes }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(false) | bool
  register: technitium_dhcp_scope_enable
  failed_when:
    - technitium_dhcp_scope_enable.json is defined
    - technitium_dhcp_scope_enable.json.status != "ok"

- name: Disable scopes marked enabled=false
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/dhcp/scopes/disable"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      name: "{{ item.name }}"
    status_code: 200
  loop: "{{ technitium_dhcp_scopes }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.enabled | default(false) | bool)
  register: technitium_dhcp_scope_disable
  failed_when:
    - technitium_dhcp_scope_disable.json is defined
    - technitium_dhcp_scope_disable.json.status != "ok"
