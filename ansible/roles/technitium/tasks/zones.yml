---
# Declare Secondary zones on this Technitium instance via the HTTP API.
# Idempotent: checks `/api/zones/list` first and only POSTs `/api/zones/create`
# when the zone is absent.
#
# Note on ignoreSoaFailure=true: when Technitium creates a Secondary zone, it
# does a pre-flight SOA query against the listed primary. Under `network_mode:
# host` with Technitium itself bound to :53, that pre-flight can loop back
# through the local resolver and silently fail. Setting ignoreSoaFailure=true
# skips the pre-flight; the zone is created and AXFR retries in the background.
# AXFR will still fail if the primary's zone-transfer ACL doesn't permit this
# host (look for `isExpired=true` in the zone state).

- name: Fetch existing zones from Technitium API
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/zones/list"
    method: GET
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
    return_content: true
    status_code: 200
  register: technitium_zones_list
  failed_when: technitium_zones_list.json.status != "ok"
  no_log: true

- name: Create missing Secondary zones
  ansible.builtin.uri:
    url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}/api/zones/create"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      zone: "{{ item.name }}"
      type: "Secondary"
      primaryNameServerAddresses: "{{ item.primary_addresses | join(',') }}"
      zoneTransferProtocol: "{{ item.transfer_protocol | default('Tcp') }}"
      ignoreSoaFailure: "true"
    return_content: true
    status_code: 200
  loop: "{{ technitium_secondary_zones }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.name not in (
      technitium_zones_list.json.response.zones
      | default([])
      | map(attribute='name')
      | list
    )
  register: technitium_zones_create
  failed_when:
    - technitium_zones_create.json is defined
    - technitium_zones_create.json.status != "ok"
