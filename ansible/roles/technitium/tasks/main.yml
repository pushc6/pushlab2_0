---
# Komodo-managed hosts retain the API configuration and reservation-sync tasks.
- name: Manage Technitium container with Ansible
  ansible.builtin.import_tasks: container.yml
  when: technitium_manage_container | bool

- name: Skip API configuration when token is unset (first-deploy bootstrap)
  ansible.builtin.debug:
    msg: >-
      technitium_api_token is empty -- skipping API config (apps, zones,
      DHCP scopes, offer delay, reservation sync). Generate a token in the
      web UI, set it as TECHNITIUM_API_TOKEN_DNS02 in Semaphore, then re-run.
  when: technitium_api_token | length == 0

- name: Wait for Technitium API to become reachable
  ansible.builtin.wait_for:
    host: "{{ technitium_api_host }}"
    port: "{{ technitium_api_port }}"
    timeout: 60
  when:
    - technitium_api_token | length > 0
    - >-
      technitium_secondary_zones | length > 0
      or technitium_reservation_sync_enabled
      or technitium_dhcp_offer_delay_ms | int > 0
      or technitium_dns_apps | length > 0
      or technitium_dhcp_scopes | length > 0
      or technitium_dns_local_endpoints | length > 0

- name: Apply server-level Technitium settings
  ansible.builtin.include_tasks: settings.yml
  when:
    - technitium_api_token | length > 0
    - technitium_dns_local_endpoints | length > 0
      or technitium_forwarders | length > 0
      or technitium_enable_dnssec_validation is not none

- name: Install and configure DNS Apps
  ansible.builtin.include_tasks: apps.yml
  when:
    - technitium_api_token | length > 0
    - technitium_dns_apps | length > 0

- name: Configure Secondary zones
  ansible.builtin.include_tasks: zones.yml
  when:
    - technitium_api_token | length > 0
    - technitium_secondary_zones | length > 0

- name: Create or update DHCP scopes
  ansible.builtin.include_tasks: dhcp_scopes.yml
  when:
    - technitium_api_token | length > 0
    - technitium_dhcp_scopes | length > 0

- name: Enforce DHCP offer delay on existing scopes
  ansible.builtin.include_tasks: dhcp_offer_delay.yml
  when:
    - technitium_api_token | length > 0
    - technitium_dhcp_offer_delay_ms | int > 0

- name: Configure DHCP reservation sync
  ansible.builtin.include_tasks: reservation_sync.yml
  when:
    - technitium_api_token | length > 0
    - technitium_reservation_sync_enabled
