---
- name: Ensure Technitium config directory exists
  ansible.builtin.file:
    path: "{{ technitium_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure pip is installed
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install Python Docker SDK via pip
  # EPEL 10 does not yet package python3-docker; pip is the portable path.
  # --break-system-packages is required on EL10 (PEP 668 externally-managed env).
  ansible.builtin.pip:
    name: docker
    state: present
    extra_args: --break-system-packages

- name: Deploy Technitium DNS Server
  community.docker.docker_container:
    name: dns-server
    image: "{{ technitium_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ technitium_config_dir }}:/etc/dns"
    env:
      DNS_SERVER_DOMAIN: "{{ technitium_dns_domain }}"
      DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: "{{ technitium_web_service_local_addresses }}"

- name: Wait for Technitium API to become reachable
  ansible.builtin.wait_for:
    host: "{{ technitium_api_host }}"
    port: "{{ technitium_api_port }}"
    timeout: 60
  when: >-
    technitium_secondary_zones | length > 0
    or technitium_reservation_sync_enabled
    or technitium_dhcp_offer_delay_ms | int > 0

- name: Configure Secondary zones
  ansible.builtin.include_tasks: zones.yml
  when: technitium_secondary_zones | length > 0

- name: Enforce DHCP offer delay on existing scopes
  ansible.builtin.include_tasks: dhcp_offer_delay.yml
  when: technitium_dhcp_offer_delay_ms | int > 0

- name: Configure DHCP reservation sync
  ansible.builtin.include_tasks: reservation_sync.yml
  when: technitium_reservation_sync_enabled
