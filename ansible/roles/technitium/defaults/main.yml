---
# Technitium container image and config directory.
technitium_image: "technitium/dns-server:14.2.0"
technitium_config_dir: /opt/technitium/config

# DNS server domain advertised to clients.
technitium_dns_domain: "dns02.localdomain"

# Local addresses the web admin service listens on.
# Comma-separated list. DNS itself (port 53) always binds on every interface
# because the container uses host networking; this only restricts the :5380
# admin/API listener.
# - 10.37.20.254: Trusted VLAN (workstation access)
# - 10.37.70.254: DMZ VLAN (Semaphore/Ansible API automation, e.g. technitium_dns_sync).
#   Must stay in sync with ansible_host in terraform/envs/prod/prod.tfvars, since
#   technitium_api_host derives from it -- drop this and the role hangs on
#   "Wait for Technitium API to become reachable".
# - 10.37.80.254: App VLAN (retained for local/legacy access)
technitium_web_service_local_addresses: "10.37.20.254,10.37.70.254,10.37.80.254"

# API token for this host's Technitium instance.
# Set from a vaulted variable in host_vars (e.g. {{ vault_technitium_api_token_dns02 }}).
technitium_api_token: ""

# Address Ansible uses to reach this host's Technitium API.
# Follows ansible_host, so the call stays on the DMZ VLAN where Semaphore lives
# and :5380 is bound.
technitium_api_host: "{{ ansible_host }}"
technitium_api_port: 5380
technitium_api_scheme: "http"

# Secondary zones to declare on this host. Each entry:
#   - name: "<zone>"
#     primary_addresses: ["<primary_ip>", ...]
# Pulled via AXFR/IXFR; NOTIFY-driven refresh requires the primary to be
# configured manually to allow transfers and notify this host.
technitium_secondary_zones: []

# DNS server local listen endpoints, as a list of `IP:PORT` strings.
# Example: ["10.37.10.254:53", "[fd00:1337:1337:10::254]:53", "127.0.0.1:53"]
# Empty list leaves Technitium's default (0.0.0.0:53) alone. Set this on
# multi-homed hosts (especially with IPv6) so DNS is served on every
# expected address -- the default IPv4 wildcard alone won't accept IPv6
# queries.
technitium_dns_local_endpoints: []

# Upstream DNS forwarders. Empty list leaves Technitium's current setting
# alone (typically null/no forwarders = native recursion). Set to ControlD,
# Quad9, Cloudflare, etc. to forward instead of recursing.
technitium_forwarders: []

# Protocol for forwarder queries. One of: Udp, Tcp, Tls, Https, HttpsJson,
# Quic. Only applies when technitium_forwarders is non-empty.
technitium_forwarder_protocol: "Udp"

# DNSSEC validation toggle. null (default) leaves Technitium's current
# value untouched. Set true to enable, false to disable -- e.g. set false
# on a host that forwards to a validating resolver (ControlD does DNSSEC
# upstream, so we don't need to double-validate locally).
technitium_enable_dnssec_validation: null

# DHCP scopes to declare on this Technitium instance.
# See tasks/dhcp_scopes.yml for the full schema. Each scope is created or
# updated via /api/dhcp/scopes/set and enabled/disabled accordingly.
technitium_dhcp_scopes: []

# DHCP scopes to delete if present. Technitium ships with a "Default"
# placeholder scope (192.168.1.0/24, disabled) on first run; strip it on
# managed hosts so the UI/API only shows the scopes we declare.
technitium_dhcp_scopes_remove:
  - "Default"

# DHCP offer-delay enforced on every existing scope (milliseconds).
# 0 (default) leaves scopes alone. Set to 5000 on a hot-standby/secondary so
# the primary always wins the DHCPDISCOVER race when both are up.
technitium_dhcp_offer_delay_ms: 0

# DNS Apps to install + configure via the Technitium app store.
# Each entry:
#   - name: "<display name>"     # must match Technitium's app name
#     url:  "<zip download URL>" # from https://download.technitium.com/dns/apps/...
#     config: { ... }            # dict; serialized to JSON and applied
technitium_dns_apps: []

# DHCP reservation sync (sidecar systemd timer that mirrors reservations
# from a primary Technitium instance into this host's DHCP scopes).
technitium_reservation_sync_enabled: false
technitium_reservation_sync_interval: "5min"
technitium_reservation_sync_randomized_delay: "30s"
technitium_reservation_sync_primary_host: ""   # e.g. "10.37.20.253" or "dns01.localdomain"
technitium_reservation_sync_primary_port: 5380
technitium_reservation_sync_primary_scheme: "http"
technitium_reservation_sync_primary_token: ""  # vaulted
