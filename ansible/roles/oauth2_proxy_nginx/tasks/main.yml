---
# roles/oauth2_proxy_nginx/tasks/main.yml
# Main tasks for OAuth2-Proxy Nginx configuration (Modular Version)

- name: Verify required variables are defined
  ansible.builtin.assert:
    that:
      - oauth2_services is defined
      - oauth2_services | length > 0
      - oauth2_proxy_nginx_host is defined
      - oauth2_proxy_nginx_port is defined
    fail_msg: "Required OAuth2 variables are not properly defined"

- name: Filter services if specified
  ansible.builtin.set_fact:
    oauth2_proxy_nginx_filtered_services: >-
      {{
        oauth2_services | selectattr('name', 'in', oauth2_proxy_nginx_services_filter) | list
        if oauth2_proxy_nginx_services_filter | length > 0
        else oauth2_services
      }}

- name: Display deployment information
  ansible.builtin.debug:
    msg:
      - "OAuth2-Proxy Host: {{ oauth2_proxy_nginx_host }}:{{ oauth2_proxy_nginx_port }}"
      - "Services to deploy: {{ oauth2_proxy_nginx_filtered_services | map(attribute='name') | list }}"
      - "Total services: {{ oauth2_proxy_nginx_filtered_services | length }}"

- name: Perform SELinux pre-deployment checks
  ansible.builtin.include_tasks: selinux_pre_checks.yml
  when: ansible_os_family == "RedHat"
  tags: ["selinux", "oauth2_selinux", "pre_check"]

- name: Configure SELinux for OAuth2 backend ports
  ansible.builtin.include_tasks: selinux_config.yml
  when: ansible_os_family == "RedHat"
  tags: ["selinux", "oauth2_selinux"]


- name: Create nginx configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ oauth2_proxy_nginx_sites_available }}"
    - "{{ oauth2_proxy_nginx_sites_enabled }}"
    - "{{ oauth2_proxy_nginx_conf_d }}"
    - "/var/log/nginx"

- name: Generate OAuth2-Proxy location blocks
  ansible.builtin.template:
    src: oauth2-locations.conf.j2
    dest: "{{ oauth2_proxy_nginx_conf_d }}/oauth2-locations.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: reload nginx

- name: Generate OAuth2 authentication includes
  ansible.builtin.template:
    src: oauth2-auth.conf.j2
    dest: "{{ oauth2_proxy_nginx_conf_d }}/oauth2-auth-{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop:
    - "none"
    - "simple"
    - "groups"
    - "roles"
  notify: reload nginx

- name: Generate shared OAuth2 logout configuration
  ansible.builtin.template:
    src: oauth2-logout-shared.conf.j2
    dest: "{{ oauth2_proxy_nginx_conf_d }}/oauth2-logout.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: logout_config.oauth2_proxy_nginx_enable_id_token_logout | default(true)
  notify: reload nginx

- name: Generate nginx site configurations (modular)
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "{{ oauth2_proxy_nginx_sites_available }}/{{ item.domain }}.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop: "{{ oauth2_proxy_nginx_filtered_services }}"
  notify: reload nginx

- name: Enable nginx sites
  ansible.builtin.file:
    src: "{{ oauth2_proxy_nginx_sites_available }}/{{ item.domain }}.conf"
    dest: "{{ oauth2_proxy_nginx_sites_enabled }}/{{ item.domain }}.conf"
    state: link
    force: true
  loop: "{{ oauth2_proxy_nginx_filtered_services }}"
  notify: reload nginx

- name: Remove default nginx configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ oauth2_proxy_nginx_sites_enabled }}/default"
    - "{{ oauth2_proxy_nginx_conf_d }}/default.conf"
  notify: reload nginx

- name: Clean up old per-domain logout includes (if any exist)
  ansible.builtin.find:
    paths: "{{ oauth2_proxy_nginx_conf_d }}"
    patterns:
      - "logout-pages-*.conf"
      - "logout-success-*.conf"
      - "logout-javascript-*.conf"
  register: oauth2_proxy_nginx_old_logout_files

- name: Remove old per-domain logout includes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ oauth2_proxy_nginx_old_logout_files.files }}"
  notify: reload nginx
  when: oauth2_proxy_nginx_old_logout_files.files | length > 0

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  register: oauth2_proxy_nginx_test
  changed_when: false

- name: Display nginx test results
  ansible.builtin.debug:
    msg: "Nginx configuration test: {{ 'PASSED' if oauth2_proxy_nginx_test.rc == 0 else 'FAILED' }}"

- name: Ensure nginx is running and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Display deployment summary
  ansible.builtin.debug:
    msg:
      - "OAuth2-Proxy deployment completed successfully"
      - "Configured services: {{ oauth2_proxy_nginx_filtered_services | map(attribute='name') | list }}"
      - "Service domains: {{ oauth2_proxy_nginx_filtered_services | map(attribute='domain') | list }}"
      - "Shared logout functionality: {{ 'Enabled' if logout_config.oauth2_proxy_nginx_enable_id_token_logout | default(true) else 'Disabled' }}"
      - "Logout config file: {{ oauth2_proxy_nginx_conf_d }}/oauth2-logout.conf"
