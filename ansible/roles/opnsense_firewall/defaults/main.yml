---
# OPNsense Firewall Role Defaults
# Override in group_vars or playbook as needed

# Set via extra-vars from Gitea secrets (Semaphore survey). The bare
# names are part of the external contract — keep them despite var-naming.
opnsense_api_key: ""  # noqa: var-naming[no-role-prefix]
opnsense_api_secret: ""  # noqa: var-naming[no-role-prefix]

opnsense_firewall_defaults:
  enabled: true
  log: false
  quick: true

# Custom aliases (define in group_vars/opnsense/vars.yml)
opnsense_firewall_aliases: []
# Firewall rules (define in group_vars/opnsense/vars.yml)
opnsense_firewall_terraform_rules: []
opnsense_firewall_host_specific_rules: []
