---
# OPNsense Firewall Management Role
# Manages granular firewall rules for Terraform-created hosts
# Uses ansibleguy.opnsense collection with API authentication

- name: Assert API credentials are configured
  ansible.builtin.assert:
    that:
      - opnsense_firewall is defined
      - opnsense_api_key is defined
      - opnsense_api_secret is defined
      - opnsense_validate_certs is defined
    fail_msg: "Missing OPNsense API config — set opnsense_firewall / opnsense_api_key / opnsense_api_secret / opnsense_validate_certs."
    quiet: true

- name: Manage custom firewall aliases
  ansibleguy.opnsense.alias:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_validate_certs }}"
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    content: "{{ item.content }}"
    description: "{{ item.description }}"
    update_frequency_days: "{{ item.refresh_frequency | default(omit) }}"
    state: present
  loop: "{{ opnsense_firewall_aliases }}"
  when: opnsense_firewall_aliases is defined and opnsense_firewall_aliases | length > 0
  register: opnsense_firewall_custom_aliases

- name: Create IP alias for Terraform hosts
  ansibleguy.opnsense.alias:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_validate_certs }}"
    name: "terraform_hosts"
    type: host
    content: "{{ groups['terraform_created'] | map('extract', hostvars, 'ansible_host') | list }}"
    description: "Hosts created by Terraform automation"
    state: present
  register: opnsense_firewall_terraform_alias
  when: groups['terraform_created'] is defined and groups['terraform_created'] | length > 0

- name: Create individual host aliases
  ansibleguy.opnsense.alias:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_validate_certs }}"
    name: "{{ item }}"
    type: host
    content: ["{{ hostvars[item].ansible_host }}"]
    description: "Terraform host: {{ item }}"
    state: present
  loop: "{{ groups['terraform_created'] | default([]) }}"
  register: opnsense_firewall_host_aliases
  when: groups['terraform_created'] is defined and groups['terraform_created'] | length > 0

- name: Build firewall rules list
  ansible.builtin.set_fact:
    opnsense_firewall_rules_list: |
      {% set result = [] %}
      {% for rule in (opnsense_firewall_terraform_rules + opnsense_firewall_host_specific_rules) %}
        {% if rule.interface is iterable and rule.interface is not string %}
          {% for iface in rule.interface %}
            {% set actual_iface = opnsense_interfaces.get(iface, iface) %}
            {% set _ = result.append([rule, actual_iface]) %}
          {% endfor %}
        {% else %}
          {% set iface = rule.interface | default('lan') %}
          {% set actual_iface = opnsense_interfaces.get(iface, iface) %}
          {% set _ = result.append([rule, actual_iface]) %}
        {% endif %}
      {% endfor %}
      {{ result | to_json }}

- name: Create granular firewall rules
  ansibleguy.opnsense.rule:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_validate_certs }}"
    interface: "{{ item.1 }}"
    protocol: "{{ item.0.protocol | upper }}"
    source_net: "{{ item.0.source }}"
    destination_net: "{{ item.0.destination }}"
    destination_port: "{{ item.0.port }}"
    description: "{{ item.0.description }}{{ ' [' ~ item.1 ~ ']' if item.0.interface is iterable and item.0.interface is not string else '' }}"
    enabled: "{{ firewall_defaults.enabled }}"
    log: "{{ item.0.log | default(firewall_defaults.log) }}"
    quick: "{{ firewall_defaults.quick }}"
    state: present
    match_fields: ["description"]
  loop: "{{ opnsense_firewall_rules_list | from_json }}"
  loop_control:
    label: "{{ item.0.name }} on {{ item.1 }}"
  when: item.0.when | default(true)
  register: opnsense_firewall_rules

- name: Reload firewall rules
  ansibleguy.opnsense.reload:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_validate_certs }}"
    target: "rule"
  when: >
    (opnsense_firewall_custom_aliases is defined and opnsense_firewall_custom_aliases.changed | default(false)) or
    (opnsense_firewall_terraform_alias is defined and opnsense_firewall_terraform_alias.changed | default(false)) or
    (opnsense_firewall_host_aliases is defined and opnsense_firewall_host_aliases.changed | default(false)) or
    (opnsense_firewall_rules is defined and opnsense_firewall_rules.changed | default(false))
