---
# Configure firewalld for Docker hosts
#
# Strategy: Let Docker manage its own FORWARD chain rules (container networking).
# Firewalld only manages INPUT (host protection). We just need to enable forwarding.

- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_installed
  changed_when: false
  failed_when: false

- name: Enable IP forwarding in firewalld (allows Docker NAT to work)
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    forward: true
    permanent: true
    immediate: true
    state: enabled
  when: docker_installed.rc == 0
  notify: reload firewalld

- name: Enable masquerading for Docker NAT
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    masquerade: true
    permanent: true
    immediate: true
    state: enabled
  when: docker_installed.rc == 0
  notify: reload firewalld

- name: Display Docker firewall configuration
  ansible.builtin.debug:
    msg: |
      ========================================
      Docker Firewall Configuration
      ========================================
      Docker Installed: Yes
      Forwarding: Enabled in {{ firewall_default_zone }} zone
      Masquerading: Enabled in {{ firewall_default_zone }} zone

      Docker manages container networking via its own iptables chains:
      - DOCKER-USER (custom filtering)
      - DOCKER-ISOLATION-STAGE-1/2 (network isolation)
      - DOCKER (port forwarding)

      Firewalld manages INPUT chain (host protection) only.
      ========================================
  when: docker_installed.rc == 0
