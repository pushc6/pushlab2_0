---
# Main task orchestration with error handling
# FIXED: Wrapped in block/rescue for safety

- name: Firewall Hardening with Automatic Rollback
  block:
    # ========================================================================
    # PREFLIGHT CHECKS
    # ========================================================================

    - name: Include preflight checks
      ansible.builtin.include_tasks: preflight.yml
      when: firewall_hardened_enable_preflight | default(true)
      tags:
        - firewall
        - preflight

    # ========================================================================
    # SSH HARDENING (Most Critical)
    # ========================================================================

    - name: Include SSH hardening
      ansible.builtin.include_tasks: ssh_hardening.yml
      when: firewall_hardened_ssh_hardening_enabled | default(true)
      tags:
        - firewall
        - ssh

    - name: Flush handlers after SSH hardening to stabilize state
      ansible.builtin.meta: flush_handlers
      when: firewall_hardened_ssh_hardening_enabled | default(true)
      tags:
        - firewall
        - ssh

    - name: Display SSH hardening skipped message
      ansible.builtin.debug:
        msg: |
          ========================================
          SSH Hardening SKIPPED
          ========================================
          SSH hardening is disabled for this host.
          SSH will remain publicly accessible.
          ========================================
      when: not (firewall_hardened_ssh_hardening_enabled | default(true))

    # ========================================================================
    # DOCKER CONFIGURATION
    # ========================================================================

    - name: Configure Docker interface in trusted zone
      ansible.builtin.include_tasks: docker_rules.yml
      when: >-
        'docker' in group_names
        or 'docker_hosts' in group_names
        or 'dockerhost' in group_names
        or 'docker_internal' in group_names
        or 'docker_secure' in group_names
      tags:
        - firewall
        - docker

    # ========================================================================
    # SERVICE RULES
    # ========================================================================

    - name: Configure firewall services
      ansible.builtin.include_tasks: service_rules.yml
      when: >
        (firewall_hardened_global_services is defined and firewall_hardened_global_services | length > 0) or
        (firewall_hardened_services is defined and firewall_hardened_services | length > 0) or
        (firewall_hardened_public_services is defined and firewall_hardened_public_services | length > 0) or
        (firewall_hardened_management_services is defined and firewall_hardened_management_services | length > 0) or
        (firewall_hardened_proxy_services is defined and firewall_hardened_proxy_services | length > 0) or
        (firewall_hardened_custom_rich_rules is defined and firewall_hardened_custom_rich_rules | length > 0)
      tags:
        - firewall
        - services

    # ========================================================================
    # ENFORCE-CLOSED (declarative removal of zone services/ports)
    # firewall_hardened otherwise only ADDS its own services + purges rich rules;
    # it never touches zone default-services (e.g. cockpit) or stray zone ports
    # (e.g. a legacy 3001/tcp). These lists keep such entries shut on every run.
    # state: disabled is a no-op when already absent, so it can't affect intended
    # ports like ssh/http/https.
    # ========================================================================

    - name: Enforce removed services in the default zone
      ansible.posix.firewalld:
        service: "{{ item }}"
        zone: "{{ firewall_hardened_default_zone }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ firewall_hardened_disabled_services | default([]) }}"
      loop_control:
        label: "{{ item }}"
      notify: Reload firewalld
      tags: [firewall, services]

    - name: Enforce removed ports in the default zone
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewall_hardened_default_zone }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ firewall_hardened_disabled_ports | default([]) }}"
      loop_control:
        label: "{{ item }}"
      notify: Reload firewalld
      tags: [firewall, services]

    # ========================================================================
    # PURGE STALE RULES (declarative management)
    # ========================================================================

    - name: Purge stale firewall rules not in configuration
      ansible.builtin.include_tasks: purge_stale_rules.yml
      when: firewall_hardened_purge_stale_rules | default(false)
      tags:
        - firewall
        - services
        - purge

    # ========================================================================
    # FLUSH HANDLERS (apply all pending firewall reloads)
    # ========================================================================

    - name: Flush handlers to apply all firewall changes
      ansible.builtin.meta: flush_handlers
    - name: Include validation
      ansible.builtin.include_tasks: validate.yml
      when: firewall_hardened_enable_validation | default(true)
      tags:
        - firewall
        - validate

  rescue:
    # ========================================================================
    # AUTOMATIC ROLLBACK on ANY failure
    # ========================================================================

    - name: Firewall configuration failed - initiating emergency rollback
      ansible.builtin.debug:
        msg: |
          ========================================
          FIREWALL CONFIGURATION FAILED
          ========================================
          An error occurred during firewall hardening.
          Initiating emergency rollback...
          ========================================

    - name: Find most recent firewall backup
      ansible.builtin.find:
        paths: /tmp
        patterns: "firewall_backup_*.txt"
        age: -1d
      register: firewall_hardened_backup_files

    - name: Emergency - Re-enable SSH service to prevent lockout
      ansible.posix.firewalld:
        service: ssh
        permanent: true
        immediate: false
        state: enabled
      failed_when: false # Best-effort lockout recovery — never abort here.

    - name: Reload firewall after emergency SSH restoration
      ansible.builtin.service:
        name: firewalld
        state: reloaded
      failed_when: false # Best-effort lockout recovery.
      register: firewall_hardened_emergency_reload

    - name: Wait for firewall stabilization after emergency restore # noqa: no-handler
      ansible.builtin.pause:
        seconds: 5
      when: firewall_hardened_emergency_reload is changed

    - name: Verify emergency SSH access
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ firewall_hardened_ssh_port | default(22) }}"
        timeout: 15
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      failed_when: false # Diagnostic only — recovery already attempted above.

    - name: Display rollback information
      ansible.builtin.debug:
        msg: |
          ========================================
          EMERGENCY ROLLBACK COMPLETE
          ========================================
          SSH service has been re-enabled globally.
          You should now have SSH access to the host.

          Firewall backup available at:
          {{ firewall_hardened_backup_files.files[0].path if firewall_hardened_backup_files.files | length > 0 else 'No backup found' }}

          Please review the error below and investigate before retrying.
          ========================================

    - name: Fail with original error
      ansible.builtin.fail:
        msg: |
          Firewall hardening failed. Emergency rollback completed.
          SSH access has been restored.

          Original error: {{ ansible_failed_result.msg | default('Unknown error') }}
