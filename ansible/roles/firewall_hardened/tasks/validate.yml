---
# Post-implementation validation

- name: Verify firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  check_mode: true
  register: firewalld_status
  failed_when: firewalld_status is changed

- name: Get active rich rules
  ansible.builtin.command: firewall-cmd --list-rich-rules
  register: rich_rules_active
  changed_when: false

- name: Get active ports
  ansible.builtin.command: firewall-cmd --list-ports
  register: ports_active
  changed_when: false

- name: Get active services
  ansible.builtin.command: firewall-cmd --list-services
  register: services_active
  changed_when: false

- name: Verify SSH rich rules are active for all allowed subnets (IPv4)
  ansible.builtin.assert:
    that:
      - "'source address=\"{{ item }}\"' in rich_rules_active.stdout"
      - "'port=\"{{ firewall_ssh_port }}\"' in rich_rules_active.stdout"
    fail_msg: "SSH rich rule not found for subnet {{ item }}"
    success_msg: "SSH rich rule is active for {{ item }}"
  loop: "{{ firewall_ssh_allowed_subnets }}"
  loop_control:
    label: "{{ item }}"
  when: firewall_ssh_hardening_enabled | default(true)

- name: Verify SSH rich rules are active for all allowed subnets (IPv6)
  ansible.builtin.assert:
    that:
      - "'source address=\"{{ item }}\"' in rich_rules_active.stdout"
      - "'port=\"{{ firewall_ssh_port }}\"' in rich_rules_active.stdout"
    fail_msg: "SSH rich rule not found for IPv6 subnet {{ item }}"
    success_msg: "SSH rich rule is active for {{ item }}"
  loop: "{{ firewall_ssh_allowed_subnets_ipv6 }}"
  loop_control:
    label: "{{ item }}"
  when:
    - firewall_ssh_hardening_enabled | default(true)
    - firewall_enable_ipv6 | default(true)

- name: Verify SSH service is NOT globally enabled
  ansible.builtin.assert:
    that:
      - "'ssh' not in services_active.stdout"
    fail_msg: "SSH service is still globally enabled (should be disabled)"
    success_msg: "SSH service correctly disabled (rich rule in use)"
  when: firewall_ssh_hardening_enabled | default(true)

- name: Verify SSH service IS globally enabled (hardening disabled)
  ansible.builtin.assert:
    that:
      - "'ssh' in services_active.stdout"
    fail_msg: "SSH service is not enabled (should be globally enabled for VPS)"
    success_msg: "SSH service is correctly enabled globally"
  when: not (firewall_ssh_hardening_enabled | default(true))

- name: Test SSH connectivity from Ansible controller (CRITICAL)
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(ansible_facts['default_ipv4']['address'] | default(inventory_hostname)) }}"
    port: "{{ firewall_ssh_port }}"
    timeout: 10
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local

- name: Verify configured services are present in firewall
  ansible.builtin.assert:
    that:
      - "item.port | string in ports_active.stdout or item.name in services_active.stdout"
    fail_msg: "Service {{ item.name }} ({{ item.port }}/{{ item.protocol }}) not found in firewall configuration"
    success_msg: "Service {{ item.name }} is configured in firewall"
  loop: "{{ normalized_services | default([]) | selectattr('access', 'equalto', 'public') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/{{ item.protocol }})"
  when: normalized_services is defined and normalized_services | length > 0

- name: Get listening TCP ports (IPv4)
  ansible.builtin.shell: ss -tlnH -4 | awk '{print $4}' | sed 's/.*://' | sort -u
  register: listening_tcp_ports
  changed_when: false
  failed_when: false

- name: Get listening UDP ports (IPv4)
  ansible.builtin.shell: ss -ulnH -4 | awk '{print $4}' | sed 's/.*://' | sort -u
  register: listening_udp_ports
  changed_when: false
  failed_when: false

- name: Get listening TCP ports (IPv6)
  ansible.builtin.shell: ss -tlnH -6 | awk '{print $4}' | sed 's/.*://' | sort -u
  register: listening_tcp_ports_ipv6
  changed_when: false
  failed_when: false
  when: firewall_enable_ipv6 | default(true)

- name: Get listening UDP ports (IPv6)
  ansible.builtin.shell: ss -ulnH -6 | awk '{print $4}' | sed 's/.*://' | sort -u
  register: listening_udp_ports_ipv6
  changed_when: false
  failed_when: false
  when: firewall_enable_ipv6 | default(true)

- name: Check for listening ports without firewall rules
  ansible.builtin.set_fact:
    unprotected_ports: >-
      {{
        unprotected_ports | default([]) +
        [{
          'port': item,
          'protocol': 'tcp',
          'in_firewall': (
            (item + '/tcp') in ports_active.stdout or
            ('port="' + item + '"') in rich_rules_active.stdout
          )
        }]
      }}
  loop: "{{ listening_tcp_ports.stdout_lines | default([]) }}"
  when:
    - listening_tcp_ports.stdout_lines is defined
    - item | length > 0
    - item not in ['0', '*']

- name: Check for listening UDP ports without firewall rules
  ansible.builtin.set_fact:
    unprotected_ports: >-
      {{
        unprotected_ports | default([]) +
        [{
          'port': item,
          'protocol': 'udp',
          'in_firewall': (
            (item + '/udp') in ports_active.stdout or
            ('port="' + item + '"') in rich_rules_active.stdout
          )
        }]
      }}
  loop: "{{ listening_udp_ports.stdout_lines | default([]) }}"
  when:
    - listening_udp_ports.stdout_lines is defined
    - item | length > 0
    - item not in ['0', '*']

- name: Warn about unprotected listening ports
  ansible.builtin.debug:
    msg: |
      ⚠️  WARNING: The following ports are listening but have NO firewall rule:
      {% for port in unprotected_ports | default([]) | rejectattr('in_firewall') | list %}
      - {{ port.port }}/{{ port.protocol }}
      {% endfor %}

      This may be intentional (e.g., localhost-only services), but you should verify:
      1. These services are intended to be running
      2. They are bound to localhost only (127.0.0.1) if not meant to be accessible
      3. If they should be accessible, add them to firewall_services in host_vars
  when:
    - unprotected_ports is defined
    - unprotected_ports | rejectattr('in_firewall') | list | length > 0

- name: Get final firewall configuration
  ansible.builtin.command: firewall-cmd --list-all
  register: final_firewall_state
  changed_when: false

- name: Save final firewall configuration
  ansible.builtin.copy:
    content: |
      ========================================
      Firewall Configuration
      ========================================
      Host: {{ inventory_hostname }}
      Date: {{ ansible_facts['date_time']['iso8601'] }}

      {{ final_firewall_state.stdout }}

      ========================================
      Rich Rules
      ========================================
      {{ rich_rules_active.stdout }}

      ========================================
    dest: "/var/log/firewall_config_{{ ansible_facts['date_time']['epoch'] }}.txt"
    mode: '0644'

- name: Display validation summary
  ansible.builtin.debug:
    msg: |
      ========================================
      Firewall Hardening Validation Complete
      ========================================
      Host: {{ inventory_hostname }}
      SSH Hardening: {{ 'Enabled' if (firewall_ssh_hardening_enabled | default(true)) else 'Disabled (Public Access)' }}
      IPv6 Support: {{ 'Enabled' if (firewall_enable_ipv6 | default(true)) else 'Disabled' }}
      Rich Rules: {{ rich_rules_active.stdout_lines | length }}
      Open Ports: {{ ports_active.stdout_lines | length }}
      Services: {{ services_active.stdout_lines | length }}

      Listening Ports (IPv4):
        TCP: {{ listening_tcp_ports.stdout_lines | default([]) | length }}
        UDP: {{ listening_udp_ports.stdout_lines | default([]) | length }}
      {% if firewall_enable_ipv6 | default(true) %}
      Listening Ports (IPv6):
        TCP: {{ listening_tcp_ports_ipv6.stdout_lines | default([]) | length }}
        UDP: {{ listening_udp_ports_ipv6.stdout_lines | default([]) | length }}
      {% endif %}

      Unprotected Ports: {{ unprotected_ports | default([]) | rejectattr('in_firewall') | list | length }}

      Configuration saved to:
      /var/log/firewall_config_{{ ansible_facts['date_time']['epoch'] }}.txt
      ========================================
