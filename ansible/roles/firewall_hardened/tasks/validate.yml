---
# Post-implementation validation

- name: Verify firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  check_mode: true
  register: firewall_hardened_firewalld_status
  failed_when: firewall_hardened_firewalld_status is changed

- name: Get active rich rules
  ansible.builtin.command: firewall-cmd --list-rich-rules
  register: firewall_hardened_rich_rules_active
  changed_when: false

- name: Get active ports
  ansible.builtin.command: firewall-cmd --list-ports
  register: firewall_hardened_ports_active
  changed_when: false

- name: Get active services
  ansible.builtin.command: firewall-cmd --list-services
  register: firewall_hardened_services_active
  changed_when: false

- name: Verify SSH rich rules are active for all allowed subnets (IPv4)
  ansible.builtin.assert:
    that:
      - "'source address=\"{{ item }}\"' in firewall_hardened_rich_rules_active.stdout"
      - "'port=\"{{ firewall_hardened_ssh_port }}\"' in firewall_hardened_rich_rules_active.stdout"
    fail_msg: "SSH rich rule not found for subnet {{ item }}"
    success_msg: "SSH rich rule is active for {{ item }}"
  loop: "{{ firewall_hardened_ssh_allowed_subnets }}"
  loop_control:
    label: "{{ item }}"
  when: firewall_hardened_ssh_hardening_enabled | default(true)

- name: Verify SSH rich rules are active for all allowed subnets (IPv6)
  ansible.builtin.assert:
    that:
      - "'source address=\"{{ item }}\"' in firewall_hardened_rich_rules_active.stdout"
      - "'port=\"{{ firewall_hardened_ssh_port }}\"' in firewall_hardened_rich_rules_active.stdout"
    fail_msg: "SSH rich rule not found for IPv6 subnet {{ item }}"
    success_msg: "SSH rich rule is active for {{ item }}"
  loop: "{{ firewall_hardened_ssh_allowed_subnets_ipv6 }}"
  loop_control:
    label: "{{ item }}"
  when:
    - firewall_hardened_ssh_hardening_enabled | default(true)
    - firewall_hardened_enable_ipv6 | default(true)

- name: Verify SSH service is NOT globally enabled
  ansible.builtin.assert:
    that:
      - "'ssh' not in firewall_hardened_services_active.stdout"
    fail_msg: "SSH service is still globally enabled (should be disabled)"
    success_msg: "SSH service correctly disabled (rich rule in use)"
  when: firewall_hardened_ssh_hardening_enabled | default(true)

- name: Verify SSH service IS globally enabled (hardening disabled)
  ansible.builtin.assert:
    that:
      - "'ssh' in firewall_hardened_services_active.stdout"
    fail_msg: "SSH service is not enabled (should be globally enabled for VPS)"
    success_msg: "SSH service is correctly enabled globally"
  when: not (firewall_hardened_ssh_hardening_enabled | default(true))

- name: Set target host for SSH connectivity test
  ansible.builtin.set_fact:
    firewall_hardened_ssh_test_host: "{{ ansible_host | default(ansible_facts['default_ipv4']['address'] | default(omit)) }}"

- name: Test SSH connectivity from Ansible controller (CRITICAL)
  ansible.builtin.wait_for:
    host: "{{ firewall_hardened_ssh_test_host }}"
    port: "{{ firewall_hardened_ssh_port }}"
    timeout: 10
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
  when: firewall_hardened_ssh_test_host is defined and firewall_hardened_ssh_test_host | length > 0

- name: Verify configured services are present in firewall
  ansible.builtin.assert:
    that:
      - "item.port | string in firewall_hardened_ports_active.stdout or item.name in firewall_hardened_services_active.stdout"
    fail_msg: "Service {{ item.name }} ({{ item.port }}/{{ item.protocol }}) not found in firewall configuration"
    success_msg: "Service {{ item.name }} is configured in firewall"
  loop: "{{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'public') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/{{ item.protocol }})"
  when: firewall_hardened_normalized_services is defined and firewall_hardened_normalized_services | length > 0

- name: Get listening TCP ports (IPv4)
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -tlnH -4 | awk '{print $4}' | sed 's/.*://' | sort -u
    executable: /bin/bash
  register: firewall_hardened_listening_tcp_ports
  changed_when: false
  failed_when: false

- name: Get listening UDP ports (IPv4)
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -ulnH -4 | awk '{print $4}' | sed 's/.*://' | sort -u
    executable: /bin/bash
  register: firewall_hardened_listening_udp_ports
  changed_when: false
  failed_when: false

- name: Get listening TCP ports (IPv6)
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -tlnH -6 | awk '{print $4}' | sed 's/.*://' | sort -u
    executable: /bin/bash
  register: firewall_hardened_listening_tcp_ports_ipv6
  changed_when: false
  failed_when: false
  when: firewall_hardened_enable_ipv6 | default(true)

- name: Get listening UDP ports (IPv6)
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -ulnH -6 | awk '{print $4}' | sed 's/.*://' | sort -u
    executable: /bin/bash
  register: firewall_hardened_listening_udp_ports_ipv6
  changed_when: false
  failed_when: false
  when: firewall_hardened_enable_ipv6 | default(true)

- name: Check for listening ports without firewall rules
  ansible.builtin.set_fact:
    firewall_hardened_unprotected_ports: >-
      {{
        firewall_hardened_unprotected_ports | default([]) +
        [{
          'port': item,
          'protocol': 'tcp',
          'in_firewall': (
            (item + '/tcp') in firewall_hardened_ports_active.stdout or
            ('port="' + item + '"') in firewall_hardened_rich_rules_active.stdout
          )
        }]
      }}
  loop: "{{ firewall_hardened_listening_tcp_ports.stdout_lines | default([]) }}"
  when:
    - firewall_hardened_listening_tcp_ports.stdout_lines is defined
    - item | length > 0
    - item not in ['0', '*']

- name: Check for listening UDP ports without firewall rules
  ansible.builtin.set_fact:
    firewall_hardened_unprotected_ports: >-
      {{
        firewall_hardened_unprotected_ports | default([]) +
        [{
          'port': item,
          'protocol': 'udp',
          'in_firewall': (
            (item + '/udp') in firewall_hardened_ports_active.stdout or
            ('port="' + item + '"') in firewall_hardened_rich_rules_active.stdout
          )
        }]
      }}
  loop: "{{ firewall_hardened_listening_udp_ports.stdout_lines | default([]) }}"
  when:
    - firewall_hardened_listening_udp_ports.stdout_lines is defined
    - item | length > 0
    - item not in ['0', '*']

- name: Warn about unprotected listening ports
  ansible.builtin.debug:
    msg: |
      ⚠️  WARNING: The following ports are listening but have NO firewall rule:
      {% for port in firewall_hardened_unprotected_ports | default([]) | rejectattr('in_firewall') | list %}
      - {{ port.port }}/{{ port.protocol }}
      {% endfor %}

      This may be intentional (e.g., localhost-only services), but you should verify:
      1. These services are intended to be running
      2. They are bound to localhost only (127.0.0.1) if not meant to be accessible
      3. If they should be accessible, add them to firewall_hardened_services in host_vars
  when:
    - firewall_hardened_unprotected_ports is defined
    - firewall_hardened_unprotected_ports | rejectattr('in_firewall') | list | length > 0

- name: Get final firewall configuration
  ansible.builtin.command: firewall-cmd --list-all
  register: firewall_hardened_final_state
  changed_when: false

- name: Save final firewall configuration
  ansible.builtin.copy:
    content: |
      ========================================
      Firewall Configuration
      ========================================
      Host: {{ inventory_hostname }}
      Date: {{ ansible_facts['date_time']['iso8601'] }}

      {{ firewall_hardened_final_state.stdout }}

      ========================================
      Rich Rules
      ========================================
      {{ firewall_hardened_rich_rules_active.stdout }}

      ========================================
    dest: "/var/log/firewall_config_{{ ansible_facts['date_time']['epoch'] }}.txt"
    mode: "0644"

- name: Display validation summary
  ansible.builtin.debug:
    msg: |
      ========================================
      Firewall Hardening Validation Complete
      ========================================
      Host: {{ inventory_hostname }}
      SSH Hardening: {{ 'Enabled' if (firewall_hardened_ssh_hardening_enabled | default(true)) else 'Disabled (Public Access)' }}
      IPv6 Support: {{ 'Enabled' if (firewall_hardened_enable_ipv6 | default(true)) else 'Disabled' }}
      Rich Rules: {{ firewall_hardened_rich_rules_active.stdout_lines | length }}
      Open Ports: {{ firewall_hardened_ports_active.stdout_lines | length }}
      Services: {{ firewall_hardened_services_active.stdout_lines | length }}

      Listening Ports (IPv4):
        TCP: {{ firewall_hardened_listening_tcp_ports.stdout_lines | default([]) | length }}
        UDP: {{ firewall_hardened_listening_udp_ports.stdout_lines | default([]) | length }}
      {% if firewall_hardened_enable_ipv6 | default(true) %}
      Listening Ports (IPv6):
        TCP: {{ firewall_hardened_listening_tcp_ports_ipv6.stdout_lines | default([]) | length }}
        UDP: {{ firewall_hardened_listening_udp_ports_ipv6.stdout_lines | default([]) | length }}
      {% endif %}

      Unprotected Ports: {{ firewall_hardened_unprotected_ports | default([]) | rejectattr('in_firewall') | list | length }}

      Configuration saved to:
      /var/log/firewall_config_{{ ansible_facts['date_time']['epoch'] }}.txt
      ========================================
