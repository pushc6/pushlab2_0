---
# Preflight connectivity checks before applying rules

- name: Debug - Show variable sources
  ansible.builtin.debug:
    msg: |
      ========================================
      DEBUG - Variable Sources
      ========================================
      Inventory File: {{ inventory_file | default('UNKNOWN') }}
      Inventory Dir: {{ inventory_dir | default('UNKNOWN') }}
      Playbook Dir: {{ playbook_dir | default('UNKNOWN') }}
      Host: {{ inventory_hostname }}
      firewall_services count: {{ firewall_services | default([]) | length }}
      firewall_ssh_allowed_subnets: {{ firewall_ssh_allowed_subnets | default(['NOT SET']) }}
      ========================================

- name: Check if host_vars file exists in inventory clone
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}.yml"
  register: host_vars_file
  delegate_to: localhost
  become: false

- name: Debug - host_vars file status
  ansible.builtin.debug:
    msg: |
      ========================================
      DEBUG - host_vars File Check
      ========================================
      Expected path: {{ inventory_dir }}/host_vars/{{ inventory_hostname }}.yml
      File exists: {{ host_vars_file.stat.exists | default(false) }}
      File size: {{ host_vars_file.stat.size | default('N/A') }} bytes
      ========================================

- name: Load host_vars from inventory directory
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}.yml"
    name: inventory_host_vars
  delegate_to: localhost
  become: false
  when: host_vars_file.stat.exists | default(false)

- name: Debug - Loaded inventory host_vars
  ansible.builtin.debug:
    msg: |
      ========================================
      DEBUG - Inventory host_vars (manually loaded)
      ========================================
      firewall_services count: {{ inventory_host_vars.firewall_services | default([]) | length }}
      firewall_ssh_allowed_subnets: {{ inventory_host_vars.firewall_ssh_allowed_subnets | default(['NOT FOUND']) }}
      ========================================
  when: inventory_host_vars is defined

# Workaround for Semaphore dual-clone issue: Apply inventory host_vars if auto-loading failed
- name: Apply firewall_services from inventory host_vars
  ansible.builtin.set_fact:
    firewall_services: "{{ inventory_host_vars.firewall_services }}"
  when:
    - inventory_host_vars is defined
    - inventory_host_vars.firewall_services is defined
    - (firewall_services | default([]) | length) < (inventory_host_vars.firewall_services | length)

- name: Apply firewall_ssh_allowed_subnets from inventory host_vars
  ansible.builtin.set_fact:
    firewall_ssh_allowed_subnets: "{{ inventory_host_vars.firewall_ssh_allowed_subnets }}"
  when:
    - inventory_host_vars is defined
    - inventory_host_vars.firewall_ssh_allowed_subnets is defined
    - (firewall_ssh_allowed_subnets | default([]) | length) < (inventory_host_vars.firewall_ssh_allowed_subnets | length)

- name: Debug - Final variable values after workaround
  ansible.builtin.debug:
    msg: |
      ========================================
      DEBUG - Final Variable Values
      ========================================
      firewall_services count: {{ firewall_services | default([]) | length }}
      firewall_ssh_allowed_subnets: {{ firewall_ssh_allowed_subnets | default(['NOT SET']) }}
      ========================================

- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - firewall_ssh_allowed_subnets is defined
      - firewall_ssh_allowed_subnets | length > 0
      - firewall_trusted_vlan_subnet is defined
      - firewall_trusted_vlan_subnet | length > 0
      - firewall_ssh_port is defined
      - firewall_ssh_port | int > 0
      - firewall_ssh_port | int < 65536
    fail_msg: |
      Required firewall variables not properly defined:
        - firewall_ssh_allowed_subnets: {{ firewall_ssh_allowed_subnets | default('UNDEFINED') }}
        - firewall_trusted_vlan_subnet: {{ firewall_trusted_vlan_subnet | default('UNDEFINED') }}
        - firewall_ssh_port: {{ firewall_ssh_port | default('UNDEFINED') }}
    success_msg: "All required variables are properly defined"

- name: Verify firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present
  check_mode: true
  register: firewalld_installed
  failed_when: firewalld_installed is changed

- name: Ensure firewalld is started and enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  register: firewalld_running

- name: Check current firewall state
  ansible.builtin.command: firewall-cmd --list-all
  register: current_firewall_state
  changed_when: false

- name: Save current firewall configuration backup
  ansible.builtin.copy:
    content: "{{ current_firewall_state.stdout }}"
    dest: "/tmp/firewall_backup_{{ ansible_facts['date_time']['epoch'] }}.txt"
    mode: '0644'

- name: Display preflight results
  ansible.builtin.debug:
    msg: |
      ========================================
      Preflight Checks Complete
      ========================================
      Firewall Status: {{ firewalld_running.state | default('unknown') }}
      SSH Allowed Subnets: {{ firewall_ssh_allowed_subnets | join(', ') }}
      SSH Port: {{ firewall_ssh_port }}
      Backup saved: /tmp/firewall_backup_{{ ansible_facts['date_time']['epoch'] }}.txt
      ========================================
