---
# Apply firewall services using unified structure
# FIXED: Handles both new unified format and legacy variables

- name: Merge global and host-specific firewall services
  ansible.builtin.set_fact:
    firewall_hardened_unified_services: >-
      {{
        firewall_hardened_global_services | default([]) +
        firewall_hardened_services | default([]) +
        (firewall_hardened_public_services | default([]) | map('combine', {'access': 'public'}) | list) +
        (firewall_hardened_management_services | default([]) | map('combine', {'access': 'trusted_vlan'}) | list) +
        (firewall_hardened_proxy_services | default([]) | map('combine', {'access': 'proxy'}) | list)
      }}

- name: Normalize and validate service definitions
  ansible.builtin.set_fact:
    firewall_hardened_normalized_services: "{{ firewall_hardened_normalized_services | default([]) + [normalized_item] }}"
  vars:
    # Handle single ports, port ranges (2500-3300), and string format "9000/tcp"
    # Port ranges are kept as strings, single ports can be int or string
    raw_port: "{{ item.port if item.port is number else item.port.split('/')[0] }}"
    port_value: "{{ raw_port | string }}"
    protocol_value: >-
      {{
        item.protocol | default(
          item.port.split('/')[1] if ('/' in (item.port | string)) else 'tcp'
        )
      }}
    normalized_item:
      port: "{{ port_value }}"
      protocol: "{{ protocol_value }}"
      name: "{{ item.name }}"
      access: "{{ item.access | default('trusted_vlan') }}"
      sources: "{{ item.sources | default([]) }}"
  loop: "{{ firewall_hardened_unified_services }}"
  when: firewall_hardened_unified_services | default([]) | length > 0

- name: Validate normalized services
  ansible.builtin.assert:
    that:
      # Handle both single ports and port ranges (e.g., "2500-3300")
      - (item.port | string is match('^[0-9]+-[0-9]+$')) or (item.port | int > 0)
      - (item.port | string is match('^[0-9]+-[0-9]+$')) or (item.port | int < 65536)
      - item.protocol in ['tcp', 'udp']
      - item.access in ['public', 'management_vlan', 'trusted_vlan', 'dmz_vlan', 'wireguard_vlan', 'proxy', 'custom']
      - item.access != 'custom' or (item.sources | length > 0)
    fail_msg: |
      Invalid service definition: {{ item }}
      - Port must be 1-65535
      - Protocol must be tcp or udp
      - Access must be: public, management_vlan, trusted_vlan, dmz_vlan, wireguard_vlan, proxy, or custom
      - Custom access requires sources list
    success_msg: "Service {{ item.name }} validation passed"
  loop: "{{ firewall_hardened_normalized_services | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# ============================================================================
# APPLY PUBLIC SERVICES (no source restriction)
# ============================================================================

- name: Apply public services to firewall
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.protocol }}"
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'public') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/{{ item.protocol }})"
  notify: reload firewalld

# ============================================================================
# APPLY MANAGEMENT VLAN SERVICES (rich rules)
# ============================================================================

- name: Apply rich rules for management VLAN services (IPv4)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ firewall_hardened_management_vlan_subnet }}"
      port port="{{ item.port }}" protocol="{{ item.protocol }}"
      accept
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'management_vlan') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/{{ item.protocol }})"
  notify: reload firewalld

- name: Apply rich rules for management VLAN services (IPv6)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv6"
      source address="{{ firewall_hardened_management_vlan_subnet_ipv6 }}"
      port port="{{ item.port }}" protocol="{{ item.protocol }}"
      accept
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'management_vlan') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/{{ item.protocol }}) [IPv6]"
  notify: reload firewalld
  when: firewall_hardened_enable_ipv6 | default(true)

