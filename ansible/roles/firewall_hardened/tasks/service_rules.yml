# ============================================================================
# APPLY PROXY-ACCESSIBLE SERVICES (rich rules for each source)
# ============================================================================

- name: Build proxy access source list
  ansible.builtin.set_fact:
    firewall_hardened_proxy_sources: "{{ firewall_hardened_reverse_proxy_ips + [firewall_hardened_management_vlan_subnet] }}"

- name: Apply rich rules for proxy-accessible services
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item.1 }}"
      port port="{{ item.0.port }}" protocol="{{ item.0.protocol }}"
      accept
    permanent: true
    immediate: false
    state: enabled
  loop: >-
    {{ (firewall_hardened_normalized_services | default([])
        | selectattr('access', 'equalto', 'proxy') | list)
       | product(firewall_hardened_proxy_sources) | list }}
  loop_control:
    label: "{{ item.0.name }} from {{ item.1 }}"
  notify: reload firewalld

# ============================================================================
# APPLY CUSTOM ACCESS SERVICES (user-defined sources)
# ============================================================================

- name: Apply rich rules for custom access services (IPv4)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item.1 }}"
      port port="{{ item.0.port }}" protocol="{{ item.0.protocol }}"
      accept
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ (firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'custom') | list) | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.name }} from {{ item.1 }}"
  when: "':' not in item.1"
  notify: reload firewalld

- name: Apply rich rules for custom access services (IPv6)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv6"
      source address="{{ item.1 }}"
      port port="{{ item.0.port }}" protocol="{{ item.0.protocol }}"
      accept
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ (firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'custom') | list) | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.name }} from {{ item.1 }} [IPv6]"
  when:
    - "':' in item.1"
    - firewall_hardened_enable_ipv6 | default(true)
  notify: reload firewalld

# ============================================================================
# APPLY CUSTOM RICH RULES (legacy support)
# ============================================================================

- name: Apply custom rich rules
  ansible.posix.firewalld:
    rich_rule: "{{ item.rule }}"
    permanent: true
    immediate: false
    state: enabled
  loop: "{{ firewall_hardened_custom_rich_rules | default([]) }}"
  loop_control:
    label: "{{ item.rule | truncate(80) }}"
  notify: reload firewalld

- name: Display services configuration summary
  ansible.builtin.debug:
    msg: |
      ========================================
      Firewall Services Configured
      ========================================
      Public Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'public') | list | length }}
      Management VLAN Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'management_vlan') | list | length }}
      Trusted VLAN Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'trusted_vlan') | list | length }}
      DMZ VLAN Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'dmz_vlan') | list | length }}
      WireGuard VLAN Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'wireguard_vlan') | list | length }}
      Proxy Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'proxy') | list | length }}
      Custom Services: {{ firewall_hardened_normalized_services | default([]) | selectattr('access', 'equalto', 'custom') | list | length }}
      Custom Rich Rules: {{ firewall_hardened_custom_rich_rules | default([]) | length }}
      ========================================
