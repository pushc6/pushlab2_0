---
- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded
  register: firewall_hardened_firewalld_reload_handler

- name: Wait for firewall stabilization after handler reload
  ansible.builtin.pause:
    seconds: 5
  when: firewall_hardened_firewalld_reload_handler is changed

- name: Verify firewalld is running after handler reload
  ansible.builtin.systemd:
    name: firewalld
  register: firewall_hardened_firewalld_handler_status
  failed_when: firewall_hardened_firewalld_handler_status.status.ActiveState != 'active'
  when: firewall_hardened_firewalld_reload_handler is changed

- name: Restart firewalld
  ansible.builtin.service:
    name: firewalld
    state: restarted
