---
# Komodo installation tasks

- name: Create Komodo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: dockeruser
    group: dockeruser
    mode: "0755"
  loop:
    - "{{ komodo_install_path }}"
    - "{{ komodo_backups_path }}"
    - "{{ komodo_periphery_root }}"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ komodo_install_path }}/docker-compose.yml"
    owner: dockeruser
    group: dockeruser
    mode: "0644"
  register: compose_file

- name: Deploy compose.env
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ komodo_install_path }}/compose.env"
    owner: dockeruser
    group: dockeruser
    mode: "0600"
  register: env_file

- name: Pull Komodo images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ komodo_install_path }}"
  become: true
  become_user: dockeruser

- name: Start Komodo stack
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_install_path }}"
    state: present
    recreate: "{{ 'always' if (compose_file.changed or env_file.changed) else 'never' }}"
  become: true
  become_user: dockeruser
  register: komodo_stack

- name: Display Komodo URL
  ansible.builtin.debug:
    msg: "Komodo is available at {{ komodo_host }} (internal: http://{{ ansible_host }}:{{ komodo_port }})"
