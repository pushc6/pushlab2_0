---
galaxy_info:
  author: Infrastructure Team
  description: Wrapper that dispatches to debian_updates or rhel_updates by OS family
  company: Homelab
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions: ["12"]
    - name: Ubuntu
      versions: ["22.04", "24.04"]
    - name: EL
      versions: ["9", "10"]
  galaxy_tags:
    - updates

dependencies: []

collections:
  - ansible.builtin
