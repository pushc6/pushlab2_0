---
- name: Determine sudo group based on OS
  ansible.builtin.set_fact:
    system_users_sudo_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

- name: Ensure sudo group exists
  ansible.builtin.group:
    name: "{{ system_users_sudo_group }}"
    state: present

- name: Create user push
  ansible.builtin.user:
    name: push
    shell: /bin/bash
    groups: "{{ system_users_sudo_group }}"
    append: true
    create_home: true

- name: Set authorized key for push
  ansible.posix.authorized_key:
    user: push
    state: present
    key: "{{ push_user_public_key }}"

- name: Create user ansible
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    groups: "{{ system_users_sudo_group }}"
    append: true
    create_home: true

- name: Set authorized key for ansible
  ansible.posix.authorized_key:
    user: ansible
    state: present
    key: "{{ ansible_public_key }}"

- name: Ensure /etc/sudoers.d directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Configure passwordless sudo for push
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/push
    line: "push ALL=(ALL) NOPASSWD: ALL"
    state: present
    create: true
    mode: "0440"
    owner: root
    group: root
    validate: "visudo -cf %s"

- name: Configure passwordless sudo for ansible
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/ansible
    line: "ansible ALL=(ALL) NOPASSWD: ALL"
    state: present
    create: true
    mode: "0440"
    owner: root
    group: root
    validate: "visudo -cf %s"
