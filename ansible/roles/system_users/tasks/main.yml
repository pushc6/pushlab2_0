---
- name: Determine sudo group based on OS
  set_fact:
    sudo_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

- name: Ensure sudo group exists
  group:
    name: "{{ sudo_group }}"
    state: present

- name: Create user push
  user:
    name: push
    shell: /bin/bash
    groups: "{{ sudo_group }}"
    append: yes
    create_home: yes

- name: Set authorized key for push
  authorized_key:
    user: push
    state: present
    key: "{{ push_user_public_key }}"

- name: Create user ansible
  user:
    name: ansible
    shell: /bin/bash
    groups: "{{ sudo_group }}"
    append: yes
    create_home: yes

- name: Set authorized key for ansible
  authorized_key:
    user: ansible
    state: present
    key: "{{ ansible_public_key }}"

- name: Ensure /etc/sudoers.d directory exists
  file:
    path: /etc/sudoers.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure passwordless sudo for push
  lineinfile:
    path: /etc/sudoers.d/push
    line: 'push ALL=(ALL) NOPASSWD: ALL'
    state: present
    create: yes
    mode: '0440'
    owner: root
    group: root
    validate: 'visudo -cf %s'

- name: Configure passwordless sudo for ansible
  lineinfile:
    path: /etc/sudoers.d/ansible
    line: 'ansible ALL=(ALL) NOPASSWD: ALL'
    state: present
    create: yes
    mode: '0440'
    owner: root
    group: root
    validate: 'visudo -cf %s'
