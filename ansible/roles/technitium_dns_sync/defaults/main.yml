---
# =============================================================================
# Technitium DNS Sync - Default Configuration
# =============================================================================

# Connection settings (override in group_vars or vault)
technitium_dns_server_url: "{{ technitium_dns.server_url | default('http://10.37.20.2:5380') }}"
technitium_dns_default_ttl: "{{ technitium_dns.default_ttl | default(3600) }}"

# API token - MUST be provided via vault or extra vars
# technitium_dns_api_token: "{{ vault_technitium_api_token }}"

# Sync behavior
technitium_dns_create_cname_aliases: true
technitium_dns_dry_run: false
technitium_dns_purge_unmanaged: false  # Dangerous - don't enable without review
