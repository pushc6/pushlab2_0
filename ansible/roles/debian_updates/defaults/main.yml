---
# Ubuntu-specific variables
apt_cache_valid_time: 3600
apt_upgrade_type: dist # Options: yes, safe, full, dist
apt_autoremove: true
apt_autoclean: true
apt_update_cache_only: false

# Schedule reboot instead of rebooting immediately (useful for hosts running orchestrators)
schedule_reboot: false
reboot_delay_minutes: 15
