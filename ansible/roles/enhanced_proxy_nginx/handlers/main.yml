---
# roles/oauth2_proxy_nginx/handlers/main.yml
# Handlers for OAuth2-Proxy Nginx role

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  listen: reload nginx

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  listen: restart nginx
