---
# roles/oauth2_proxy_nginx/tasks/selinux_pre_checks.yml
# Pre-deployment SELinux validation and preparation

- name: Check SELinux status
  ansible.builtin.command: getenforce
  register: enhanced_proxy_nginx_selinux_status
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: SELinux pre-deployment checks
  when:
    - enhanced_proxy_nginx_selinux_status.rc == 0
    - enhanced_proxy_nginx_selinux_status.stdout != "Disabled"
    - ansible_os_family == "RedHat"

  block:
    - name: Display SELinux status
      ansible.builtin.debug:
        msg: "SELinux is {{ enhanced_proxy_nginx_selinux_status.stdout }} on {{ inventory_hostname }}"

    - name: Check current httpd_can_network_connect status
      ansible.builtin.command: getsebool httpd_can_network_connect
      register: enhanced_proxy_nginx_httpd_network_connect_status
      changed_when: false
      failed_when: false

    - name: Parse httpd_can_network_connect status
      ansible.builtin.set_fact:
        enhanced_proxy_nginx_httpd_network_status: >-
          {{
            enhanced_proxy_nginx_httpd_network_connect_status.stdout | regex_search('on|off') | default('unknown')
            if enhanced_proxy_nginx_httpd_network_connect_status.rc == 0 else 'unknown'
          }}

    - name: Check if SELinux management tools are available
      ansible.builtin.package_facts:
        manager: auto

    - name: Prepare SELinux management tools list
      ansible.builtin.set_fact:
        enhanced_proxy_nginx_selinux_tools_needed: >-
          {% if ansible_distribution_major_version | int >= 8 -%} ['policycoreutils-python-utils']{%- else -%} ['policycoreutils-python']{%- endif %}

    - name: Check if SELinux tools are installed
      ansible.builtin.set_fact:
        enhanced_proxy_nginx_selinux_tools_missing: >-
          {{
            enhanced_proxy_nginx_selinux_tools_needed |
            reject('in', ansible_facts.packages.keys()) |
            list
          }}

    - name: Extract backend ports for pre-check
      ansible.builtin.set_fact:
        enhanced_proxy_nginx_oauth2_backend_ports_check: "{{ oauth2_services | map(attribute='backend_port') | list | unique | map('int') | list }}"

    - name: Check current SELinux port configurations
      ansible.builtin.command: semanage port -l | grep "http_port_t.*tcp"
      register: enhanced_proxy_nginx_current_selinux_ports
      changed_when: false
      failed_when: false
      when: enhanced_proxy_nginx_selinux_tools_missing | length == 0

    - name: Analyze SELinux port requirements
      ansible.builtin.set_fact:
        enhanced_proxy_nginx_existing_http_ports: >-
          {{
            enhanced_proxy_nginx_current_selinux_ports.stdout_lines |
            map('regex_replace', '^.*tcp\s+(.+)$', '\1') |
            join(',') |
            split(',') |
            map('trim') |
            map('int') |
            list if enhanced_proxy_nginx_current_selinux_ports.rc == 0 else []
          }}
        enhanced_proxy_nginx_ports_to_configure: >-
          {{
            enhanced_proxy_nginx_oauth2_backend_ports_check |
            difference(
              enhanced_proxy_nginx_current_selinux_ports.stdout_lines |
              map('regex_replace', '^.*tcp\s+(.+)$', '\1') |
              join(',') |
              split(',') |
              map('trim') |
              map('int') |
              list if enhanced_proxy_nginx_current_selinux_ports.rc == 0 else []
            )
          }}
      when: enhanced_proxy_nginx_current_selinux_ports.rc is defined

    - name: Display SELinux pre-deployment analysis
      ansible.builtin.debug:
        msg:
          - "🔍 SELinux Pre-Deployment Analysis"
          - "─────────────────────────────────"
          - "SELinux Status: {{ enhanced_proxy_nginx_selinux_status.stdout }}"
          - "httpd_can_network_connect: {{ enhanced_proxy_nginx_httpd_network_status }}"
          - >-
            SELinux tools missing:
            {{ (enhanced_proxy_nginx_selinux_tools_missing | default([]) | join(', '))
               if (enhanced_proxy_nginx_selinux_tools_missing | default([]) | length > 0)
               else 'none' }}
          - "Backend ports needed: {{ enhanced_proxy_nginx_oauth2_backend_ports_check | join(', ') }}"
          - >-
            Ports already configured:
            {{ (enhanced_proxy_nginx_existing_http_ports | default([]) | join(', '))
               if (enhanced_proxy_nginx_existing_http_ports | default([]) | length > 0)
               else 'none' }}
          - >-
            Ports to be configured:
            {{ (enhanced_proxy_nginx_ports_to_configure | default([]) | join(', '))
               if (enhanced_proxy_nginx_ports_to_configure | default([]) | length > 0)
               else 'none' }}
          - "─────────────────────────────────"

    - name: Warning about SELinux configuration changes
      ansible.builtin.debug:
        msg:
          - "⚠️  SELinux Configuration Changes Required:"
          - "  - Will install: {{ enhanced_proxy_nginx_selinux_tools_missing | default([]) | join(', ') }}"
          - "  - Will enable: httpd_can_network_connect, httpd_can_network_relay"
          - "  - Will configure ports: {{ enhanced_proxy_nginx_ports_to_configure | default([]) | join(', ') }}"
          - "  These changes will be applied automatically during deployment."
      when: >-
        (enhanced_proxy_nginx_selinux_tools_missing | default([]) | length > 0)
        or (enhanced_proxy_nginx_httpd_network_status is defined
            and enhanced_proxy_nginx_httpd_network_status == 'off')
        or (enhanced_proxy_nginx_ports_to_configure | default([]) | length > 0)

    - name: Confirm SELinux is ready
      ansible.builtin.debug:
        msg:
          - "✅ SELinux is properly configured for OAuth2-proxy"
          - "No additional SELinux changes needed."
      when:
        - enhanced_proxy_nginx_selinux_tools_missing | default([]) | length == 0
        - enhanced_proxy_nginx_httpd_network_status is defined and enhanced_proxy_nginx_httpd_network_status == 'on'
        - enhanced_proxy_nginx_ports_to_configure | default([]) | length == 0

- name: SELinux disabled notification
  ansible.builtin.debug:
    msg:
      - "ℹ️  SELinux is disabled on {{ inventory_hostname }}"
      - "OAuth2-proxy will work without SELinux configuration."
  when:
    - enhanced_proxy_nginx_selinux_status.rc == 0
    - enhanced_proxy_nginx_selinux_status.stdout == "Disabled"
