---
# roles/enhanced_proxy_nginx/tasks/main.yml
# Main tasks for Enhanced Proxy Nginx configuration (OAuth2 + Traditional)

- name: Verify required variables are defined
  ansible.builtin.assert:
    that:
      - oauth2_services is defined or traditional_proxy_services is defined
      - enhanced_proxy_nginx_role_config.mode is defined
    fail_msg: "Required proxy variables are not properly defined"

- name: Set proxy mode for all services if not using overrides
  ansible.builtin.set_fact:
    enhanced_proxy_nginx_all_services: >-
      {{
        oauth2_services | map('combine', {'proxy_mode': enhanced_proxy_nginx_role_config.mode}) | list
        if service_proxy_overrides is not defined or service_proxy_overrides | length == 0
        else enhanced_proxy_nginx_services_with_proxy_modes
      }}
  when: oauth2_services is defined

- name: Filter services if specified
  ansible.builtin.set_fact:
    enhanced_proxy_nginx_filtered_services: >-
      {{
        enhanced_proxy_nginx_all_services | selectattr('name', 'in', enhanced_proxy_nginx_oauth2_services_filter) | list
        if enhanced_proxy_nginx_oauth2_services_filter | length > 0
        else enhanced_proxy_nginx_all_services
      }}
  when: enhanced_proxy_nginx_all_services is defined

- name: Separate services by proxy mode
  ansible.builtin.set_fact:
    enhanced_proxy_nginx_oauth2_mode_services: >-
      {{ enhanced_proxy_nginx_filtered_services
         | selectattr('proxy_mode', 'eq', 'oauth2') | list | default([]) }}
    enhanced_proxy_nginx_traditional_mode_services: >-
      {{ enhanced_proxy_nginx_filtered_services
         | selectattr('proxy_mode', 'eq', 'traditional') | list | default([]) }}
  when: enhanced_proxy_nginx_filtered_services is defined

- name: Display deployment information
  ansible.builtin.debug:
    msg:
      - "Default Proxy Mode: {{ enhanced_proxy_nginx_role_config.mode }}"
      - >-
        OAuth2-Proxy Host:
        {{ enhanced_proxy_nginx_oauth2_proxy_host | default('Not configured') }}:{{ enhanced_proxy_nginx_oauth2_proxy_port | default('4180') }}
      - "Services with OAuth2: {{ enhanced_proxy_nginx_oauth2_mode_services | map(attribute='name') | list }}"
      - "Services without OAuth2: {{ enhanced_proxy_nginx_traditional_mode_services | map(attribute='name') | list }}"
      - "Total services to deploy: {{ enhanced_proxy_nginx_filtered_services | length }}"

# SELinux configuration (needed for both modes)
- name: Perform SELinux pre-deployment checks
  ansible.builtin.include_tasks: selinux_pre_checks.yml
  when: ansible_os_family == "RedHat"
  tags: ["selinux", "proxy_selinux", "pre_check"]

- name: Configure SELinux for proxy backend ports
  ansible.builtin.include_tasks: selinux_config.yml
  when: ansible_os_family == "RedHat"
  tags: ["selinux", "proxy_selinux"]

# Common nginx setup
- name: Create nginx configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ enhanced_proxy_nginx_sites_available | default('/etc/nginx/sites-available') }}"
    - "{{ enhanced_proxy_nginx_sites_enabled | default('/etc/nginx/sites-enabled') }}"
    - "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}"
    - "/var/log/nginx"

# OAuth2-specific configuration (only if OAuth2 services exist)
- name: OAuth2 proxy configuration block
  when: enhanced_proxy_nginx_oauth2_mode_services | length > 0
  block:
    - name: Generate OAuth2-Proxy location blocks
      ansible.builtin.template:
        src: oauth2-locations.conf.j2
        dest: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/oauth2-locations.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: reload nginx

    - name: Generate OAuth2 authentication includes
      ansible.builtin.template:
        src: oauth2-auth.conf.j2
        dest: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/oauth2-auth-{{ item }}.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop:
        - "none"
        - "simple"
        - "groups"
        - "roles"
      notify: reload nginx

    - name: Generate shared OAuth2 logout configuration
      ansible.builtin.template:
        src: oauth2-logout-shared.conf.j2
        dest: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/oauth2-logout.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      when: enhanced_proxy_nginx_logout_config.enable_id_token_logout | default(true)
      notify: reload nginx

# Traditional proxy configuration (only if traditional services exist)
- name: Traditional proxy configuration block
  when: enhanced_proxy_nginx_traditional_mode_services | length > 0
  block:
    - name: Generate traditional proxy common configuration
      ansible.builtin.template:
        src: traditional-proxy-common.conf.j2
        dest: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/traditional-proxy-common.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: reload nginx

    - name: Generate cache configuration if enabled
      ansible.builtin.template:
        src: proxy-cache.conf.j2
        dest: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/proxy-cache.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      when: enhanced_proxy_nginx_traditional_proxy_config.enable_caching | default(false)
      notify: reload nginx

# Generate site configurations for all services
- name: Generate nginx site configurations (unified)
  ansible.builtin.template:
    src: nginx-site-unified.conf.j2
    dest: "{{ enhanced_proxy_nginx_sites_available | default('/etc/nginx/sites-available') }}/{{ item.domain }}.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop: "{{ enhanced_proxy_nginx_filtered_services }}"
  notify: reload nginx

- name: Enable nginx sites
  ansible.builtin.file:
    src: "{{ enhanced_proxy_nginx_sites_available | default('/etc/nginx/sites-available') }}/{{ item.domain }}.conf"
    dest: "{{ enhanced_proxy_nginx_sites_enabled | default('/etc/nginx/sites-enabled') }}/{{ item.domain }}.conf"
    state: link
    force: true
  loop: "{{ enhanced_proxy_nginx_filtered_services }}"
  notify: reload nginx

- name: Remove default nginx configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ enhanced_proxy_nginx_sites_enabled | default('/etc/nginx/sites-enabled') }}/default"
    - "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/default.conf"
  notify: reload nginx

# Cleanup old configurations
- name: Clean up old OAuth2-specific configs if not needed
  ansible.builtin.file:
    path: "{{ enhanced_proxy_nginx_conf_d | default('/etc/nginx/conf.d') }}/{{ item }}"
    state: absent
  loop:
    - "oauth2-locations.conf"
    - "oauth2-logout.conf"
  when: enhanced_proxy_nginx_oauth2_mode_services | length == 0
  notify: reload nginx

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  register: enhanced_proxy_nginx_test
  changed_when: false

- name: Display nginx test results
  ansible.builtin.debug:
    msg: "Nginx configuration test: {{ 'PASSED' if enhanced_proxy_nginx_test.rc == 0 else 'FAILED' }}"

- name: Ensure nginx is running and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Display deployment summary
  ansible.builtin.debug:
    msg:
      - "✅ Proxy deployment completed successfully"
      - "Deployment mode: Mixed (OAuth2 + Traditional)"
      - "OAuth2-protected services: {{ enhanced_proxy_nginx_oauth2_mode_services | map(attribute='name') | list }}"
      - "Traditional proxy services: {{ enhanced_proxy_nginx_traditional_mode_services | map(attribute='name') | list }}"
      - "Service domains configured: {{ enhanced_proxy_nginx_filtered_services | map(attribute='domain') | list }}"
      - "Total services deployed: {{ enhanced_proxy_nginx_filtered_services | length }}"
