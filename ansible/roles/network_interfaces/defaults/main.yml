# List of additional NetworkManager connections to configure.
# Each entry takes:
#   - conn_name: NM connection name (e.g. "eth1-static")
#   - ifname: kernel interface name (e.g. "eth1")
#   - ipv4_address: static IPv4 address
#   - ipv4_netmask: prefix length (e.g. 24)
network_interfaces: []
