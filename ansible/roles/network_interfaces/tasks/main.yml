---
# Configure multiple network interfaces with static IPs
# This role configures NetworkManager connections for additional interfaces

- name: Configure additional network interfaces
  when: network_interfaces_list is defined
  block:
    - name: Configure static IP on additional interfaces
      community.general.nmcli:
        conn_name: "{{ item.conn_name }}"
        ifname: "{{ item.ifname }}"
        type: ethernet
        ip4: "{{ item.ipv4_address }}/{{ item.ipv4_netmask }}"
        state: present
        autoconnect: true
      loop: "{{ network_interfaces_list }}"
      when: network_interfaces_list is defined and network_interfaces_list | length > 0

    - name: Bring up the network interfaces
      ansible.builtin.command: nmcli connection up "{{ item.conn_name }}"
      loop: "{{ network_interfaces_list }}"
      when: network_interfaces_list is defined and network_interfaces_list | length > 0
      changed_when: false
      failed_when: false
