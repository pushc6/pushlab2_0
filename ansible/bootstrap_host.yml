---
- name: Bootstrap Ansible User
  hosts: all:!opnsense
  gather_facts: yes
  become: yes

  vars:
    ansible_user_name: ansible

  tasks:
    - name: Ensure wheel group exists
      group:
        name: wheel
        state: present

    - name: Create user {{ ansible_user_name }}
      user:
        name: "{{ ansible_user_name }}"
        shell: /bin/bash
        groups: wheel
        append: yes
        create_home: yes

    - name: Set authorized key for {{ ansible_user_name }}
      authorized_key:
        user: "{{ ansible_user_name }}"
        state: present
        key: "{{ ansible_public_key }}"

    - name: Allow 'wheel' group to have passwordless sudo
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%wheel'
        line: '%wheel ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'
