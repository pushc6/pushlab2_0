---
# OPNsense API Configuration
# API credentials are stored in Gitea secrets and passed via extra vars

opnsense_firewall: "{{ ansible_host }}" # Hostname or IP only (no protocol)
opnsense_api_url: "https://{{ ansible_host }}" # Full URL (for backward compatibility)
opnsense_validate_certs: false # Set to true if using valid SSL cert

# Interface mapping - friendly names to OPNsense interface IDs
# Update these based on your OPNsense configuration (Interfaces -> Assignments)
opnsense_interfaces:
  wan: wan
  wan_backup: opt4
  wan_group: "WAN_Interfaces net" # Failover WAN group - use for rules/NAT from internet
  lan: lan
  management_vlan: opt1 # VLAN 10 - Management
  trusted_vlan: opt2 # VLAN 20 - Trusted/Servers
  storage_vlan: opt3 # Storage VLAN
  iot_vlan: opt5 # IoT VLAN
  guest_vlan: opt6 # Guest VLAN
  dmz_vlan: opt7 # VLAN 70 - DMZ
  app_vlan: opt9 # VLAN 80 - App
  wireguard_vlan: opt8 # WireGuard VPN

# Default firewall rule settings
firewall_defaults:
  enabled: true
  log: false
  quick: true

# Custom firewall aliases
# These will be created/updated in OPNsense for use in rules
opnsense_aliases:
  # Veeam Backup Server
  - name: "veeammachine"
    type: host
    content:
      - "{{ veeam_server_ip }}"
    description: "Veeam Backup & Replication server"

  # Veeam ports alias
  - name: "veeam_ports"
    type: port
    content:
      - "6162"
      - "2500:3300"
      - "111"
      - "1058"
      - "2049"
    description: "Veeam Backup & Replication ports"

  # Semaphore - Ansible UI
  - name: "semaphore"
    type: host
    content:
      - "10.37.70.25"
    description: "Semaphore Ansible UI server"

  # Cupsserver - CUPS Print Server (IoT VLAN)
  - name: "cupsserver"
    type: host
    content:
      - "10.37.50.9"
    description: "CUPS print server in IoT VLAN"

  # DNS02 - Secondary DNS server (App VLAN IP for Ansible access)
  - name: "dns02"
    type: host
    content:
      - "10.37.80.254"
    description: "Secondary DNS server - App VLAN IP for cross-VLAN Ansible access"

  # Network aliases (CIDR ranges)
  - name: "internal_networks"
    type: network
    content:
      - "10.37.0.0/16"
    description: "Internal private networks"

  # Port aliases
  - name: "web_https"
    type: port
    content:
      - "443"
    description: "Common web service ports"

# URL table aliases (for dynamic IP lists)
# - name: "threat_intel_blocklist"
#   type: urltable
#   content:
#     - "https://example.com/blocklist.txt"
#   description: "External threat intelligence blocklist"
#   refresh_frequency: 1  # Days

# Granular firewall rules for Terraform hosts
# Define specific source -> destination -> port combinations
# IMPORTANT: Specify the correct interface for each rule
terraform_host_firewall_rules:
  # SSH access from Ansible (in DMZ) to cross-VLAN hosts only
  # Option 1: Target specific hosts explicitly
  - name: "SSH from Ansible to Gitea (cross-VLAN)"
    description: "Allow Ansible SSH to Gitea in App VLAN"
    source: "semaphore" # 10.37.70.x (DMZ)
    destination: "gitea_server" # 10.37.80.x (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan # Use friendly name - will be mapped to opt7

  - name: "SSH from Ansible to DNS02 (cross-site)"
    description: "Allow Ansible SSH to DNS02"
    source: "semaphore" # 10.37.70.x (DMZ)
    destination: "dns02" # 10.37.10.x (Different network)
    protocol: tcp
    port: 22
    interface: dmz_vlan # Use friendly name - will be mapped to opt1

  - name: "SSH from Ansible to Packer Builder (cross-VLAN)"
    description: "Allow Ansible SSH to Packer Builder in App VLAN"
    source: "semaphore" # 10.37.70.x (DMZ)
    destination: "packer_builder" # 10.37.80.5 (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan # Use friendly name - will be mapped to opt7

  - name: "Gitea API from Ansible (cross-VLAN)"
    description: "Allow Ansible to reach Gitea Web/API for pre-flight checks"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "gitea_server" # 10.37.80.4 (App VLAN)
    protocol: tcp
    port: 3000
    interface: dmz_vlan

  - name: "Packer to vCenter (cross-VLAN)"
    description: "Allow Packer Builder to reach vCenter API for VM builds"
    source: "packer_builder" # 10.37.80.5 (App VLAN)
    destination: "10.37.10.35" # vCenter
    protocol: tcp
    port: 443
    interface: app_vlan

  # Semaphore cross-VLAN SSH access
  - name: "SSH from Semaphore to Gitea (cross-VLAN)"
    description: "Allow Semaphore SSH to Gitea in App VLAN"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "10.37.80.4" # gitea (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan

  - name: "SSH from Semaphore to Packer Builder (cross-VLAN)"
    description: "Allow Semaphore SSH to Packer Builder in App VLAN"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "10.37.80.5" # packer_builder (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan

  - name: "SSH from Semaphore to DNS02 (cross-VLAN)"
    description: "Allow Semaphore SSH to DNS02 in Trusted VLAN"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "dns02" # 10.37.20.2 (Trusted VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan

  - name: "SSH from Semaphore to RaspberryPi-HA (cross-VLAN)"
    description: "Allow Semaphore SSH to RaspberryPi-HA in IoT VLAN"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "10.37.50.12" # raspberrypi-ha.localdomain (IoT VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan

  - name: "SSH from Semaphore to Cupsserver (cross-VLAN)"
    description: "Allow Semaphore SSH to Cupsserver in IoT VLAN"
    source: "semaphore" # 10.37.70.25 (DMZ)
    destination: "cupsserver" # 10.37.50.9 (IoT VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan

