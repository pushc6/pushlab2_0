---
# OPNsense API Configuration
# API credentials are stored in Gitea secrets and passed via extra vars

opnsense_firewall: "{{ ansible_host }}"  # Hostname or IP only (no protocol)
opnsense_api_url: "https://{{ ansible_host }}"  # Full URL (for backward compatibility)
opnsense_validate_certs: false  # Set to true if using valid SSL cert

# Interface mapping - friendly names to OPNsense interface IDs
# Update these based on your OPNsense configuration (Interfaces -> Assignments)
opnsense_interfaces:
  wan: wan
  wan_backup: opt4
  wan_group: "WAN_Interfaces net"  # Failover WAN group - use for rules/NAT from internet
  lan: lan
  management_vlan: opt1      # VLAN 10 - Management
  trusted_vlan: opt2         # VLAN 20 - Trusted/Servers
  storage_vlan: opt3         # Storage VLAN
  iot_vlan: opt5             # IoT VLAN
  guest_vlan: opt6           # Guest VLAN
  dmz_vlan: opt7             # VLAN 70 - DMZ
  app_vlan: opt9             # VLAN 80 - App
  wireguard_vlan: opt8       # WireGuard VPN

# Default firewall rule settings
firewall_defaults:
  enabled: true
  log: false
  quick: true

# Custom firewall aliases
# These will be created/updated in OPNsense for use in rules
opnsense_aliases:
  # AAP/Ansible Controller
  - name: "ansible_automation"
    type: host
    content:
      - "10.37.70.27"
    description: "Ansible Automation Platform (AAP) server"
    
  # Network aliases (CIDR ranges)
  - name: "internal_networks"
    type: network
    content:
      - "10.37.0.0/16"
    description: "Internal private networks"
    
  # Port aliases
  - name: "web_https"
    type: port
    content:
      - "443"
    description: "Common web service ports"
    
  # URL table aliases (for dynamic IP lists)
  # - name: "threat_intel_blocklist"
  #   type: urltable
  #   content:
  #     - "https://example.com/blocklist.txt"
  #   description: "External threat intelligence blocklist"
  #   refresh_frequency: 1  # Days

# Granular firewall rules for Terraform hosts
# Define specific source -> destination -> port combinations
# IMPORTANT: Specify the correct interface for each rule
terraform_host_firewall_rules:
  # SSH access from Ansible (in DMZ) to cross-VLAN hosts only
  # Option 1: Target specific hosts explicitly
  - name: "SSH from Ansible to Gitea (cross-VLAN)"
    description: "Allow Ansible SSH to Gitea in App VLAN"
    source: "ansible_automation"  # 10.37.70.x (DMZ)
    destination: "gitea_server"  # 10.37.80.x (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan  # Use friendly name - will be mapped to opt7

  - name: "SSH from Ansible to DNS02 (cross-site)"
    description: "Allow Ansible SSH to DNS02"
    source: "ansible_automation"  # 10.37.70.x (DMZ)
    destination: "dns02"  # 10.37.10.x (Different network)
    protocol: tcp
    port: 22
    interface: dmz_vlan  # Use friendly name - will be mapped to opt1

  - name: "SSH from Ansible to Packer Builder (cross-VLAN)"
    description: "Allow Ansible SSH to Packer Builder in App VLAN"
    source: "ansible_automation"  # 10.37.70.x (DMZ)
    destination: "packer_builder"  # 10.37.80.5 (App VLAN)
    protocol: tcp
    port: 22
    interface: dmz_vlan  # Use friendly name - will be mapped to opt7

  - name: "Gitea API from Ansible (cross-VLAN)"
    description: "Allow Ansible to reach Gitea Web/API for pre-flight checks"
    source: "ansible_automation"  # 10.37.70.27 (DMZ)
    destination: "gitea_server"  # 10.37.80.4 (App VLAN)
    protocol: tcp
    port: 3000
    interface: dmz_vlan

  # labtest is NOT listed = no firewall rule (same subnet, not needed)
  
  # Option 2: Use conditional based on subnet matching
