---
# Self-bootstrap Docker on the target before running the technitium role,
# so this playbook works whether it's invoked from site.yml (where docker.yml
# runs first) or directly from a Semaphore template targeting just ns02.
- name: Install Docker prerequisite
  ansible.builtin.import_playbook: docker.yml
  tags: [docker, technitium, dns, apps]

- name: Deploy Technitium DNS
  hosts: ns02
  become: true
  pre_tasks:
    - name: Preserve the Ansible-managed hostname across cloud-init runs
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-ansible-hostname.cfg
        content: |
          # Host identity is managed by Ansible after initial provisioning.
          preserve_hostname: true
          manage_etc_hosts: false
        owner: root
        group: root
        mode: "0644"

    - name: Replace the retired secondary hostname in local mappings
      ansible.builtin.replace:
        path: /etc/hosts
        regexp: '\bdns02(?=\.localdomain|\s|$)'
        replace: ns02

  roles:
    - system_hostname
    - technitium
  tags: [technitium, dns, apps]
