---
# =============================================================================
# OPNsense Firewall Inventory - ISOLATED BY DESIGN
# =============================================================================
#
# This inventory is intentionally separate from all other inventories.
#
# WHY SEPARATE?
# -------------
# OPNsense is NOT a standard Linux host. The ansibleguy.opnsense collection
# uses API calls (not SSH) to manage the firewall. Including OPNsense in
# general inventories risks accidentally running Linux-targeted playbooks
# (package updates, firewall-cmd, user management, etc.) against it.
#
# USAGE:
#   ansible-playbook -i inventories/opnsense/hosts.yml opnsense.yml
#
# DO NOT:
#   - Add this inventory to site.yml or other general playbooks
#   - Combine this inventory with on_premise.yml or other host inventories
#   - Run any playbook other than opnsense.yml against this inventory
#
# CREDENTIALS:
#   API credentials are stored in group_vars/opnsense/vault.yml (encrypted)
#   or passed via Semaphore credentials/extra vars.
#
# =============================================================================

opnsense:
  hosts:
    opnsense.localdomain:
      ansible_host: 10.37.70.1
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
