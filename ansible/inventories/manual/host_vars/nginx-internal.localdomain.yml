---
# Configuration for nginx-internal.localdomain (10.37.70.24) - Internal Nginx Reverse Proxy

# =============================================================================
# CrowdSec Configuration
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://10.37.70.26:8080"
crowdsec_lapi_host: "crowdsec.localdomain"
crowdsec_wait_for_approval: false

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/nginx

crowdsec_acquis:
  # All nginx logs including per-domain logs
  - name: nginx
    filenames:
      - /var/log/nginx/*.log
    labels:
      type: nginx

  - name: sshd
    filenames:
      - /var/log/secure
    labels:
      type: syslog

  - name: linux
    filenames:
      - /var/log/messages
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# Parser-stage whitelists - drop noisy legitimate traffic before it reaches scenarios
crowdsec_parser_whitelists:
  - name: nextcloud-whitelist
    full_name: homelab/nextcloud-whitelist
    description: "Whitelist legitimate Nextcloud WebDAV sync traffic"
    filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
    reason: "Legitimate Nextcloud/WebDAV file sync traffic"
    expressions:
      # Any client using WebDAV verbs against Nextcloud DAV endpoints
      # (covers WinSCP/neon, Cyberduck, davfs2, GoodSync, future clients)
      - "evt.Parsed.request startsWith '/remote.php/dav/' && evt.Parsed.verb in ['PROPFIND','PROPPATCH','MKCOL','MOVE','COPY','LOCK','UNLOCK','REPORT']"
      # rclone syncing via Nextcloud WebDAV
      - "evt.Parsed.http_user_agent contains 'rclone' && evt.Parsed.request startsWith '/remote.php/dav/'"
      # Official Nextcloud desktop/mobile sync client
      - "evt.Parsed.http_user_agent contains 'Nextcloud' && evt.Parsed.request startsWith '/remote.php/dav/'"
      # Any WebDAV client identifying itself as DAV (Cyberduck, etc.)
      - "evt.Parsed.http_user_agent contains 'DAV' && evt.Parsed.request startsWith '/remote.php/dav/'"

# =============================================================================
# Firewall Configuration
# =============================================================================

# SSH access (host-specific)
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.21/32" # Ansible controller
  - "10.37.70.25/32" # semaphore

# Using unified firewall_hardened_services structure with rich rules
firewall_hardened_services:
  # Management services - internal reverse proxy accessible from management subnet
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: trusted_vlan

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: trusted_vlan

  - port: 2222
    protocol: tcp
    name: "SSH Proxy"
    access: trusted_vlan

  - port: 8883
    protocol: tcp
    name: "MQTTS - MQTT over TLS"
    access: trusted_vlan # Internal MQTT access

# Destination-based rules for OAuth2-proxy forwarding
# These allow nginx to forward auth requests to backend OAuth2-proxy instances
firewall_hardened_custom_rich_rules:
  - rule: 'rule family="ipv4" destination address="10.37.70.5" port port="4180" protocol="tcp" accept'
    name: "OAuth2-proxy forward to docker-internal"
  - rule: 'rule family="ipv4" destination address="10.37.70.7" port port="4180" protocol="tcp" accept'
    name: "OAuth2-proxy forward to docker"
