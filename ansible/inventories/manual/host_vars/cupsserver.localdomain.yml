---
# Firewall configuration for cupsserver.localdomain - CUPS Print Server

# Public services (no source restrictions)
firewall_public_services:
  - mdns  # mDNS/Avahi multicast service discovery (required for printer auto-discovery)

# Using unified firewall_services structure with rich rules
firewall_services:
  # Custom access - CUPS accessible from trusted, guest, and wireguard VLANs
  - port: 631
    protocol: tcp
    name: "CUPS Printing"
    access: custom
    sources:
      - "10.37.20.0/24"  # trusted_vlan
      - "10.37.60.0/24"  # guest_vlan
      - "10.37.90.0/24"  # wireguard_vlan

  - port: 54529
    protocol: tcp
    name: "CUPS Printing - avahi"
    access: custom
    sources:
      - "10.37.20.0/24"  # trusted_vlan
      - "10.37.60.0/24"  # guest_vlan
      - "10.37.90.0/24"  # wireguard_vlan