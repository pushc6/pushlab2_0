---
# Configuration for crowdsec.localdomain - CrowdSec LAPI Controller

# =============================================================================
# Tailscale Configuration
# =============================================================================
tailscale_enabled: true
tailscale_hostname: "crowdsec"
tailscale_tags:
  - "tag:crowdsec-lapi"

# =============================================================================
# Firewall Configuration
# =============================================================================

# SSH access (host-specific)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24"   # trusted_vlan
  - "10.37.90.0/24"   # wireguard_vlan
  - "10.37.70.27/32"  # ansible.localdomain
  - "10.37.70.21/32"  # Ansible controller
  - "10.37.70.25/32"  # semaphore

# Using unified firewall_services structure with rich rules
firewall_services:
  # CrowdSec API accessible from internal network + Tailscale
  - port: 8080
    protocol: tcp
    name: "CrowdSec API"
    access: custom
    sources:
      - "10.37.0.0/16"    # Internal network
      - "100.64.0.0/10"   # Tailscale CGNAT range