---
# Firewall configuration for crowdsec.localdomain - CrowdSec Controller

# SSH access (host-specific)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24"   # trusted_vlan
  - "10.37.90.0/24"   # wireguard_vlan
  - "10.37.70.27/32"  # ansible.localdomain
  - "10.37.70.21/32"  # AAP controller
  - "10.37.70.25/32"  # semaphore

# Using unified firewall_services structure with rich rules
firewall_services:
  # Custom access - CrowdSec API accessible from entire push-lab network
  - port: 8080
    protocol: tcp
    name: "CrowdSec API"
    access: custom
    sources:
      - "10.37.0.0/16"
