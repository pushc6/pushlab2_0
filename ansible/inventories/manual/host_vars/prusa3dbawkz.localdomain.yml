---
# Firewall configuration for prusa3dbawkz.localdomain (10.37.70.28)
# Nextcloud AIO + SFTPGo host

# SSH access (host-specific override)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24"   # trusted_vlan
  - "10.37.90.0/24"   # wireguard_vlan
  - "10.37.70.27/32"  # ansible.localdomain
  - "10.37.70.21/32"  # Ansible controller
  - "10.37.70.25/32"  # semaphore

# Using unified firewall_services structure with rich rules
firewall_services:

  # ============================================================================
  # Nextcloud AIO Stack
  # ============================================================================

  - port: 80
    protocol: tcp
    name: "Nextcloud HTTP"
    container: nextcloud-aio-mastercontainer
    access: custom
    sources:
      - "10.37.70.24/32"  # nginx internal (IPv4)
      - "fd00:1337:1337:70::24/128"  # nginx internal (IPv6)
      - "10.37.70.7/32"  # nginx dmz (IPv4)
      - "fd00:1337:1337:70::7/128"  # nginx dmz (IPv6)
      - "10.37.20.0/24"  # trusted_vlan (IPv4)
      - "fd00:1337:1337:20::/64"  # trusted_vlan (IPv6)

  - port: 8080
    protocol: tcp
    name: "Nextcloud AIO Management"
    container: nextcloud-aio-mastercontainer
    access: trusted_vlan

  - port: 11000
    protocol: tcp
    name: "Nextcloud Apache (Talk/Notify)"
    container: nextcloud-aio-apache
    access: custom
    sources:
      - "10.37.70.24/32"  # nginx internal (IPv4)
      - "fd00:1337:1337:70::24/128"  # nginx internal (IPv6)
      - "10.37.70.7/32"  # nginx dmz (IPv4)
      - "fd00:1337:1337:70::7/128"  # nginx dmz (IPv6)
      - "10.37.20.0/24"  # trusted_vlan (IPv4)
      - "fd00:1337:1337:20::/64"  # trusted_vlan (IPv6)

  # ============================================================================
  # SFTPGo - SFTP Server with Web Admin
  # ============================================================================

  - port: 2022
    protocol: tcp
    name: "SFTPGo SFTP"
    container: sftpgo
    access: custom
    sources:
      - "10.37.20.0/24"  # trusted_vlan (IPv4)
      - "fd00:1337:1337:20::/64"  # trusted_vlan (IPv6)
      - "10.37.90.0/24"  # wireguard_vlan (IPv4)
      - "fd00:1337:1337:90::/64"  # wireguard_vlan (IPv6)

  - port: 8081
    protocol: tcp
    name: "SFTPGo Web Admin"
    container: sftpgo
    access: custom
    sources:
      - "10.37.70.24/32"  # nginx internal (IPv4)
      - "fd00:1337:1337:70::24/128"  # nginx internal (IPv6)
      - "10.37.20.0/24"  # trusted_vlan (IPv4)
      - "fd00:1337:1337:20::/64"  # trusted_vlan (IPv6)
