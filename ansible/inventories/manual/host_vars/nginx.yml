---
# Configuration for nginx (10.37.70.5) - Nginx DMZ Reverse Proxy

# =============================================================================
# CrowdSec Configuration
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://10.37.70.26:8080"
crowdsec_lapi_host: "crowdsec.localdomain"
crowdsec_wait_for_approval: false

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/nginx

crowdsec_acquis:
  - name: nginx
    filenames:
      - /var/log/nginx/*.log
    labels:
      type: nginx

  - name: sshd
    filenames:
      - /var/log/secure
    labels:
      type: syslog

  - name: linux
    filenames:
      - /var/log/messages
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# =============================================================================
# Firewall Configuration
# =============================================================================

# SSH access (host-specific)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24"   # trusted_vlan
  - "10.37.90.0/24"   # wireguard_vlan
  - "10.37.70.21/32"  # Ansible controller
  - "10.37.70.25/32"  # semaphore

# Using unified firewall_services structure with access levels
firewall_services:
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: public  # Publicly accessible web server

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: public  # Publicly accessible web server

  - port: 8883
    protocol: tcp
    name: "MQTTS - MQTT over TLS"
    access: public  # Publicly accessible MQTT broker
    # To restrict to specific IPs, change access to 'custom' and uncomment sources:
    # access: custom
    # sources:
    #   - "10.37.0.0/16"      # Internal networks (IPv4)
    #   - "192.168.0.0/16"    # Home networks (IPv4)
    #   - "fd00::/8"          # ULA IPv6
