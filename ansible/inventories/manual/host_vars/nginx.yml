---
# Configuration for nginx (10.37.70.5) - Nginx DMZ Reverse Proxy
# OS: RHEL 9.7 (legacy host — predates the AlmaLinux 10 migration; rebuild later).
# nginx is installed from upstream nginx.org `stable` (not the RHEL AppStream
# module — the nginx:1.22 module stream was retired by Red Hat and stranded
# the package). The .repo file at /etc/yum.repos.d/nginx.repo is hand-written.
host_os_family: rhel
host_os_version: "9.7"
nginx_source: upstream-nginx-org-stable

# =============================================================================
# CrowdSec Configuration
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://10.37.70.26:8080"
crowdsec_lapi_host: "crowdsec.localdomain"
crowdsec_wait_for_approval: false

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/nginx

crowdsec_acquis:
  - name: nginx
    filenames:
      - /var/log/nginx/*.log
    labels:
      type: nginx

  - name: sshd
    filenames:
      - /var/log/secure
    labels:
      type: syslog

  - name: linux
    filenames:
      - /var/log/messages
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# Parser-stage whitelists - drop noisy legitimate traffic before it reaches scenarios
crowdsec_parser_whitelists:
  - name: nextcloud-whitelist
    full_name: homelab/nextcloud-whitelist
    description: "Whitelist legitimate Nextcloud WebDAV sync traffic"
    filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
    reason: "Legitimate Nextcloud/WebDAV file sync traffic"
    expressions:
      # Any client using WebDAV verbs against Nextcloud DAV endpoints
      # (covers WinSCP/neon, Cyberduck, davfs2, GoodSync, future clients)
      - "evt.Parsed.request startsWith '/remote.php/dav/' && evt.Parsed.verb in ['PROPFIND','PROPPATCH','MKCOL','MOVE','COPY','LOCK','UNLOCK','REPORT']"
      # rclone syncing via Nextcloud WebDAV
      - "evt.Parsed.http_user_agent contains 'rclone' && evt.Parsed.request startsWith '/remote.php/dav/'"
      # Official Nextcloud desktop/mobile sync client
      - "evt.Parsed.http_user_agent contains 'Nextcloud' && evt.Parsed.request startsWith '/remote.php/dav/'"
      # Any WebDAV client identifying itself as DAV (Cyberduck, etc.)
      - "evt.Parsed.http_user_agent contains 'DAV' && evt.Parsed.request startsWith '/remote.php/dav/'"

  - name: plex-whitelist
    full_name: homelab/plex-whitelist
    description: "Whitelist legitimate Plex media server requests"
    filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
    reason: "Legitimate Plex media server traffic"
    expressions:
      - "evt.Parsed.http_x_plex_token != ''"
      - "evt.Parsed.http_x_plex_client_identifier != ''"
      - "evt.Parsed.http_user_agent contains 'Plex'"
      - "evt.Parsed.http_user_agent contains 'PlexMediaPlayer'"
      - "evt.Parsed.request startsWith '/library/'"
      - "evt.Parsed.request matches '.*/library/metadata/.*/thumb/.*'"
      - "evt.Parsed.request startsWith '/search'"
      - "evt.Parsed.request startsWith '/hubs/search'"
      - "evt.Parsed.request startsWith '/video/:/transcode'"

# =============================================================================
# Firewall Configuration
# =============================================================================

# SSH access (host-specific)
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.21/32" # Ansible controller
  - "10.37.70.25/32" # semaphore

# Using unified firewall_hardened_services structure with access levels
firewall_hardened_services:
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: public # Publicly accessible web server

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: public # Publicly accessible web server

  - port: 8883
    protocol: tcp
    name: "MQTTS - MQTT over TLS"
    access: public # Publicly accessible MQTT broker
    # To restrict to specific IPs, change access to 'custom' and uncomment sources:
    # access: custom
    # sources:
    #   - "10.37.0.0/16"      # Internal networks (IPv4)
    #   - "192.168.0.0/16"    # Home networks (IPv4)
    #   - "fd00::/8"          # ULA IPv6
