---
# Firewall configuration for nginx (10.37.70.5) - Nginx Reverse Proxy

# SSH access (host-specific)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24"   # trusted_vlan
  - "10.37.90.0/24"   # wireguard_vlan
  - "10.37.70.27/32"  # ansible.localdomain
  - "10.37.70.21/32"  # Ansible controller
  - "10.37.70.25/32"  # semaphore

# Using unified firewall_services structure with access levels
firewall_services:
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: public  # Publicly accessible web server

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: public  # Publicly accessible web server

  - port: 8883
    protocol: tcp
    name: "MQTTS - MQTT over TLS"
    access: public  # Publicly accessible MQTT broker
    # To restrict to specific IPs, change access to 'custom' and uncomment sources:
    # access: custom
    # sources:
    #   - "10.37.0.0/16"      # Internal networks (IPv4)
    #   - "192.168.0.0/16"    # Home networks (IPv4)
    #   - "fd00::/8"          # ULA IPv6
