---
# Configuration for caddy-dmz (Caddy DMZ Reverse Proxy)
# Replaces the legacy nginx DMZ host (nginx / 10.37.70.5). Runs a custom Caddy
# build (cloudflare DNS + caddy-l4) serving the public web tier with ECH plus
# the MQTT-over-TLS stream. Cut over by moving the OPNsense 80/443/8883 NAT
# from 10.37.70.5 to this host; retire the old VM after soak.
host_os_family: rhel
host_os_version: "10" # AlmaLinux 10

# TODO: set to the provisioned VM's static IP (free address in VLAN 70).
ansible_host: "10.37.70.6"

# =============================================================================
# CrowdSec Configuration (own agent; reads Caddy JSON access logs)
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://10.37.70.26:8080"
crowdsec_lapi_host: "crowdsec.localdomain"
crowdsec_wait_for_approval: false

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/caddy

crowdsec_acquis:
  - name: caddy
    filenames:
      - /var/log/caddy/*.access.log
    labels:
      type: caddy

  - name: sshd
    filenames:
      - /var/log/secure
    labels:
      type: syslog

  - name: linux
    filenames:
      - /var/log/messages
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# Parser-stage whitelists - carried over from the nginx DMZ host. They key on
# request paths / user-agents, so they apply to Caddy's HTTP access logs too.
crowdsec_parser_whitelists:
  - name: nextcloud-whitelist
    full_name: homelab/nextcloud-whitelist
    description: "Whitelist legitimate Nextcloud WebDAV sync traffic"
    filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
    reason: "Legitimate Nextcloud/WebDAV file sync traffic"
    expressions:
      - "evt.Parsed.request startsWith '/remote.php/dav/' && evt.Parsed.verb in ['PROPFIND','PROPPATCH','MKCOL','MOVE','COPY','LOCK','UNLOCK','REPORT']"
      - "evt.Parsed.http_user_agent contains 'rclone' && evt.Parsed.request startsWith '/remote.php/dav/'"
      - "evt.Parsed.http_user_agent contains 'Nextcloud' && evt.Parsed.request startsWith '/remote.php/dav/'"
      - "evt.Parsed.http_user_agent contains 'DAV' && evt.Parsed.request startsWith '/remote.php/dav/'"

  - name: plex-whitelist
    full_name: homelab/plex-whitelist
    description: "Whitelist legitimate Plex media server requests"
    filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
    reason: "Legitimate Plex media server traffic"
    expressions:
      - "evt.Parsed.http_x_plex_token != ''"
      - "evt.Parsed.http_x_plex_client_identifier != ''"
      - "evt.Parsed.http_user_agent contains 'Plex'"
      - "evt.Parsed.http_user_agent contains 'PlexMediaPlayer'"
      - "evt.Parsed.request startsWith '/library/'"
      - "evt.Parsed.request matches '.*/library/metadata/.*/thumb/.*'"
      - "evt.Parsed.request startsWith '/search'"
      - "evt.Parsed.request startsWith '/hubs/search'"
      - "evt.Parsed.request startsWith '/video/:/transcode'"

# =============================================================================
# Firewall Configuration
# =============================================================================
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.21/32" # Ansible controller
  - "10.37.70.25/32" # semaphore

firewall_hardened_services:
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: public

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: public

  - port: 8883
    protocol: tcp
    name: "MQTTS - MQTT over TLS"
    access: public
