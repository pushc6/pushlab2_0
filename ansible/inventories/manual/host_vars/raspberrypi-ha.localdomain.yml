---
# Firewall configuration for raspberrypi-ha.localdomain (10.37.50.12)
# Home Assistant companion services - Zigbee2MQTT and Z-Wave JS UI
# OS: Debian 12 (Bookworm) on Raspberry Pi

# =============================================================================
# Komodo Periphery (GitOps agent)
# =============================================================================
# Lets Komodo Core (docker-internal 10.37.70.25, DMZ) deploy/redeploy the
# zigbee2mqtt / zwavejs2mqtt compose Stacks on this host. Cross-VLAN (this host
# is single-homed on the IoT VLAN) so an OPNsense DMZ->IoT rule for :8120 is
# also required (group_vars/opnsense/vars.yml). Auth is PKI
# (komodo_periphery_core_public_keys, in group_vars/all).
komodo_periphery_allowed_ips:
  - "10.37.70.25" # Komodo Core (docker-internal)

# SSH access (host-specific)
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.21/32" # Ansible controller
  - "10.37.70.25/32" # semaphore

firewall_hardened_services:
  # ============================================================================
  # Zigbee2MQTT Web Interface
  # ============================================================================

  - port: 8080
    protocol: tcp
    name: "Zigbee2MQTT Web UI"
    access: custom
    sources:
      - "10.37.20.0/24" # Trusted VLAN (IPv4)
      - "fd00:1337:1337:20::/64" # Trusted VLAN (IPv6)
      - "10.37.50.0/24" # IoT VLAN (IPv4)
      - "fd00:1337:1337:50::/64" # IoT VLAN (IPv6)
      - "10.37.70.20/32" # HomeAssistant DMZ (IPv4)
      - "fd00:1337:1337:70::20/128" # HomeAssistant DMZ (IPv6)

  # ============================================================================
  # Z-Wave JS UI - Web Interface and WebSocket
  # ============================================================================

  - port: 3000
    protocol: tcp
    name: "Z-Wave JS UI Web"
    access: custom
    sources:
      - "10.37.20.0/24" # Trusted VLAN (IPv4)
      - "fd00:1337:1337:20::/64" # Trusted VLAN (IPv6)
      - "10.37.50.0/24" # IoT VLAN (IPv4)
      - "fd00:1337:1337:50::/64" # IoT VLAN (IPv6)
      - "10.37.70.20/32" # HomeAssistant DMZ (IPv4)
      - "fd00:1337:1337:70::20/128" # HomeAssistant DMZ (IPv6)

  - port: 8091
    protocol: tcp
    name: "Z-Wave JS UI WebSocket"
    access: custom
    sources:
      - "10.37.20.0/24" # Trusted VLAN (IPv4)
      - "fd00:1337:1337:20::/64" # Trusted VLAN (IPv6)
      - "10.37.50.0/24" # IoT VLAN (IPv4)
      - "fd00:1337:1337:50::/64" # IoT VLAN (IPv6)
      - "10.37.70.20/32" # HomeAssistant DMZ (IPv4)
      - "fd00:1337:1337:70::20/128" # HomeAssistant DMZ (IPv6)

  # ============================================================================
  # mDNS/Avahi - Local service discovery (IoT VLAN only)
  # ============================================================================

  - port: 5353
    protocol: udp
    name: "mDNS Avahi"
    access: custom
    sources:
      - "10.37.20.0/24" # Trusted VLAN (IPv4)
      - "fd00:1337:1337:20::/64" # Trusted VLAN (IPv6)
      - "10.37.50.0/24" # IoT VLAN (IPv4)
      - "fd00:1337:1337:50::/64" # IoT VLAN (IPv6)

  # ============================================================================
  # Komodo Periphery - GitOps agent (Komodo Core deploys Stacks over this port)
  # ============================================================================

  - port: 8120
    protocol: tcp
    name: "Komodo Periphery - GitOps agent"
    container: komodo-periphery
    access: custom
    sources:
      - "10.37.70.25/32" # Komodo Core - docker-internal (IPv4)
      - "fd00:1337:1337:70::25/128" # Komodo Core - docker-internal (IPv6)
