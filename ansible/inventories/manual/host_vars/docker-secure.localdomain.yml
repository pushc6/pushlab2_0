---
# Firewall configuration for docker-secure.localdomain (10.37.20.2)

# Defer reboot so Semaphore can finish the Ansible run before the host restarts
debian_updates_schedule_reboot: true
debian_updates_reboot_delay_minutes: 15

# =============================================================================
# Komodo Periphery (GitOps agent)
# =============================================================================
# Lets Komodo Core (docker-internal 10.37.70.25) deploy/redeploy compose Stacks
# on this host. Auth is PKI (komodo_periphery_core_public_keys, in group_vars/all).
komodo_periphery_allowed_ips:
  - "10.37.70.25" # Komodo Core (docker-internal)
# This host IS the network's primary DNS (Technitium on 127.0.0.1), so Docker
# strips the loopback resolver from container resolv.conf and the Periphery
# container can't resolve git.push-lab.com to clone stacks. Point it at this
# host's own LAN IP where Technitium answers.
komodo_periphery_dns:
  - "10.37.70.2" # docker-secure LAN IP (Technitium DNS)

# SSH access (host-specific)
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.21/32" # Ansible controller
  - "10.37.70.25/32" # semaphore

firewall_hardened_services:
  # ============================================================================
  # DNS Services - Allow DNS queries from all internal networks
  # ============================================================================

  - port: 53
    protocol: tcp
    name: "DNS TCP"
    access: custom
    sources:
      - "10.37.0.0/16" # All internal networks (IPv4)
      - "fd00:1337:1337::/48" # All internal networks (IPv6)

  - port: 53
    protocol: udp
    name: "DNS UDP"
    access: custom
    sources:
      - "10.37.0.0/16" # All internal networks (IPv4)
      - "fd00:1337:1337::/48" # All internal networks (IPv6)

  # ============================================================================
  # DHCP Services - Allow DHCP from all internal networks
  # ============================================================================

  - port: 67
    protocol: udp
    name: "DHCP Server"
    access: custom
    sources:
      - "10.37.0.0/16" # All internal networks (IPv4)

  - port: 68
    protocol: udp
    name: "DHCP Client"
    access: custom
    sources:
      - "10.37.0.0/16" # All internal networks (IPv4)

  # ============================================================================
  # Technitium DNS Web UI - Management access only
  # ============================================================================

  - port: 5380
    protocol: tcp
    name: "Technitium DNS Web UI"
    access: custom
    sources:
      - "10.37.20.0/24" # Trusted VLAN (IPv4)
      - "fd00:1337:1337:20::/64" # Trusted VLAN (IPv6)

  # ============================================================================
  # Komodo Periphery - GitOps agent (Komodo Core deploys Stacks over this port)
  # ============================================================================

  - port: 8120
    protocol: tcp
    name: "Komodo Periphery - GitOps agent"
    container: komodo-periphery
    access: custom
    sources:
      - "10.37.70.25/32" # Komodo Core - docker-internal (IPv4)
      - "fd00:1337:1337:70::25/128" # Komodo Core - docker-internal (IPv6)
