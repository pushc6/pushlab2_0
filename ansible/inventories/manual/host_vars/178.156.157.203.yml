---
# Firewall configuration for 178.156.157.203 - External VPS with Nginx

# VPS-specific: SSH must remain publicly accessible (no SSH hardening)
firewall_ssh_hardening_enabled: false

# SSH access - public VPS needs unrestricted SSH access
# (firewall_ssh_hardening_enabled: false disables rich rules, but we define this for documentation)
firewall_ssh_allowed_subnets:
  - "0.0.0.0/0"  # Public SSH access required for VPS

# Using unified firewall_services structure with rich rules
firewall_services:
  # Public services - publicly accessible nginx
  - port: 80
    protocol: tcp
    name: "HTTP"
    access: public

  - port: 443
    protocol: tcp
    name: "HTTPS"
    access: public

  - port: 41641
    protocol: udp
    name: "Tailscale"
    access: public

# Note: Port 3001 is NOT opened in firewall
# Nginx on this host forwards to localhost:3001 internally
# No external access needed
