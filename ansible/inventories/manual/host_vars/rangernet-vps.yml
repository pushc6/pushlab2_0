---
# Configuration for rangernet-vps (192.210.235.136) - External VPS
# Single source of truth for this host (the old playbook-dir ansible/host_vars/
# copy was deleted — it shadowed firewall_hardened_services to []).
ansible_user: ansible

# =============================================================================
# Tailscale Configuration
# =============================================================================
tailscale_enabled: true
tailscale_hostname: "rangernet-vps"
tailscale_tags:
  - "tag:crowdsec-agent"
  - "tag:komodo-periphery" # lets Komodo Core (tag:komodo-core) reach 8120 via ACL
# Accept the subnet route advertised by docker-internal so this public VPS can
# reach the internal Git endpoint (git.push-lab.com / 10.37.70.24) for stack
# clones. Applied via `tailscale set` (no reconnect) so the node IP is preserved.
tailscale_accept_routes: true

# =============================================================================
# Komodo Periphery (managed by Komodo Core over Tailscale)
# =============================================================================
# Bind the published 8120 port to this host's Tailscale IP so Periphery is
# reachable ONLY over the tailnet, never on the public interface. A published
# Docker port bypasses the host firewall, so this bind is the real control.
komodo_periphery_bind_address: "100.78.119.4" # rangernet-vps tailnet IP
# Defense-in-depth (PKI is the real auth + bind_address keeps 8120 tailnet-only).
# Locked to Komodo Core's tailnet IP (docker-internal, tag:komodo-core).
komodo_periphery_allowed_ips:
  - "100.107.104.49/32" # docker-internal tailnet IP
# Resolve the Git endpoint to nginx-internal inside the Periphery container; the
# host can't resolve it (public VPS) and Docker DNS won't read host /etc/hosts.
# Reached over the tailnet subnet route advertised by docker-internal.
komodo_periphery_extra_hosts:
  git.push-lab.com: "10.37.70.24"

# =============================================================================
# CrowdSec Configuration
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://crowdsec.crane-beaver.ts.net:8080"
crowdsec_lapi_host: "crowdsec.localdomain" # For bouncer registration
crowdsec_wait_for_approval: false # No interactive prompts (for Semaphore/CI)

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/nginx

crowdsec_acquis:
  - name: nginx
    filenames:
      - /var/log/nginx/access.log
      - /var/log/nginx/error.log
    labels:
      type: nginx
  - name: sshd
    journalctl_filter:
      - "_SYSTEMD_UNIT=sshd.service"
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# Drift check: detect nftables set desync from LAPI (cs-firewall-bouncer #243)
crowdsec_bouncer_drift_check_enabled: true
crowdsec_drift_check_nft_set: crowdsec-blacklists-crowdsec

# =============================================================================
# Firewall Configuration — default-deny allowlist (public VPS)
# =============================================================================
# Strict mode: ONLY the services declared below stay open; firewalld defaults
# (cockpit, dhcpv6-client) and stray ports (legacy 3001/tcp) are removed every run.
# rangernet has no public IPv6 (only the Tailscale ULA) and no DHCPv6, so
# dhcpv6-client is safe to drop — no firewall_hardened_allowed_services needed.
firewall_hardened_strict_allowlist: true

# VPS-specific: SSH must remain publicly accessible (no SSH hardening). With
# hardening disabled, strict mode keeps the ssh service open (explicit allow).
firewall_hardened_ssh_hardening_enabled: false
firewall_hardened_ssh_allowed_subnets:
  - "0.0.0.0/0" # Public SSH access required for VPS

# The explicit public allowlist. Everything not here is closed by strict mode.
firewall_hardened_services:
  # Tailscale direct WireGuard (without this the node falls back to DERP relay).
  - port: 41641
    protocol: udp
    name: "Tailscale WireGuard"
    access: public

  # Public websites served by the host's native nginx (incl. uptime.push-lab.com,
  # which reverse-proxies uptime-kuma at 127.0.0.1:3001).
  - port: 80
    protocol: tcp
    name: "HTTP (public sites)"
    access: public
  - port: 443
    protocol: tcp
    name: "HTTPS (public sites + uptime.push-lab.com)"
    access: public

  # Komodo Periphery, tailnet-only. Also bound to the Tailscale IP via
  # komodo_periphery_bind_address; this restricts at the firewall to Core's IP.
  - port: 8120
    protocol: tcp
    name: "Komodo Periphery (tailnet only)"
    access: custom
    sources:
      - "100.107.104.49/32" # docker-internal (Komodo Core) tailnet IP
