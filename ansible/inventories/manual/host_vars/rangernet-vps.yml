---
# Configuration for rangernet-vps (192.210.235.136) - External VPS

# =============================================================================
# Tailscale Configuration
# =============================================================================
tailscale_enabled: true
tailscale_hostname: "rangernet-vps"
tailscale_tags:
  - "tag:crowdsec-agent"
  - "tag:komodo-periphery" # lets Komodo Core (tag:komodo-core) reach 8120 via ACL

# =============================================================================
# Komodo Periphery (managed by Komodo Core over Tailscale)
# =============================================================================
# Bind the published 8120 port to this host's Tailscale IP so Periphery is
# reachable ONLY over the tailnet, never on the public interface. A published
# Docker port bypasses the host firewall, so this bind is the real control.
komodo_periphery_bind_address: "100.78.119.4" # rangernet-vps tailnet IP
# Defense-in-depth (PKI is the real auth + bind_address keeps 8120 tailnet-only).
# Locked to Komodo Core's tailnet IP (docker-internal, tag:komodo-core).
komodo_periphery_allowed_ips:
  - "100.107.104.49/32" # docker-internal tailnet IP
# dockerd publishes 8120 on the Tailscale IP above. At boot it would otherwise start before
# tailscale0 has that address, silently producing a container with NO network endpoint that
# still reports "Up" -- unreachable until recreated (2026-08-15 incident). Order dockerd
# behind the address becoming available. Only this host binds to a dynamic IP.
komodo_periphery_docker_wait_for_tailscale: true

# Preserve the real tailnet source IP into the Docker bridge. Tailscale's default
# subnet-route SNAT rewrites it to 172.17.0.1, which makes komodo_periphery_allowed_ips
# above reject EVERY request with 401 "requesting ip not allowed" and Core mark this
# server unhealthy. This host advertises no subnet routes, so nothing else depends on it.
# (2026-08-22 outage; see tailscale_snat_subnet_routes in the tailscale role defaults.)
tailscale_snat_subnet_routes: false

# This host is off-LAN, so git.push-lab.com has to resolve over the tailnet. That is now
# a Tailscale Split DNS route (git.push-lab.com -> 10.37.70.2, the Technitium resolver on
# docker-secure), which works because docker-internal advertises 10.37.70.2/32 alongside
# the pre-existing 10.37.70.24/32 for nginx_internal. Both routes need admin-console
# approval AND an ACL grant (tag:komodo-periphery -> 10.37.70.2:53); without the grant the
# coordination server strips the route from this node's netmap and it never installs.
#
# This replaces a komodo_periphery_etc_hosts pin of git.push-lab.com -> 10.37.70.24, which
# fixed one name in one container. Removed 2026-08-22 after verifying a container with no
# /etc/hosts entry resolves via MagicDNS (nameserver 100.100.100.100, reachable from
# docker0 even with tailscale_snat_subnet_routes: false).

# Host-level nftables backstop so the tailnet ACL and PERIPHERY_ALLOWED_IPS are not the
# only things scoping 8120 to Core. Needed here because the personal (untagged) devices
# hold a broad tailnet grant to this VPS.
komodo_periphery_guard_enabled: true

# =============================================================================
# CrowdSec Configuration
# =============================================================================
crowdsec_enabled: true
crowdsec_mode: agent
crowdsec_lapi_url: "http://crowdsec.crane-beaver.ts.net:8080"
crowdsec_lapi_host: "crowdsec.localdomain" # For bouncer registration
crowdsec_wait_for_approval: false # No interactive prompts (for Semaphore/CI)

crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/nginx

crowdsec_acquis:
  - name: nginx
    filenames:
      - /var/log/nginx/access.log
      - /var/log/nginx/error.log
    labels:
      type: nginx
  - name: sshd
    journalctl_filter:
      - "_SYSTEMD_UNIT=sshd.service"
    labels:
      type: syslog

crowdsec_bouncers:
  - name: firewall
    type: nftables
    enabled: true

# Drift check: detect nftables set desync from LAPI (cs-firewall-bouncer #243)
crowdsec_bouncer_drift_check_enabled: true
crowdsec_drift_check_nft_set: crowdsec-blacklists-crowdsec

# =============================================================================
# Firewall Configuration
# =============================================================================

# VPS-specific: SSH must remain publicly accessible (no SSH hardening)
firewall_hardened_ssh_hardening_enabled: false

# SSH access - public VPS needs unrestricted SSH access
# (firewall_hardened_ssh_hardening_enabled: false disables rich rules, but we define this for documentation)
firewall_hardened_ssh_allowed_subnets:
  - "0.0.0.0/0" # Public SSH access required for VPS

# Using unified firewall_hardened_services structure with rich rules
firewall_hardened_services:
  # Tailscale direct connection (avoid DERP relay)
  - port: 41641
    protocol: udp
    name: "Tailscale WireGuard"
    access: public

  # Komodo Periphery, tailnet-only. Secondary to komodo_periphery_bind_address
  # (the bind to the Tailscale IP is what actually keeps 8120 off the public NIC).
  - port: 8120
    protocol: tcp
    name: "Komodo Periphery (tailnet only)"
    access: custom
    sources:
      - "100.107.104.49/32" # docker-internal (Komodo Core) tailnet IP
