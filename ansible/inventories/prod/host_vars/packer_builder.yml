---
# Host variables for packer-builder VM

# SSH access (host-specific)
firewall_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.25/32" # semaphore

# Firewall configuration (firewall_hardened role)
firewall_services:
  - port: 8080
    protocol: tcp
    name: "Packer HTTP Server"
    access: custom
    sources:
      - "10.37.80.0/24" # App VLAN - VMs being built

# Gitea runner configuration
gitea_instance_url: "http://10.37.80.4:3000"
gitea_runner_name: "packer-builder"
gitea_runner_labels:
  - "self-hosted"
  - "linux"
  - "x64"
  - "packer-vm"

# Token passed via --extra-vars from Gitea secret RUNNER_REGISTRATION_TOKEN
# Example: ansible-playbook packer-builder.yml --extra-vars "gitea_runner_registration_token=$RUNNER_REGISTRATION_TOKEN"
