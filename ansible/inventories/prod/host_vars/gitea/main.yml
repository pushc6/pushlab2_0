---
# Non-secret host vars for gitea. Secrets live in vault.yml (encrypted).
# Uncomment after creating an encrypted vault.yml from vault.yml.example.
# gitea_admin_username: "{{ vault_gitea_admin_username }}"
# gitea_admin_password: "{{ vault_gitea_admin_password }}"
# gitea_admin_email: "{{ vault_gitea_admin_email }}"

# Actions runner labels. Every CI workflow targets
# `runs-on: [self-hosted, linux, x64, alma]`, so the runner registered
# on this host must advertise the `alma` label.
gitea_runner_labels_extra:
  - alma

# Secondary disk for repositories and app data. Must match the Terraform
# `data_disk_size_gb`, `data_mount_point`, and `data_fs_type` values in
# terraform/envs/prod/prod.tfvars so the role can identify and mount it.
data_disk_size_gb: 50
mount_data_disk_mount_point: /var/lib/gitea
mount_data_disk_fs_type: xfs
