---
# Firewall configuration for dns02 - Technitium DNS Server.
# Multi-homed across all VLANs (10.37.X.254 on each); Ansible reaches it via
# the App VLAN interface 10.37.80.254. Technitium :5380 admin binds on the
# Trusted (10.37.20.254) and App (10.37.80.254) VLANs; DNS :53 listens on all.

# SSH access (host-specific)
firewall_hardened_ssh_allowed_subnets:
  - "10.37.20.0/24" # trusted_vlan
  - "10.37.90.0/24" # wireguard_vlan
  - "10.37.70.25/32" # semaphore

# Using unified firewall_hardened_services structure with rich rules
firewall_hardened_services:
  # Custom services - DNS accessible from local networks
  - port: 53
    protocol: tcp
    name: "DNS TCP"
    access: custom
    sources:
      - "10.37.0.0/16"

  - port: 53
    protocol: udp
    name: "DNS UDP"
    access: custom
    sources:
      - "10.37.0.0/16"

  # Technitium web admin UI from a workstation in the Trusted VLAN.
  - port: 5380
    protocol: tcp
    name: "Technitium Web Console"
    access: trusted_vlan

  # Technitium API for Semaphore-driven automation (technitium_dns_sync role).
  - port: 5380
    protocol: tcp
    name: "Technitium API (Semaphore)"
    access: custom
    sources:
      - "10.37.70.25/32" # semaphore

  # DHCP server (active/active with dns01 via per-scope offer delay).
  - port: 67
    protocol: udp
    name: "DHCP Server"
    access: custom
    sources:
      - "10.37.0.0/16"

# DNS server listen endpoints. Mirrors dns01's pattern -- each VLAN's IPv4
# and IPv6 ULA explicitly bound. Without this, Technitium binds only to
# 0.0.0.0:53 (IPv4 wildcard) and IPv6 DNS queries to dns02's ULAs/GUA
# wouldn't be answered. Keep in sync with `additional_interfaces` below.
# Upstream DNS forwarders -- mirrors dns01's ControlD configuration.
# Technitium forwards external queries to these instead of doing native
# recursion. UDP/53 is the default protocol.
technitium_forwarders:
  - "76.76.2.198"
  - "76.76.10.198"
technitium_forwarder_protocol: "Udp"

technitium_dns_local_endpoints:
  # Loopback v4 + v6. dns01 only binds the v4 loopback; we bind both on
  # dns02 so anything explicitly targeting ::1 (manual `dig @::1`, future
  # tooling that hardcodes IPv6 loopback) gets answered. Doesn't change
  # the system resolver -- /etc/resolv.conf still points at dns01.
  - "127.0.0.1:53"
  - "[::1]:53"
  # VLAN 10 - Management (primary)
  - "10.37.10.254:53"
  - "[fd00:1337:1337:10::254]:53"
  # VLAN 20 - Trusted
  - "10.37.20.254:53"
  - "[fd00:1337:1337:20::254]:53"
  # VLAN 30 - Storage
  - "10.37.30.254:53"
  - "[fd00:1337:1337:30::254]:53"
  # VLAN 40 - LAN-only
  - "10.37.40.254:53"
  - "[fd00:1337:1337:40::254]:53"
  # VLAN 50 - IoT
  - "10.37.50.254:53"
  - "[fd00:1337:1337:50::254]:53"
  # VLAN 60 - Guest
  - "10.37.60.254:53"
  - "[fd00:1337:1337:60::254]:53"
  # VLAN 80 - App (uplink)
  - "10.37.80.254:53"
  - "[fd00:1337:1337:80::254]:53"
  # VLAN 100 - Test
  - "10.37.100.254:53"
  - "[fd00:1337:1337:100::254]:53"

# Technitium API + replication settings.
# Tokens come from Semaphore env vars (TECHNITIUM_API_TOKEN_DNS0X). The
# `vault_... | default('')` fallback lets a local run with an ansible-vault
# file work too -- matches the acme.yml pattern. Resolves to empty string
# when neither source is set so the role can skip API tasks on first deploy
# (chicken-and-egg: container has to exist before you can create a token).
technitium_dns_domain: "dns02.push-lab.com"
technitium_api_token: >-
  {{ lookup('env', 'TECHNITIUM_API_TOKEN_DNS02') | default('', true)
     or (vault_technitium_api_token_dns02 | default('')) }}

technitium_secondary_zones:
  - name: "localdomain"
    primary_addresses: ["10.37.80.2"] # dns01

# DNS Apps mirrored from dns01.
technitium_dns_apps:
  - name: "Log Exporter"
    url: "https://download.technitium.com/dns/apps/LogExporterApp-v1.0.2.zip"
    config:
      maxQueueSize: 10000
      file:
        enabled: false
        path: ""
      http:
        enabled: false
        endpoint: ""
      syslog:
        enabled: true
        address: "10.37.70.25" # semaphore host (syslog receiver)
        port: 1514
        protocol: "udp"

# DHCP scopes mirroring dns01's enabled scopes (see
# docs/dns01-config-snapshot/scopes/*.json for source). All start disabled;
# flip enabled=true per scope when ready to serve (Phase 8 of the rollout).
# offerDelayTime is intentionally absent from each entry -- the offer-delay
# task overrides it on every play based on technitium_dhcp_offer_delay_ms.
technitium_dhcp_scopes:
  - name: "VLAN10 (Management)"
    enabled: false
    starting_address: "10.37.10.1"
    ending_address: "10.37.10.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.10.1"
    dns_servers: ["10.37.10.2", "10.37.10.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN20 (Trusted)"
    enabled: false
    starting_address: "10.37.20.1"
    ending_address: "10.37.20.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.20.1"
    dns_servers: ["10.37.20.2", "10.37.20.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN30 (Storage)"
    enabled: false
    starting_address: "10.37.30.1"
    ending_address: "10.37.30.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.30.1"
    dns_servers: ["10.37.30.2", "10.37.30.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN50 (IoT)"
    enabled: false
    starting_address: "10.37.50.1"
    ending_address: "10.37.50.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.50.1"
    dns_servers: ["10.37.50.2", "10.37.50.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN60 (Guest)"
    enabled: false
    starting_address: "10.37.60.1"
    ending_address: "10.37.60.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.60.1"
    dns_servers: ["10.37.60.2", "10.37.60.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN70 (DMZ)"
    enabled: false
    starting_address: "10.37.70.1"
    ending_address: "10.37.70.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.70.1"
    dns_servers: ["10.37.70.2", "10.37.70.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN80 (App)"
    enabled: false
    starting_address: "10.37.80.1"
    ending_address: "10.37.80.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.80.1"
    dns_servers: ["10.37.80.2", "10.37.80.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false
  - name: "VLAN100 (Unused)"
    # Mirrors dns01's disabled-but-defined VLAN100 scope. Kept here so the
    # reservation-sync log on dns02 stays quiet (the source iterates every
    # dns01 scope and previously failed when this scope was absent on dns02).
    enabled: false
    starting_address: "10.37.100.1"
    ending_address: "10.37.100.254"
    subnet_mask: "255.255.255.0"
    lease_time_days: 1
    router_address: "10.37.100.1"
    dns_servers: ["10.37.100.2", "10.37.100.254"]
    use_this_dns_server: false
    domain_name: "localdomain"
    dns_updates: false

# Hot-standby: wait 5 s before answering DHCPDISCOVER so dns01 wins the race.
# Applied to every scope present on this host.
technitium_dhcp_offer_delay_ms: 5000

technitium_reservation_sync_enabled: true
technitium_reservation_sync_primary_host: "10.37.80.2" # dns01
technitium_reservation_sync_primary_token: >-
  {{ lookup('env', 'TECHNITIUM_API_TOKEN_DNS01') | default('', true)
     or (vault_technitium_api_token_dns01 | default('')) }}
