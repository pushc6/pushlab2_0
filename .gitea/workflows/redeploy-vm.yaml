name: Redeploy Virtual Machine
run-name: Redeploy VM ${{ inputs.vm_name }}

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: 'Name of the VM to redeploy (e.g., dns02, gitea)'
        required: true
        default: 'dns02'
      environment:
        description: 'Terraform environment/workspace'
        required: true
        default: 'prod'

jobs:
  redeploy:
    runs-on: [self-hosted, linux, x64, alma]
    container:
      image: almalinux-cicd:latest
    
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
      TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      # Assuming we don't need private key for pure deployment (unless provisioner needs it)
      # TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: Taint VM Resource
        working-directory: terraform/envs/${{ inputs.environment }}
        run: |
          # Try to taint unprotected resource first, then protected if not found
          # Note: The resource path matches the structure in main.tf/modules
          if terraform state list | grep -q 'module.vm\["${{ inputs.vm_name }}"\].vsphere_virtual_machine.vm_unprotected\[0\]'; then
            terraform taint 'module.vm["${{ inputs.vm_name }}"].vsphere_virtual_machine.vm_unprotected[0]'
          elif terraform state list | grep -q 'module.vm\["${{ inputs.vm_name }}"\].vsphere_virtual_machine.vm_protected\[0\]'; then
             terraform taint 'module.vm["${{ inputs.vm_name }}"].vsphere_virtual_machine.vm_protected[0]'
          else
            echo "::error::VM resource for ${{ inputs.vm_name }} not found in state!"
            exit 1
          fi

      - name: Apply Changes (Recreate VM)
        working-directory: terraform/envs/${{ inputs.environment }}
        # Only target the specific module to limit blast radius
        # Must pass prod.tfvars for non-secret vars
        run: terraform apply -auto-approve -var-file=prod.tfvars -target='module.vm["${{ inputs.vm_name }}"]'
