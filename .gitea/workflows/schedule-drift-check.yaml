name: schedule-drift-check

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2:00 AM UTC daily
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  drift-check:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    steps:
      - name: Trigger Semaphore (Full Convergence)
        env:
          SEMAPHORE_URL: ${{ vars.SEMAPHORE_URL || secrets.SEMAPHORE_URL }}
          SEMAPHORE_TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
          SEMAPHORE_PROJECT_ID: ${{ vars.SEMAPHORE_PROJECT_ID || secrets.SEMAPHORE_PROJECT_ID }}
          SEMAPHORE_TEMPLATE_ID: ${{ vars.SEMAPHORE_TEMPLATE_ID || secrets.SEMAPHORE_TEMPLATE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${SEMAPHORE_URL:-}" ]; then echo "SEMAPHORE_URL not set; skipping"; exit 0; fi
          if [ -z "${SEMAPHORE_TOKEN:-}" ]; then echo "SEMAPHORE_TOKEN not set; skipping"; exit 0; fi
          if [ -z "${SEMAPHORE_PROJECT_ID:-}" ]; then echo "SEMAPHORE_PROJECT_ID not set; skipping"; exit 0; fi
          if [ -z "${SEMAPHORE_TEMPLATE_ID:-}" ]; then echo "SEMAPHORE_TEMPLATE_ID not set; skipping"; exit 0; fi

          echo "Triggering Semaphore Task Template ID: $SEMAPHORE_TEMPLATE_ID"

          # Trigger task via Semaphore API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${SEMAPHORE_URL}/api/project/${SEMAPHORE_PROJECT_ID}/tasks" \
            -H "Authorization: Bearer $SEMAPHORE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"template_id\": ${SEMAPHORE_TEMPLATE_ID}, \"environment\": \"{\\\"drift_check\\\": \\\"true\\\"}\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body:"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "$BODY" | jq . || echo "Task triggered successfully"
          else
            echo "Error: Semaphore API returned HTTP $HTTP_CODE"
            exit 1
          fi
