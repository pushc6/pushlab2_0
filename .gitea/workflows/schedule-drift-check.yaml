name: schedule-drift-check

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2:00 AM UTC daily
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  drift-check:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux:10
    steps:
      - name: Prep tools (dnf)
        run: |
          dnf -y makecache
          dnf -y install curl jq ca-certificates

      - name: Trigger AAP (Full Convergence)
        env:
          AAP_URL: ${{ vars.AAP_URL || secrets.AAP_URL }}
          AAP_TOKEN: ${{ secrets.AAP_TOKEN }}
          AAP_TOKEN_TYPE: ${{ vars.AAP_TOKEN_TYPE }}
          AAP_JOB_TEMPLATE_ID: ${{ secrets.AAP_JOB_TEMPLATE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AAP_URL:-}" ] || [ -z "${AAP_TOKEN:-}" ] || [ -z "${AAP_JOB_TEMPLATE_ID:-}" ]; then echo "AAP secrets not set; skipping"; exit 0; fi
          
          : "${AAP_TOKEN_TYPE:=Token}"
          AUTH_HEADER="Authorization: ${AAP_TOKEN_TYPE} ${AAP_TOKEN}"
          
          # No tags = Run All = Full Convergence
          DATA="{\"extra_vars\": {\"target_env\": \"prod\", \"drift_check\": \"true\"}}"
          
          echo "Triggering AAP for Drift Check (Full Run)..."
          
          curl -s -X POST "$AAP_URL/api/v2/job_templates/${AAP_JOB_TEMPLATE_ID}/launch/" \
            -H "Content-Type: application/json" \
            -H "$AUTH_HEADER" \
            -d "$DATA" | jq .
