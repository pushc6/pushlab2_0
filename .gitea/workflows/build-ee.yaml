name: Build Ansible Execution Environment

on:
  push:
    branches:
      - main
    paths:
      - 'execution-environment/**'
  workflow_dispatch:

env:
  REGISTRY_URL: git.push-lab.com
  IMAGE_NAME: ${{ github.repository_owner }}/ansible-ee
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GIT_TOKEN }}

permissions:
  packages: write

jobs:
  build-ee:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest # Use the image we created previously
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # execution-environment/requirements.yml is a hand-maintained mirror of
      # ansible/requirements.yml; fail the build if they drift (comments and
      # blank lines excluded from the comparison).
      - name: Verify requirements.yml is in sync with ansible/requirements.yml
        run: |
          set -euo pipefail
          if ! diff -u \
            <(grep -Ev '^\s*(#|$)' ansible/requirements.yml) \
            <(grep -Ev '^\s*(#|$)' execution-environment/requirements.yml); then
            echo "::error::execution-environment/requirements.yml has drifted from ansible/requirements.yml — keep them in sync."
            exit 1
          fi
          echo "requirements.yml files are in sync."

      - name: Install Python, Ansible Builder, and Docker CLI
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
          dnf install -y docker-ce-cli python3 python3-pip
          # Create a venv to avoid breaking system packages if strictly managed, 
          # but on docker:cli (Alpine) usually direct install is fine or venv is better.
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install ansible-builder

      - name: Log in to the container registry
        if: env.REGISTRY_USER != '' && env.REGISTRY_PASSWORD != ''
        run: |
          echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_URL -u "$REGISTRY_USER" --password-stdin
        
      - name: Build Execution Environment
        run: |
          . /tmp/venv/bin/activate
          cd execution-environment
          # Build using ansible-builder which drives docker
          # We pass -v 3 for verbosity to see what's happening
          ansible-builder build --tag ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} --tag ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest -v 3

          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
