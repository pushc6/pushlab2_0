name: Build Ansible Execution Environment

on:
  push:
    branches:
      - main
    paths:
      - 'execution-environment/**'
  workflow_dispatch:

env:
  REGISTRY_URL: git.push-lab.com
  IMAGE_NAME: ${{ github.repository_owner }}/ansible-ee
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GIT_TOKEN }}

jobs:
  build-ee:
    runs-on: [self-hosted, linux, x64, alma]
    container: docker:cli
    steps:
      - name: Checkout repository
        run: |
          # actions/checkout requires nodejs which is not in docker:cli
          # Use manual clone instead
          apk add --no-cache git
          rm -rf ${{ github.workspace }}/*
          git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }} ${{ github.workspace }}

      - name: Install Python and Ansible Builder
        run: |
          apk add --no-cache python3 py3-pip
          # Create a venv to avoid breaking system packages if strictly managed, 
          # but on docker:cli (Alpine) usually direct install is fine or venv is better.
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install ansible-builder

      - name: Log in to the container registry
        if: env.REGISTRY_USER != '' && env.REGISTRY_PASSWORD != ''
        run: |
          echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_URL -u "$REGISTRY_USER" --password-stdin
        
      - name: Build Execution Environment
        run: |
          . /tmp/venv/bin/activate
          cd execution-environment
          # Build using ansible-builder which drives docker
          # We pass -v 3 for verbosity to see what's happening
          ansible-builder build --tag ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} --tag ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest -v 3

          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

  update-aap:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: build-ee
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          # Only jq needed for JSON parsing
          echo "Using curl for API calls"

      - name: Configure AAP Execution Environment
        env:
          AAP_URL: ${{ secrets.AAP_URL || vars.AAP_URL }}
          AAP_USERNAME: ${{ secrets.AAP_USERNAME || vars.AAP_USERNAME }}
          AAP_PASSWORD: ${{ secrets.AAP_PASSWORD }}
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          REGISTRY_USER: ${{ vars.GIT_BOT_NAME }}
          REGISTRY_PASSWORD: ${{ secrets.GIT_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          # Create or update Container Registry credential
          CRED_SEARCH=$(curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
            "$AAP_URL/api/v2/credentials/?name=Gitea+Registry" | jq -r '.results[0].id // empty')
          
          CRED_PAYLOAD=$(jq -n \
            --arg name "Gitea Registry" \
            --arg host "$REGISTRY_URL" \
            --arg user "$REGISTRY_USER" \
            --arg pass "$REGISTRY_PASSWORD" \
            '{
              name: $name,
              organization: 1,
              credential_type: 8,
              inputs: {
                host: $host,
                username: $user,
                password: $pass,
                verify_ssl: true
              }
            }')
          
          if [ -z "$CRED_SEARCH" ]; then
            echo "Creating new credential..."
            CRED_RESP=$(curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$CRED_PAYLOAD" \
              "$AAP_URL/api/v2/credentials/")
            CRED_ID=$(echo "$CRED_RESP" | jq -r '.id')
            echo "Created credential ID: $CRED_ID"
          else
            echo "Updating existing credential ID: $CRED_SEARCH"
            curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
              -H "Content-Type: application/json" \
              -X PATCH \
              -d "$CRED_PAYLOAD" \
              "$AAP_URL/api/v2/credentials/$CRED_SEARCH/" > /dev/null
            CRED_ID="$CRED_SEARCH"
          fi
          
          # Create or update Execution Environment
          EE_SEARCH=$(curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
            "$AAP_URL/api/v2/execution_environments/?name=AlmaLinux+EE" | jq -r '.results[0].id // empty')
          
          IMAGE_URL="${REGISTRY_URL}/${IMAGE_NAME}:latest"
          EE_PAYLOAD=$(jq -n \
            --arg name "AlmaLinux EE" \
            --arg image "$IMAGE_URL" \
            --arg cred "$CRED_ID" \
            '{
              name: $name,
              image: $image,
              pull: "always",
              credential: ($cred | tonumber)
            }')
          
          if [ -z "$EE_SEARCH" ]; then
            echo "Creating new Execution Environment..."
            EE_RESP=$(curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$EE_PAYLOAD" \
              "$AAP_URL/api/v2/execution_environments/")
            EE_ID=$(echo "$EE_RESP" | jq -r '.id')
            echo "Created EE ID: $EE_ID"
          else
            echo "Updating existing EE ID: $EE_SEARCH"
            curl -s -k -u "$AAP_USERNAME:$AAP_PASSWORD" \
              -H "Content-Type: application/json" \
              -X PATCH \
              -d "$EE_PAYLOAD" \
              "$AAP_URL/api/v2/execution_environments/$EE_SEARCH/" > /dev/null
          fi
          
          echo "✓ AAP Configuration Complete"

