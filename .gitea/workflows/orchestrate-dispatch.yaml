name: orchestrate-dispatch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (lab|prod)"
        required: true
        default: "lab"
      action:
        description: "terraform action (plan|apply)"
        required: true
        default: "plan"
      build_packer:
        description: "Build Packer template first (true|false)"
        required: true
        default: "false"
      packer_force:
        description: "Force rebuild existing template (true|false)"
        required: false
        default: "false"

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform fmt/validate (lab)
        run: |
          terraform -chdir=terraform/envs/lab init -backend=false
          terraform -chdir=terraform/envs/lab fmt -check
          terraform -chdir=terraform/envs/lab validate

      - name: Terraform fmt/validate (prod)
        run: |
          terraform -chdir=terraform/envs/prod init -backend=false
          terraform -chdir=terraform/envs/prod fmt -check
          terraform -chdir=terraform/envs/prod validate

  packer-build:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Respect build_packer input
        id: gate
        run: |
          set -euo pipefail
          VAL=$(jq -r '.inputs.build_packer // "false"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo false)
          if [ "$VAL" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Packer build (build_packer != true)"
          fi

      - name: Generate ephemeral SSH key for template communicator
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        run: |
          ssh-keygen -t ed25519 -N "" -C "ci@orchestrate" -f /tmp/ci_key
          echo "SSH_PUBLIC_KEY=$(cat /tmp/ci_key.pub)" >> $GITHUB_ENV

      - name: Packer build template
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        env:
          VCENTER_SERVER: ${{ secrets.VCENTER_SERVER || vars.VCENTER_SERVER || vars.vcenter_server || secrets.VSPHERE_SERVER || vars.VSPHERE_SERVER || vars.vsphere_server }}
          VSPHERE_USER: ${{ secrets.VSPHERE_USER }}
          VSPHERE_PASSWORD: ${{ secrets.VSPHERE_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "${VCENTER_SERVER:-}" ] || [ -z "${VSPHERE_USER:-}" ] || [ -z "${VSPHERE_PASSWORD:-}" ]; then
            echo "Missing required Packer inputs: VCENTER_SERVER, VSPHERE_USER, or VSPHERE_PASSWORD not set (check Gitea secrets/variables)." >&2
            exit 1
          fi
          # Normalize vcenter_server: strip any scheme (http://, https://, or typos like http//) and any path (/sdk)
          RAW_VC="$VCENTER_SERVER"
          NORM_VC="${RAW_VC#http://}"; NORM_VC="${NORM_VC#https://}"
          NORM_VC="${NORM_VC#http//}";  NORM_VC="${NORM_VC#https//}"
          NORM_VC="${NORM_VC%%/*}"
          if [ -z "$NORM_VC" ] || [ "$NORM_VC" = "http" ] || [ "$NORM_VC" = "https" ]; then
            echo "VCENTER_SERVER value '$RAW_VC' is invalid after normalization; please set to just host or IP (e.g., 10.37.10.35)." >&2
            exit 1
          fi
          echo "Using vCenter host: $NORM_VC"
          FORCE=$(jq -r '.inputs.packer_force // "false"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo false)
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="-force"; fi
          packer init packer
          packer build $EXTRA \
            -var "vcenter_server=${NORM_VC}" \
            -var "vcenter_username=${VSPHERE_USER}" \
            -var "vcenter_password=${VSPHERE_PASSWORD}" \
            -var "ssh_public_key=${SSH_PUBLIC_KEY}" \
            -var "ssh_private_key_file=/tmp/ci_key" \
            packer/alma-template.pkr.hcl

  terraform:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: [validate, packer-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select environment from inputs
        id: envsel
        run: |
          set -euo pipefail
          ENVIRONMENT=$(jq -r '.inputs.environment // "lab"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo lab)
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "TF_DIR=terraform/envs/prod" >> "$GITHUB_OUTPUT"
            echo "TF_VARS=prod.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "TF_DIR=terraform/envs/lab" >> "$GITHUB_OUTPUT"
            echo "TF_VARS=lab.tfvars" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init with S3-compatible backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          TF_DIR="${{ steps.envsel.outputs.TF_DIR }}"
          if [ -f "$TF_DIR/backend.s3.secrets.hcl" ]; then
            echo "Found local backend.s3.secrets.hcl; using it for init"
            terraform -chdir="$TF_DIR" init \
              -backend-config=backend.hcl \
              -backend-config=backend.s3.secrets.hcl \
              -reconfigure \
              -input=false
          else
            echo "No local backend.s3.secrets.hcl; using CI-provided AWS_* secrets"
            terraform -chdir="$TF_DIR" init \
              -backend-config=backend.hcl \
              -reconfigure \
              -input=false
          fi

      - name: Terraform plan/apply based on input
        env:
          TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
          TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          ACTION=$(jq -r '.inputs.action // "plan"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo plan)
          TF_DIR="${{ steps.envsel.outputs.TF_DIR }}"
          TF_VARS_FILE="${{ steps.envsel.outputs.TF_VARS }}"
          # Always produce a fresh plan with the selected var-file for safety
          terraform -chdir="$TF_DIR" plan -var-file="$TF_VARS_FILE" -out=tfplan.out
          if [ "$ACTION" = "apply" ]; then
            terraform -chdir="$TF_DIR" apply -auto-approve tfplan.out
          else
            echo "ACTION=$ACTION; plan only"
          fi

      - name: Sync inventories from Terraform outputs (pre-AAP)
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: "true"
          GIT_AUTHOR_NAME: ${{ vars.GIT_BOT_NAME || 'ci-bot' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_BOT_EMAIL || 'ci-bot@local' }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_BOT_NAME || 'ci-bot' }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_BOT_EMAIL || 'ci-bot@local' }}
        run: |
          set -euo pipefail
          # Terraform apply (via local_file) has already updated the inventory files if needed.
          # We just need to check if there are changes and commit them.
          if [ -n "$(git status --porcelain ansible/inventories)" ]; then
            echo "Inventory changes detected."
            git add ansible/inventories
            git commit -m "Inventory sync (pre-AAP): lab & prod"
            git push
          else
            echo "No inventory changes."
          fi

      - name: Snapshot IaC after prod apply
        if: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: "true"
          TF_SNAPSHOT_BUCKET: ${{ secrets.TF_SNAPSHOT_BUCKET || vars.TF_SNAPSHOT_BUCKET }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
        run: |
          set -euo pipefail

          TF_DIR=terraform/envs/prod
          SHORT=$(echo "${GITHUB_SHA:-$GITEA_SHA}" | cut -c1-7)
          VERSION="iac-prod-$(date -u +%Y%m%d-%H%M)-$SHORT"
          SNAPDIR="/tmp/iac-snap/$VERSION"
          mkdir -p "$SNAPDIR"
          terraform -chdir="$TF_DIR" state pull > "$SNAPDIR/terraform.tfstate"
          cp "$TF_DIR/prod.tfvars" "$SNAPDIR/" 2>/dev/null || true
          terraform -chdir="$TF_DIR" output -json > "$SNAPDIR/outputs.json" || true
          jq -n --arg ver "$VERSION" --arg sha "${GITHUB_SHA:-$GITEA_SHA}" \
               --arg repo "${GITHUB_REPOSITORY:-$GITEA_REPOSITORY}" \
               --arg when "$(date -u +%FT%TZ)" '{version:$ver,sha:$sha,repo:$repo,when:$when,env:"prod"}' \
               > "$SNAPDIR/manifest.json"
          tar -C /tmp/iac-snap -czf "/tmp/${VERSION}.tgz" "$VERSION"
          echo "SNAP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload IaC snapshot artifact
        if: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply' }}
        uses: actions/upload-artifact@v3
        with:
          name: iac-snapshot-prod
          path: /tmp/iac-prod-*.tgz
          retention-days: 30

      - name: Copy IaC snapshot to S3 (optional)
        if: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply' && (secrets.TF_SNAPSHOT_BUCKET != '' || vars.TF_SNAPSHOT_BUCKET != '') }}
        env:
          # Prefer dedicated Backblaze/Snapshot credentials, fallback to generic AWS_*
          AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOT_S3_ACCESS_KEY_ID || secrets.B2_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOT_S3_SECRET_ACCESS_KEY || secrets.B2_APPLICATION_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.SNAPSHOT_S3_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.SNAPSHOT_S3_REGION || vars.SNAPSHOT_S3_REGION || 'us-east-005' }}
          AWS_EC2_METADATA_DISABLED: "true"
          TF_SNAPSHOT_BUCKET: ${{ secrets.TF_SNAPSHOT_BUCKET || vars.TF_SNAPSHOT_BUCKET }}
          AWS_S3_ENDPOINT: ${{ secrets.SNAPSHOT_S3_ENDPOINT || secrets.AWS_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          FILE="/tmp/${SNAP_VERSION}.tgz"
          DEST="s3://${TF_SNAPSHOT_BUCKET}/iac-snapshots/prod/${SNAP_VERSION}/"
          # If no explicit endpoint is provided but the region looks like Backblaze (e.g., us-east-005),
          # default to the Backblaze B2 S3-compatible endpoint.
          if [ -z "${AWS_S3_ENDPOINT:-}" ]; then
            case "${AWS_REGION:-}" in
              us-east-005|us-west-002|eu-central-003|ap-southeast-001)
                AWS_S3_ENDPOINT="https://s3.${AWS_REGION}.backblazeb2.com"
                echo "Using Backblaze S3-compatible endpoint: $AWS_S3_ENDPOINT"
                ;;
            esac
          fi

          ARGS=();
          if [ -n "${AWS_S3_ENDPOINT:-}" ]; then
            ARGS+=(--endpoint-url "$AWS_S3_ENDPOINT")
            aws configure set default.s3.addressing_style path || true
          fi
          aws "${ARGS[@]}" s3 cp "$FILE" "$DEST"

      - name: Create Gitea Release (API, optional)
        if: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply' && (secrets.GIT_TOKEN != '' || secrets.GITEA_TOKEN != '') && (vars.GIT_SERVER_URL != '' || secrets.GIT_SERVER_URL != '') }}
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITEA_TOKEN }}
          # GIT_SERVER_URL should be a repository variable (non-secret); fallback to secret of same name only
          GIT_SERVER_URL: ${{ vars.GIT_SERVER_URL || secrets.GIT_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_SERVER_URL:-}" ]; then echo "No GIT_SERVER_URL; skipping release"; exit 0; fi
          OWNER=$(echo "${GITHUB_REPOSITORY:-$GITEA_REPOSITORY}" | cut -d/ -f1)
          REPO=$(echo "${GITHUB_REPOSITORY:-$GITEA_REPOSITORY}" | cut -d/ -f2)
          TAG="$SNAP_VERSION"
          NAME="IaC snapshot: $SNAP_VERSION"
          BODY="Automated IaC snapshot for prod apply at ${SNAP_VERSION}."
          # Build JSON body with jq to avoid heredoc YAML parsing issues
          jq -n --arg tag "$TAG" --arg target "${GITHUB_SHA:-$GITEA_SHA}" --arg name "$NAME" --arg body "$BODY" \
            '{tag_name:$tag, target_commitish:$target, name:$name, body:$body}' > /tmp/release_body.json
          HTTP=$(curl -sS -o /tmp/release.json -w "%{http_code}" -X POST "${GIT_SERVER_URL}/api/v1/repos/${OWNER}/${REPO}/releases" \
            -H "Authorization: token ${GIT_TOKEN}" -H 'Content-Type: application/json' \
            -d @/tmp/release_body.json)
          echo "Create release HTTP=$HTTP"; cat /tmp/release.json || true
          REL_ID=$(jq -r '.id // empty' /tmp/release.json || true)
          if [ -n "$REL_ID" ]; then
            FILE="/tmp/${SNAP_VERSION}.tgz"; NAME_FILE="${SNAP_VERSION}.tgz"
            UP_HTTP=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST "${GIT_SERVER_URL}/api/v1/repos/${OWNER}/${REPO}/releases/${REL_ID}/assets?name=${NAME_FILE}" \
              -H "Authorization: token ${GIT_TOKEN}" \
              -F "attachment=@${FILE}")
            echo "Upload asset HTTP=$UP_HTTP"; cat /tmp/asset.json || true
          fi

      - name: Fallback tag push (optional)
        if: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply' && secrets.GIT_TOKEN == '' && secrets.GITEA_TOKEN == '' }}
        run: |
          set -euo pipefail
          # Best-effort: create an annotated tag locally; push may depend on runner credentials
          git config user.name "ci"
          git config user.email "ci@local"
          git tag -a "$SNAP_VERSION" -m "IaC snapshot prod apply $SNAP_VERSION" || true
          git push origin "$SNAP_VERSION" || true

  configure-firewall:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: [terraform]
    steps:
      - name: Configure OPNsense firewall for new hosts
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          AAP_URL: ${{ vars.AAP_URL || secrets.AAP_URL }}
          AAP_CLIENT_ID: ${{ secrets.AAP_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.AAP_CLIENT_SECRET }}
          AAP_USERNAME: ${{ vars.AAP_USERNAME }}
          AAP_PASSWORD: ${{ secrets.AAP_PASSWORD }}
          AAP_TOKEN: ${{ secrets.AAP_TOKEN }}
        run: |
          set -euo pipefail
          
          if [ -z "$AAP_URL" ]; then echo "AAP_URL not set; skipping firewall config"; exit 0; fi
          
          # Get authentication token
          AAP_TOKEN_FINAL=""
          if [ -n "$AAP_CLIENT_ID" ] && [ -n "$AAP_CLIENT_SECRET" ] && [ -n "$AAP_USERNAME" ] && [ -n "$AAP_PASSWORD" ]; then
            AUTH_STRING=$(printf "%s:%s" "$AAP_CLIENT_ID" "$AAP_CLIENT_SECRET" | base64 | tr -d '\n')
            TOKEN_RESP=$(curl -s -X POST "$AAP_URL/o/token/" \
              -H "Authorization: Basic $AUTH_STRING" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password" \
              -d "username=$AAP_USERNAME" \
              -d "password=$AAP_PASSWORD")
            AAP_TOKEN_FINAL=$(echo "$TOKEN_RESP" | jq -r '.access_token')
          elif [ -n "$AAP_TOKEN" ]; then
            AAP_TOKEN_FINAL="$AAP_TOKEN"
          else
            echo "No AAP credentials; skipping firewall config"
            exit 0
          fi
          
          AUTH_HEADER="Authorization: Bearer $AAP_TOKEN_FINAL"
          
          # Find the OPNsense firewall job template
          echo "Resolving 'Configure OPNsense Firewall' Job Template..."
          FIREWALL_TEMPLATE=$(curl -s -H "$AUTH_HEADER" \
            "$AAP_URL/api/controller/v2/job_templates/?name=Configure+OPNsense+Firewall")
          FIREWALL_ID=$(echo "$FIREWALL_TEMPLATE" | jq -r '.results[0].id // empty')
          
          if [ -z "$FIREWALL_ID" ] || [ "$FIREWALL_ID" = "null" ]; then
            echo "Warning: 'Configure OPNsense Firewall' job template not found in AAP"
            echo "Skipping firewall configuration"
            exit 0
          fi

          # Project Sync
          PROJECT_ID=$(echo "$FIREWALL_TEMPLATE" | jq -r '.results[0].project // empty')
          if [ -n "$PROJECT_ID" ] && [ "$PROJECT_ID" != "null" ]; then
            echo "Triggering Project Update for Project ID: $PROJECT_ID"
            UPDATE_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" "$AAP_URL/api/controller/v2/projects/$PROJECT_ID/update/")
            UPDATE_JOB_ID=$(echo "$UPDATE_RESP" | jq -r '.id // empty')
            if [ -n "$UPDATE_JOB_ID" ] && [ "$UPDATE_JOB_ID" != "null" ]; then
               echo "Project Update Job ID: $UPDATE_JOB_ID. Waiting..."
               while true; do
                 sleep 5
                 JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/project_updates/$UPDATE_JOB_ID/" | jq -r '.status')
                 echo "Project Update Status: $JOB_STATUS"
                 if [ "$JOB_STATUS" == "successful" ]; then break; fi
                 if [ "$JOB_STATUS" == "failed" ] || [ "$JOB_STATUS" == "error" ] || [ "$JOB_STATUS" == "canceled" ]; then
                   echo "::error::Project Update Failed: $JOB_STATUS"; exit 1
                 fi
               done
            fi
          fi
          
          echo "Launching firewall configuration job (Template ID: $FIREWALL_ID)..."
          LAUNCH_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            "$AAP_URL/api/controller/v2/job_templates/$FIREWALL_ID/launch/")
          JOB_ID=$(echo "$LAUNCH_RESP" | jq -r '.id // empty')
          
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Failed to launch firewall job. Response:"
            echo "$LAUNCH_RESP" | jq .
            exit 1
          fi
          
          echo "Firewall Job ID: $JOB_ID. Waiting for completion..."
          while true; do
            sleep 5
            JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/jobs/$JOB_ID/" | jq -r '.status')
            echo "Firewall Status: $JOB_STATUS"
            if [ "$JOB_STATUS" == "successful" ]; then
              echo "✓ Firewall configuration completed successfully"
              break
            elif [ "$JOB_STATUS" == "failed" ] || [ "$JOB_STATUS" == "error" ] || [ "$JOB_STATUS" == "canceled" ]; then
              echo "::error::Firewall configuration failed with status: $JOB_STATUS"
              echo "::error::Firewall rules may not be in place. Check AAP job output."
              exit 1
            fi
          done

  onboard-hosts:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: [configure-firewall]
    steps:
      - name: Onboard new hosts with ansible user
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          AAP_URL: ${{ vars.AAP_URL || secrets.AAP_URL }}
          AAP_CLIENT_ID: ${{ secrets.AAP_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.AAP_CLIENT_SECRET }}
          AAP_USERNAME: ${{ vars.AAP_USERNAME }}
          AAP_PASSWORD: ${{ secrets.AAP_PASSWORD }}
          AAP_TOKEN: ${{ secrets.AAP_TOKEN }}
        run: |
          set -euo pipefail
          
          if [ -z "$AAP_URL" ]; then echo "AAP_URL not set; skipping onboarding"; exit 0; fi
          
          # Get authentication token
          AAP_TOKEN_FINAL=""
          if [ -n "$AAP_CLIENT_ID" ] && [ -n "$AAP_CLIENT_SECRET" ] && [ -n "$AAP_USERNAME" ] && [ -n "$AAP_PASSWORD" ]; then
            AUTH_STRING=$(printf "%s:%s" "$AAP_CLIENT_ID" "$AAP_CLIENT_SECRET" | base64 | tr -d '\n')
            TOKEN_RESP=$(curl -s -X POST "$AAP_URL/o/token/" \
              -H "Authorization: Basic $AUTH_STRING" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password" \
              -d "username=$AAP_USERNAME" \
              -d "password=$AAP_PASSWORD")
            AAP_TOKEN_FINAL=$(echo "$TOKEN_RESP" | jq -r '.access_token')
          elif [ -n "$AAP_TOKEN" ]; then
            AAP_TOKEN_FINAL="$AAP_TOKEN"
          else
            echo "No AAP credentials; skipping onboarding"
            exit 0
          fi
          
          AUTH_HEADER="Authorization: Bearer $AAP_TOKEN_FINAL"
          
          # Find the Onboard job template
          echo "Resolving 'Onboard Terraform Hosts' Job Template..."
          ONBOARD_TEMPLATE=$(curl -s -H "$AUTH_HEADER" \
            "$AAP_URL/api/controller/v2/job_templates/?name=Onboard+Terraform+Hosts")
          ONBOARD_ID=$(echo "$ONBOARD_TEMPLATE" | jq -r '.results[0].id // empty')
          
          if [ -z "$ONBOARD_ID" ] || [ "$ONBOARD_ID" = "null" ]; then
            echo "Warning: 'Onboard Terraform Hosts' job template not found in AAP"
            echo "Please create it manually or skip onboarding for now"
            exit 0
          fi

          # --- Project Sync ---
          PROJECT_ID=$(echo "$ONBOARD_TEMPLATE" | jq -r '.results[0].project // empty')
          if [ -n "$PROJECT_ID" ] && [ "$PROJECT_ID" != "null" ]; then
            echo "Triggering Project Update for Project ID: $PROJECT_ID"
            UPDATE_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" "$AAP_URL/api/controller/v2/projects/$PROJECT_ID/update/")
            UPDATE_JOB_ID=$(echo "$UPDATE_RESP" | jq -r '.id // empty')
            if [ -n "$UPDATE_JOB_ID" ] && [ "$UPDATE_JOB_ID" != "null" ]; then
               echo "Project Update Job ID: $UPDATE_JOB_ID. Waiting..."
               while true; do
                 sleep 5
                 JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/project_updates/$UPDATE_JOB_ID/" | jq -r '.status')
                 echo "Project Update Status: $JOB_STATUS"
                 if [ "$JOB_STATUS" == "successful" ]; then break; fi
                 if [ "$JOB_STATUS" == "failed" ] || [ "$JOB_STATUS" == "error" ] || [ "$JOB_STATUS" == "canceled" ]; then
                   echo "::error::Project Update Failed: $JOB_STATUS"; exit 1
                 fi
               done
            fi
          fi
          
          echo "Launching onboarding job (Template ID: $ONBOARD_ID)..."
          # Removed limit: manual to respect playbook hosts definition
          LAUNCH_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            "$AAP_URL/api/controller/v2/job_templates/$ONBOARD_ID/launch/")
          JOB_ID=$(echo "$LAUNCH_RESP" | jq -r '.id // empty')
          
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Failed to launch onboarding job. Response:"
            echo "$LAUNCH_RESP" | jq .
            exit 1
          fi
          
          echo "Onboarding Job ID: $JOB_ID. Waiting for completion..."
          while true; do
            sleep 5
            JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/jobs/$JOB_ID/" | jq -r '.status')
            echo "Onboarding Status: $JOB_STATUS"
            if [ "$JOB_STATUS" == "successful" ]; then
              echo "✓ Onboarding completed successfully"
              break
            elif [ "$JOB_STATUS" == "failed" ] || [ "$JOB_STATUS" == "error" ] || [ "$JOB_STATUS" == "canceled" ]; then
              echo "::error::Onboarding failed with status: $JOB_STATUS"
              echo "::error::New hosts may not be accessible. Check AAP job output."
              exit 1
            fi
          done

  ansible-aap:
    runs-on: [self-hosted, linux, x64, alma]
    container: almalinux-cicd:latest
    needs: [terraform]
    steps:

      - name: Trigger AAP Job Template (apply only)
        env:
          # Use repository variable for AAP_URL (non-secret); fallback to secret only if variable unset
          AAP_URL: ${{ vars.AAP_URL || secrets.AAP_URL }}
          # OAuth2 Application Credentials
          AAP_CLIENT_ID: ${{ secrets.AAP_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.AAP_CLIENT_SECRET }}
          AAP_USERNAME: ${{ vars.AAP_USERNAME }}
          AAP_PASSWORD: ${{ secrets.AAP_PASSWORD }}
          # Fallback/Legacy Credentials
          AAP_TOKEN: ${{ secrets.AAP_TOKEN }}
          AAP_JOB_TEMPLATE_NAME: ${{ vars.AAP_JOB_TEMPLATE_NAME }}
          AAP_JOB_TEMPLATE_ID: ${{ secrets.AAP_JOB_TEMPLATE_ID }}
        run: |
          set -euo pipefail
          ACTION=$(jq -r '.inputs.action // "plan"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo plan)
          TARGET_ENV=$(jq -r '.inputs.environment // "lab"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo lab)
          if [ "$ACTION" != "apply" ]; then
            echo "ACTION=$ACTION; skipping AAP trigger (apply only)"
            exit 0
          fi
          
          if [ -z "$AAP_URL" ]; then echo "AAP_URL not set; skipping"; exit 0; fi
          
          AAP_TOKEN_FINAL=""
          
          # Priority 1: OAuth2 Password Grant Flow (Required by AAP Config)
          if [ -n "$AAP_CLIENT_ID" ] && [ -n "$AAP_CLIENT_SECRET" ] && [ -n "$AAP_USERNAME" ] && [ -n "$AAP_PASSWORD" ]; then
             echo "Performing OAuth2 Password Grant Token Exchange..."
             
             # Encode Client ID:Secret for Basic Auth
             AUTH_STRING=$(printf "%s:%s" "$AAP_CLIENT_ID" "$AAP_CLIENT_SECRET" | base64 | tr -d '\n')
             
             # Request Token from /o/token/
             TOKEN_RESP=$(curl -s -X POST "$AAP_URL/o/token/" \
               -H "Authorization: Basic $AUTH_STRING" \
               -H "Content-Type: application/x-www-form-urlencoded" \
               -d "grant_type=password" \
               -d "username=$AAP_USERNAME" \
               -d "password=$AAP_PASSWORD")
             
             AAP_TOKEN_FINAL=$(echo "$TOKEN_RESP" | jq -r '.access_token // empty')
             
             if [ -z "$AAP_TOKEN_FINAL" ]; then
                echo "OAuth2 Token Exchange Failed."
                echo "Response: $TOKEN_RESP"
                echo "::error::Failed to obtain OAuth2 token. Check credentials and AAP configuration."
                exit 1
             fi
             echo "Successfully obtained OAuth2 Bearer Token."
             
          # Priority 2: Static PAT (Legacy/Manual)
          elif [ -n "$AAP_TOKEN" ]; then
             echo "Using static AAP_TOKEN..."
             AAP_TOKEN_FINAL=$(echo "$AAP_TOKEN" | xargs)
          else
             echo "No credentials found (AAP_CLIENT_ID/SECRET or AAP_TOKEN); skipping"
             exit 0
          fi

          AUTH_HEADER="Authorization: Bearer $AAP_TOKEN_FINAL"

          # If ID not provided, attempt lookup by name
          if [ -z "${AAP_JOB_TEMPLATE_ID:-}" ]; then
            if [ -n "${AAP_JOB_TEMPLATE_NAME:-}" ]; then
              echo "Looking up Job Template ID for name: $AAP_JOB_TEMPLATE_NAME"
              
              RESP=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/job_templates/?name=$(printf '%s' "$AAP_JOB_TEMPLATE_NAME" | jq -s -R -r @uri)")
              
              AAP_JOB_TEMPLATE_ID=$(echo "$RESP" | jq -r '.results[0].id // empty')
              if [ -z "$AAP_JOB_TEMPLATE_ID" ]; then
                echo "Could not resolve Job Template name '$AAP_JOB_TEMPLATE_NAME'; skipping"
                echo "Last Response: $RESP"
                exit 0
              fi
              echo "Resolved Job Template ID: $AAP_JOB_TEMPLATE_ID"
            else
              echo "No AAP_JOB_TEMPLATE_ID or AAP_JOB_TEMPLATE_NAME provided; skipping"
              exit 0
            fi
          fi

          # --- Project Sync Logic ---
          echo "Retrieving Project ID for Job Template: $AAP_JOB_TEMPLATE_ID"
          JT_RESP=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/job_templates/$AAP_JOB_TEMPLATE_ID/")
          PROJECT_ID=$(echo "$JT_RESP" | jq -r '.project // empty')
          
          if [ -n "$PROJECT_ID" ] && [ "$PROJECT_ID" != "null" ]; then
            echo "Triggering Project Update for Project ID: $PROJECT_ID"
            UPDATE_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" "$AAP_URL/api/controller/v2/projects/$PROJECT_ID/update/")
            UPDATE_JOB_ID=$(echo "$UPDATE_RESP" | jq -r '.id // empty')
            
            if [ -n "$UPDATE_JOB_ID" ] && [ "$UPDATE_JOB_ID" != "null" ]; then
              echo "Project Update Job ID: $UPDATE_JOB_ID. Waiting for completion..."
              while true; do
                sleep 5
                JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/project_updates/$UPDATE_JOB_ID/" | jq -r '.status')
                echo "Project Update Status: $JOB_STATUS"
                if [ "$JOB_STATUS" == "successful" ]; then
                  echo "Project Update Successful."
                  break
                elif [ "$JOB_STATUS" == "failed" ] || [ "$JOB_STATUS" == "error" ] || [ "$JOB_STATUS" == "canceled" ]; then
                  echo "::error::Project Update Failed with status: $JOB_STATUS"
                  exit 1
                fi
              done
            else
              echo "Warning: Failed to trigger project update. Response: $UPDATE_RESP"
            fi
          else
            echo "Warning: Could not determine Project ID for Job Template. Skipping sync."
          fi

          # --- Inventory Sync Logic ---
          echo "Retrieving Inventory ID for Job Template: $AAP_JOB_TEMPLATE_ID"
          INVENTORY_ID=$(echo "$JT_RESP" | jq -r '.inventory // empty')
          
          if [ -n "$INVENTORY_ID" ] && [ "$INVENTORY_ID" != "null" ]; then
            echo "Found Inventory ID: $INVENTORY_ID. Checking for inventory sources..."
            
            # Get inventory sources
            INV_SOURCES=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/inventories/$INVENTORY_ID/inventory_sources/")
            SOURCE_IDS=$(echo "$INV_SOURCES" | jq -r '.results[].id // empty')
            
            if [ -n "$SOURCE_IDS" ]; then
              for SOURCE_ID in $SOURCE_IDS; do
                echo "Triggering Inventory Source Update for Source ID: $SOURCE_ID"
                INV_UPDATE_RESP=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" "$AAP_URL/api/controller/v2/inventory_sources/$SOURCE_ID/update/")
                INV_UPDATE_JOB_ID=$(echo "$INV_UPDATE_RESP" | jq -r '.id // empty')
                
                if [ -n "$INV_UPDATE_JOB_ID" ] && [ "$INV_UPDATE_JOB_ID" != "null" ]; then
                  echo "Inventory Source Update Job ID: $INV_UPDATE_JOB_ID. Waiting for completion..."
                  while true; do
                    sleep 3
                    INV_JOB_STATUS=$(curl -s -H "$AUTH_HEADER" "$AAP_URL/api/controller/v2/inventory_updates/$INV_UPDATE_JOB_ID/" | jq -r '.status')
                    echo "Inventory Update Status: $INV_JOB_STATUS"
                    if [ "$INV_JOB_STATUS" == "successful" ]; then
                      echo "Inventory Update Successful."
                      break
                    elif [ "$INV_JOB_STATUS" == "failed" ] || [ "$INV_JOB_STATUS" == "error" ] || [ "$INV_JOB_STATUS" == "canceled" ]; then
                      echo "::warning::Inventory Update Failed with status: $INV_JOB_STATUS"
                      break
                    fi
                  done
                else
                  echo "Warning: Failed to trigger inventory source update for Source ID: $SOURCE_ID"
                fi
              done
            else
              echo "No inventory sources found for Inventory ID: $INVENTORY_ID. Skipping inventory sync."
            fi
          else
            echo "Warning: Could not determine Inventory ID for Job Template. Skipping inventory sync."
          fi

          echo "Triggering AAP Job Template ID: $AAP_JOB_TEMPLATE_ID"
          
          # Updated API Path: /api/controller/v2
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$AAP_URL/api/controller/v2/job_templates/${AAP_JOB_TEMPLATE_ID}/launch/" \
            -H "Content-Type: application/json" \
            -H "$AUTH_HEADER" \
            -d '{"extra_vars": {"target_env": "'"$TARGET_ENV"'"}}')
            
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body:"
          echo "$BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "$BODY" | jq . || echo "Warning: Response is not valid JSON"
          else
            echo "Error: AAP API returned HTTP $HTTP_CODE"
            exit 1
          fi
