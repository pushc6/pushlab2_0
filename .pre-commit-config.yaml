repos:
  # Minimal, fast gate: secret scanning. Re-enable other linters incrementally.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks
        name: "gitleaks (protect: staged)"
        # The pre-commit hook uses `gitleaks protect` under the hood.
        # Only pass config; let the hook figure out staged files.
        args: ["--config=.gitleaks.toml", "--no-banner"]
        pass_filenames: false

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      # - id: terraform_docs
      #   args: ['--args=--lockfile=false']

  - repo: https://github.com/ansible/ansible-lint
    rev: v25.6.1
    hooks:
      - id: ansible-lint
        files: ^ansible/
        args: ["--profile=production"]

  # Local hooks
  - repo: local
    hooks:
      - id: sync-inventory-symlinks
        name: "Sync inventory host_vars/group_vars symlinks"
        entry: scripts/sync-inventory-symlinks.sh
        language: script
        files: ^ansible/inventories/.*/host_vars/|^ansible/inventories/.*/group_vars/
        pass_filenames: false
